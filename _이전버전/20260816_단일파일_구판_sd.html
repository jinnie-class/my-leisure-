<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>나의 여가</title>
<style>
/* ===========================================================
   나의 여가 — 공통 스타일
   파스텔 · 수채화 동화풍 · 짙은 갈색 윤곽선 · 큰 터치 영역
   =========================================================== */

:root{
  /* 화면 크기에 따라 전체 글자 크기가 함께 커집니다 (전자칠판 대응) */
  font-size: clamp(17px, calc(0.5vw + 1.15vh), 28px);

  /* 색 자극을 줄인 바탕 — 면은 흰색, 선은 아주 연한 회색 */
  --ink:      #2f2f3d;   /* 본문 글자 */
  --ink-soft: #6a6a7c;
  --line:     #e7e7ef;   /* 윤곽선 : 아주 연한 회색 */
  --line-strong:#c7c7d6;
  --paper:    #ffffff;
  --paper-2:  #f7f8fc;
  --bg:       #f6f8fc;

  /* 코너를 구별하는 색 — 작은 표시에만 쓰고 큰 면에는 칠하지 않습니다 */
  --sky:      #5ec8f2;   /* 계획하GO */
  --green:    #4ecdc4;   /* 알아보GO */
  --purple:   #b39ddb;   /* 기록하GO */
  --apricot:  #f5a86a;   /* 모아보GO */
  --sky-deep: #5ec8f2;
  --green-deep:#4ecdc4;
  --purple-deep:#b39ddb;
  --apricot-deep:#f5a86a;

  /* 고른 것을 표시할 때 쓰는 옅은 바탕 */
  --sel-bg:   #f2f7ff;
  --sel-line: #8fc9ee;

  --ok:       #2fbf71;
  --warn:     #d1603d;

  /* 완성된 문장을 올려 두는 노란 칸 */
  --note:      #fff8dc;
  --note-line: #f2d98a;

  --radius:   22px;
  --radius-s: 14px;
  --shadow:   0 6px 18px rgba(50,60,90,.08);
  --shadow-2: 0 10px 30px rgba(50,60,90,.12);

  --tap: 56px;               /* 주요 버튼 최소 높이 */
  --stage-gap: 34px;         /* 좌우 페이지 사이 간격 */

  /* 내용이 화면 끝까지 늘어지지 않도록 가운데 기둥에 모읍니다.
     (GO! 문구마켓과 같은 폭 규칙 — 한눈에 들어오게 하기 위한 것) */
  --page: 1060px;
  --gutter: 1rem;
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0;
  font-family:"한컴산뜻돋움","HancomSandeutDotum","학교안심 산뜻돋움","Pretendard",
              "Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif;
  color:var(--ink);
  background:var(--bg);
  overflow:hidden;               /* 세로 스크롤 없음 */
  word-break:keep-all;           /* 낱말 중간에서 줄이 끊기지 않게 */
  overflow-wrap:break-word;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}

/* 가운데 기둥 : 넓은 화면에서도 내용이 양옆으로 늘어지지 않습니다 */
.pagepad{
  padding-left:max(var(--gutter), calc((100% - var(--page)) / 2));
  padding-right:max(var(--gutter), calc((100% - var(--page)) / 2));
}
button,input,textarea,select{ font:inherit; color:inherit; }
button{ cursor:pointer; }
h1,h2,h3,h4,p{ margin:0; }
ul{ margin:0; padding:0; list-style:none; }

/* 포커스는 항상 또렷하게 */
:focus-visible{
  outline:4px solid #e08a3c;
  outline-offset:3px;
  border-radius:8px;
}

/* 움직임 최소화 설정 존중 */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
}

/* ============================ 레이아웃 ============================ */

#root{ height:100%; }

/* 배경 벽지 : 그림 경로는 js/data/activities.js 의 App.IMAGE_BASE 에서 정하고
   앱이 켜질 때 --wallpaper 값으로 넣어 줍니다. 파일이 없으면 그냥 바탕색만 보입니다.
   벽지 위에 막을 덮지 않습니다 — 글은 흰 바에 담아서 읽히게 합니다. */
:root{ --wallpaper:none; --wallpaper-tile:clamp(230px, 22vw, 400px); }

.app{
  position:relative;
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background-color:var(--bg);
  background-image:var(--wallpaper);
  background-repeat:repeat;
  background-size:var(--wallpaper-tile) auto;
  background-position:top left;
}
.app[data-corner="plan"]      { --accent:var(--sky); }
.app[data-corner="map"]       { --accent:var(--green); }
.app[data-corner="diary"]     { --accent:var(--purple); }
.app[data-corner="portfolio"] { --accent:var(--apricot); }
.app[data-corner="home"]      { --accent:#9aa0b4; }

/* 상단 줄 — 바탕 없이 벽지 위에 놓입니다 (제목과 단추만) */
.topbar{
  flex:0 0 auto;
  display:flex; align-items:center; gap:.6rem;
  padding-top:.5rem; padding-bottom:.35rem;
  background:transparent; border:0; box-shadow:none;
  position:relative; z-index:2;
}
.topbar .title{
  position:relative; padding-left:.75rem;
  font-size:1.3rem; font-weight:900; letter-spacing:-.02em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.topbar .title::before{
  content:""; position:absolute; left:0; top:.1em; bottom:.1em;
  width:6px; border-radius:999px; background:var(--accent, #9aa0b4);
}
.topbar .sub{ font-size:.85rem; color:var(--ink-soft); white-space:nowrap; padding-left:.75rem; }
.topbar .spacer{ flex:1 1 auto; }

/* 본문 무대 : 내용은 흰 칸(panel) 안에 담기고, 그 바깥은 벽지가 보입니다.
   흰 칸은 내용만큼만 차지하고 화면 아래까지 늘어나지 않습니다. */
.stage{
  flex:0 1 auto; min-height:0; position:relative;
  display:flex; justify-content:center; align-items:flex-start;
}
/* 지도처럼 높이를 다 써야 하는 화면 */
.app[data-corner="map"] .stage{ flex:1 1 auto; }
.panel{
  width:min(100%, var(--page));
  max-height:100%;
  display:flex; flex-direction:column;
  background:#fff;
  border:1px solid var(--line);
  border-radius:26px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.stage-track,
.stage-fit{
  min-height:0;
  padding:.75rem 1rem;
}
.stage-track{
  /* 내용이 짧으면 그만큼만, 길면 흰 칸 높이에 맞춰 줄어듭니다.
     (줄어들 때 높이가 확정되어야 좌우 페이지 나누기가 동작합니다) */
  flex:1 1 auto;
  overflow:hidden;
  column-fill:auto;
  column-gap:var(--stage-gap);
  scroll-behavior:auto;      /* 페이지는 바로 바뀌게 (부드러운 스크롤은 쓰지 않습니다) */
}
.stage-track.no-page{ column-width:auto !important; overflow:hidden; }
.stage-fit{ flex:1 1 auto; overflow:hidden; }

/* 좌우 페이지 이동 — 흰 칸 안쪽 맨 아래 */
.pager{
  flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; gap:.6rem;
  padding:.2rem 0 .7rem;
}
.pager .dots{ font-size:.95rem; font-weight:900; color:var(--ink-soft); min-width:3.5em; text-align:center; }
.pager-btn{
  width:46px; height:46px; border-radius:999px;
  border:2px solid var(--line); background:#fff; box-shadow:var(--shadow);
  display:grid; place-items:center; font-size:1.3rem; font-weight:900; line-height:1;
}
.pager-btn[disabled]{ opacity:.3; cursor:default; box-shadow:none; }

/* 흰 칸 맨 아래에 붙는 '지금 할 일' 단추 — 한 줄을 꽉 채워 눈에 바로 들어옵니다 */
.panel-action{ flex:0 0 auto; padding:0 1.1rem 1.1rem; }
.panel-action .btn{
  width:100%; min-height:66px; font-size:1.2rem;
  background:var(--accent,#5ec8f2); border-color:transparent; color:#fff;
  border-radius:18px; box-shadow:var(--shadow);
}
.panel-action .btn[disabled]{ background:#dcdce6; color:#8a8a9a; }

/* 아래 줄 (이전 / 다음 / 홈) — 바탕 없이, 흰 칸이 끝나는 바로 아래에 붙습니다 */
.bottombar{
  flex:0 0 auto;
  display:flex; align-items:center; gap:.6rem; flex-wrap:wrap;
  padding-top:.6rem; padding-bottom:calc(.6rem + env(safe-area-inset-bottom));
  background:transparent; border:0; box-shadow:none;
  position:relative; z-index:2;
}
.bottombar .spacer{ flex:1 1 auto; }

/* ============================ 버튼 ============================ */

.btn{
  min-height:var(--tap);
  padding:.55rem 1.15rem;
  display:inline-flex; align-items:center; justify-content:center; gap:.45rem;
  border:2px solid var(--line);
  border-radius:999px;
  background:#fff;
  font-size:1.05rem; font-weight:800; color:var(--ink);
  box-shadow:var(--shadow);
  transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
}
.btn:hover{ background:var(--paper-2); box-shadow:var(--shadow); }
.btn:active{ transform:translateY(1px); }
.btn[disabled]{ opacity:.42; cursor:default; transform:none; box-shadow:none; }
/* 중요한 단추 하나만 색을 씁니다 */
.btn.primary{ background:var(--accent,#5ec8f2); border-color:transparent; color:#fff; }
.btn.go{ background:var(--paper-2); }
.btn.ok{ background:var(--ok); border-color:transparent; color:#fff; }
.btn.danger{ background:#fff; border-color:#eec3b6; color:var(--warn); }
.btn.ghost{ background:transparent; box-shadow:none; border-style:dashed; }
.btn.small{ min-height:44px; font-size:.92rem; padding:.35rem .8rem; }
.btn.big{ min-height:68px; font-size:1.25rem; padding:.7rem 1.6rem; }
.btn.wide{ width:100%; }
.btn .ico{ width:1.25em; height:1.25em; display:inline-block; }

/* 그림만 있는 둥근 단추 */
/* 그림 단추 : PNG 안에 동그라미까지 그려져 있으므로 테두리·바탕을 두지 않습니다 */
.iconbtn.has-img{
  border:0; background:transparent; box-shadow:none; padding:0;
  width:calc(var(--tap) + 4px); height:calc(var(--tap) + 4px);
}
.iconbtn.has-img:hover{ background:transparent; box-shadow:none; transform:translateY(-1px); }
.iconbtn.has-img img{ width:100%; height:100%; display:block; object-fit:contain; }
/* 동그라미가 없는 그림은 흰 동그라미 단추 안쪽 한가운데에 넣습니다 */
.iconbtn.has-img.inset{
  width:var(--tap); height:var(--tap);
  border:2px solid var(--line); background:#fff; box-shadow:var(--shadow);
}
.iconbtn.has-img.inset:hover{ background:var(--paper-2); box-shadow:var(--shadow-2); }
.iconbtn.has-img.inset img{ width:52%; height:52%; }
/* 소리 꺼짐 : 회색으로 바꾸고 빗금을 그어 한눈에 알 수 있게 */
.iconbtn.has-img.off{ position:relative; }
.iconbtn.has-img.off img{ filter:grayscale(1); opacity:.55; }
.iconbtn.has-img.off::after{
  content:""; position:absolute; left:22%; right:22%; top:48%;
  height:5px; border-radius:999px; background:#d1425c;
  transform:rotate(-45deg); box-shadow:0 0 0 2px #fff;
}

/* 조작용 둥근 단추 — 흰 바탕에 선 아이콘 하나 (읽어주기 · 설정 · 전체화면) */
.iconbtn,
.speak{
  width:var(--tap); height:var(--tap); padding:0; gap:0;
  border:2px solid var(--line); border-radius:999px;
  background:#fff; box-shadow:var(--shadow);
  color:#3a3a48;
  display:inline-flex; align-items:center; justify-content:center;
  flex:0 0 auto;
  transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
}
.iconbtn:hover,.speak:hover{ background:var(--paper-2); box-shadow:var(--shadow); }
.iconbtn:active,.speak:active{ transform:translateY(1px); }
.iconbtn svg{ width:56%; height:56%; display:block; }
.speak .speak-ico{ width:56%; height:56%; display:block; }
.speak .speak-ico svg{ width:100%; height:100%; display:block; }

/* ============================ 카드 ============================ */

.card{
  background:#fff;
  border:2px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  break-inside:avoid;
}

/* 홈의 큰 코너 카드 */
/* 코너 카드는 언제나 2줄 × 2칸, 정사각형 —네 개가 한눈에 들어옵니다.
   칸 크기를 화면 높이에 맞춰 정하고 가운데로 모읍니다. */
.corner-grid{
  display:grid;
  grid-template-columns:repeat(2, clamp(140px, 21vh, 250px));
  justify-content:center;
  gap:clamp(.6rem,1.1vw,1.1rem);
  break-inside:avoid;
}
/* 코너 카드 — 흰 카드. 색은 그림이 놓인 동그라미에만 아주 옅게 씁니다 */
.corner{
  display:flex; flex-direction:column; align-items:center; gap:.4rem;
  padding:clamp(.8rem,1.6vh,1.3rem) .7rem;
  border:2px solid var(--line);
  border-radius:22px;
  background:#fff;
  box-shadow:var(--shadow);
  text-align:center;
  min-height:0;
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
}
.corner:hover{ transform:translateY(-2px); box-shadow:var(--shadow-2); border-color:var(--line-strong); }
.corner:active{ transform:translateY(0); }
.corner{
  aspect-ratio:1;
  flex-direction:column; justify-content:center; align-items:center;
  gap:.5rem; text-align:center; padding:.7rem;
}
.corner .art{
  /* ※ padding 을 %로 주면 '카드 너비' 기준이라 그림이 0 이 됩니다. 반드시 고정값으로. */
  width:clamp(56px,8.5vh,112px); height:clamp(56px,8.5vh,112px);
  flex:0 0 auto;
  border-radius:999px; padding:0;
  display:grid; place-items:center;
  background:color-mix(in srgb, var(--c,#9aa0b4) 16%, #fff);
}
.corner .art svg{ width:60%; height:60%; }
.corner .txt{ min-width:0; }
.corner .art svg{ display:block; }
.corner .name{ display:block; font-size:clamp(1.15rem,1.7vh + .5rem,1.9rem); font-weight:900; letter-spacing:-.03em; }
.corner .desc{ display:block; font-size:.95rem; font-weight:800; color:var(--ink-soft); }
.corner .guide{ font-size:.88rem; color:var(--ink-soft); line-height:1.35; }

/* 활동 카드 (선택용) */
.pick-grid{
  display:grid; gap:clamp(.55rem,1.1vw,1rem);
  grid-template-columns:repeat(3,minmax(0,1fr));
  break-inside:avoid;
}
.pick-grid.cols-2{ grid-template-columns:repeat(2,minmax(0,1fr)); }
.pick-grid.cols-4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
.pick-grid.cols-5{ grid-template-columns:repeat(5,minmax(0,1fr)); }

.pick{
  position:relative;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  gap:.35rem;
  padding:.85rem .55rem .7rem;
  min-height:var(--tap);
  border:2px solid var(--line);
  border-radius:var(--radius);
  background:#fff;
  box-shadow:var(--shadow);
  text-align:center;
  transition:transform .12s ease, background .12s ease;
}
.pick:hover{ background:var(--paper-2); }
.pick:active{ transform:translateY(2px); }
.pick .thumb{
  width:clamp(58px,12.5vh,158px); height:clamp(58px,12.5vh,158px);
  display:grid; place-items:center;
}
/* 사람 그림처럼 위아래로 긴 그림을 담는 자리 */
.pick .thumb.portrait{
  width:auto; height:clamp(74px,15.5vh,200px); aspect-ratio:.66;
}
.pick .thumb svg,.pick .thumb img{ width:100%; height:100%; display:block; object-fit:contain; }
.pick .label{ font-size:clamp(.95rem,.55rem + 1vh,1.35rem); font-weight:800; line-height:1.25; }
.pick .note{ font-size:.82rem; color:var(--ink-soft); }
.pick .more{
  font-size:.78rem; font-weight:800; color:var(--ink-soft);
  border:2px solid var(--line); border-radius:999px; padding:0 .45rem; background:var(--paper-2);
}
/* 선택 상태 : 옅은 바탕 + 파란 테두리 + 체크 표시 (색만으로 구분하지 않음) */
.pick.sel{
  background:var(--sel-bg);
  border-width:3px; border-color:var(--sel-line);
  box-shadow:0 0 0 3px rgba(94,200,242,.22), var(--shadow);
}
.pick .check{
  position:absolute; top:-12px; right:-10px;
  width:36px; height:36px; border-radius:999px;
  background:var(--ok); color:#fff; border:3px solid #fff;
  display:none; place-items:center; font-size:1.1rem; font-weight:900;
}
.pick.sel .check{ display:grid; }
.pick.compact{ flex-direction:row; justify-content:flex-start; gap:.6rem; padding:.55rem .8rem; text-align:left; }
.pick.compact .thumb{ width:clamp(38px,5vh,60px); height:clamp(38px,5vh,60px); }

/* ============================ 공통 조각 ============================ */

.q{
  display:flex; align-items:center; gap:.6rem; flex-wrap:wrap;
  margin-bottom:.7rem; break-inside:avoid;
}
.q h2{ font-size:clamp(1.3rem,1rem + 1.5vh,2.2rem); font-weight:900; letter-spacing:-.03em; }
.q .hint{ font-size:.95rem; color:var(--ink-soft); font-weight:700; }

/* 큰 점 진행 표시 */
.dots-bar{ display:flex; align-items:center; gap:.4rem; }
.dot-big{
  width:14px; height:14px; border-radius:999px;
  background:#fff; border:2px solid var(--line-strong); display:block;
}
.dot-big.done{ background:var(--line-strong); border-color:var(--line-strong); }
.dot-big.on{
  width:20px; height:20px;
  background:var(--accent,#5ec8f2); border-color:var(--accent,#5ec8f2);
  box-shadow:0 0 0 4px color-mix(in srgb, var(--accent,#5ec8f2) 22%, #fff);
}
.dots-num{ font-size:.9rem; font-weight:900; color:var(--ink-soft); margin-left:.25rem; }

.steps{ display:flex; align-items:center; gap:.35rem; flex-wrap:wrap; }
.steps .dot{
  min-width:30px; height:30px; padding:0 .4rem;
  border:2px solid var(--line); border-radius:999px;
  background:#fff; font-size:.82rem; font-weight:900;
  display:inline-flex; align-items:center; justify-content:center;
}
.steps .dot.on{ background:var(--accent-deep,#f5c07a); border-width:3.5px; }
.steps .dot.done{ background:var(--paper-2); color:var(--ok); }

.chip{
  display:inline-flex; align-items:center; gap:.3rem;
  border:2px solid var(--line); border-radius:999px;
  background:#fff; padding:.15rem .6rem;
  font-size:.86rem; font-weight:800;
}
.chip svg{ width:16px; height:16px; }
.chip.tried{ background:var(--paper-2); }
.chip.like{ background:var(--paper-2); }
.chip.challenge{ background:var(--paper-2); }
.chip.unsure{ background:var(--paper-2); }
.chip.none{ background:#fff; color:var(--ink-soft); }

/* 문장 틀의 빈칸 — 낱말 카드를 누르면 채워집니다 */
.blank{
  display:inline-block; min-width:5.5em; padding:.15rem .6rem;
  border-bottom:3px solid var(--sel-line);
  font-size:1.15rem; font-weight:900; text-align:center;
  background:var(--sel-bg); border-radius:8px 8px 0 0;
}

.sentence{
  background:#fff; border:3px dashed var(--line); border-radius:var(--radius);
  padding:.8rem 1rem; font-size:clamp(1.05rem,.7rem + 1.2vh,1.6rem);
  font-weight:800; line-height:1.5; break-inside:avoid;
}
/* 완성된 문장 : 노란 칸에 한 줄에 한 문장씩, 가운데로.
   눌러서 바로 고쳐 쓸 수 있습니다. */
.sentence-box{ display:flex; flex-direction:column; gap:.3rem; }
textarea.sentence-edit{
  width:100%; display:block; resize:none; overflow:auto;
  font-family:inherit; font-size:clamp(1.15rem,.7rem + 1.4vh,1.75rem);
  font-weight:800; line-height:1.55; text-align:center;
  color:var(--ink); background:var(--note); border:3px solid var(--note-line);
  border-radius:var(--radius); padding:.7rem 1rem;
  min-height:calc(3.1em + 1.4rem);
}
textarea.sentence-edit::placeholder{ color:#9a8f6a; font-weight:700; }
textarea.sentence-edit:hover{ border-color:#e8bf3d; }
textarea.sentence-edit:focus{
  outline:none; border-color:#e8bf3d; box-shadow:0 0 0 4px rgba(232,191,61,.28);
}
.sentence-tools{ display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }
.rows{ display:flex; flex-direction:column; gap:.5rem; }
.row{ display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
.row .k{ font-weight:900; min-width:6.5em; color:var(--ink-soft); }
.muted{ color:var(--ink-soft); }
.small{ font-size:.86rem; }
.center{ text-align:center; }
.grow{ flex:1 1 auto; }
.wrap{ display:flex; flex-wrap:wrap; gap:.5rem; }
.stack{ display:flex; flex-direction:column; gap:.7rem; }
.sec{ break-inside:avoid; margin-bottom:.55rem; }
.sec h3{
  font-size:1.1rem; font-weight:900; margin-bottom:.45rem;
  display:flex; align-items:center; gap:.4rem;
}
.divider{ height:3px; background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 20px); margin:.6rem 0; opacity:.5; }

.field{
  border:2px solid var(--line); border-radius:var(--radius-s);
  background:#fff; padding:.55rem .8rem; min-height:52px; width:100%;
  font-size:1.02rem; font-weight:700;
}
textarea.field{ min-height:9rem; line-height:1.6; resize:vertical; }
label.lab{ font-weight:900; font-size:.95rem; display:block; margin-bottom:.25rem; }

.banner{
  border:2px solid var(--line); border-radius:var(--radius);
  padding:.7rem .9rem; background:var(--paper-2); break-inside:avoid;
}
.banner.info{ background:var(--paper-2); }
.banner.warn{ background:#fff; border-color:#eec3b6; }
.banner.ok{ background:var(--paper-2); }

/* 학생 머리표시 */
.who{
  display:flex; align-items:center; gap:.5rem;
  border:2px solid var(--line); border-radius:999px;
  background:#fff; padding:.2rem .8rem .2rem .25rem;
  box-shadow:var(--shadow); min-height:52px;
}
.who .face{ width:40px; height:40px; border-radius:999px; border:2px solid var(--line); background:#fff; overflow:hidden; }
.who .face svg,.who .face img{ width:100%; height:100%; display:block; object-fit:cover; }
.who .nm{ font-weight:900; font-size:1.02rem; }

/* ============================ 모달 ============================ */

.mask{
  position:fixed; inset:0; z-index:60;
  background:rgba(74,51,35,.42);
  display:grid; place-items:center; padding:1rem;
}
.modal{
  width:min(760px,100%); max-height:min(88vh, 100dvh - 2rem); overflow:auto;
  background:#fff; border:2px solid var(--line); border-radius:26px;
  box-shadow:0 8px 0 rgba(74,51,35,.25);
  padding:1.1rem 1.2rem 1rem;
}
.modal h2{ font-size:clamp(1.25rem,.9rem + 1.3vh,1.9rem); font-weight:900; margin-bottom:.5rem; }
/* 팝업 아래 단추는 가운데 정렬 */
.modal .acts{
  display:flex; gap:.6rem; flex-wrap:wrap;
  justify-content:center;
  margin-top:1rem; padding-top:.9rem;
  border-top:1px solid var(--line);
}

/* 짧고 차분한 성공 알림 */
.toast{
  position:fixed; left:50%; bottom:5.2rem; transform:translateX(-50%);
  z-index:70; background:#e3f2e6; border:2px solid var(--line);
  border-radius:999px; padding:.6rem 1.2rem; font-weight:900; font-size:1.05rem;
  box-shadow:var(--shadow); max-width:92vw; text-align:center;
}

/* ============================ 여가 탐험 지도 ============================ */

.map-wrap{
  position:relative; flex:1 1 auto; min-height:170px; overflow:hidden;
  border:2px solid var(--line); border-radius:var(--radius);
  background:
    radial-gradient(900px 520px at 50% 45%, #f4fcf0 0%, rgba(244,252,240,0) 72%),
    #fbfdf7;
}
.map-canvas{ position:absolute; top:0; left:0; transform-origin:0 0; }
.map-paths{ position:absolute; inset:0; pointer-events:none; }
/* '나' 에서 두 섬으로 이어지는 발자국 길 */
.map-foot{
  position:absolute; width:20px; height:20px; pointer-events:none;
  color:var(--sel-line); opacity:.7;
}
.map-foot svg{ width:100%; height:100%; display:block; }
/* 섬 이름 */
.island-label{
  position:absolute; text-align:center;
  font-size:.92rem; font-weight:900; color:var(--ink-soft);
}
/* 팝업 안 선택 카드는 작게 (스크롤이 생기지 않도록) */
.modal .pick .thumb{ width:clamp(48px,7vh,84px); height:clamp(48px,7vh,84px); }
.modal .pick{ padding:.6rem .4rem .5rem; }
.modal .pick .label{ font-size:clamp(.85rem,.5rem + .7vh,1.05rem); }

/* 활동카드 : 그림과 이름만. 상태는 오른쪽 위에 그림표시로만 겹쳐 보입니다. */
.mapcard{
  position:absolute; overflow:visible;
  --cw:106px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.25em;
  padding:8px 6px;
  border:2px solid var(--line); border-radius:18px;
  background:#fff; box-shadow:var(--shadow);
  text-align:center;
}
.mapcard:hover{ background:var(--paper-2); }
.mapcard.indoor{ background:#fff; }
.mapcard.outdoor{ background:#fff; }
.mapcard.tried{ border-color:var(--sel-line); }
/* 그림을 크게 — 카드 높이의 절반 넘게 */
.mapcard .mi{ width:calc(var(--cw) * .52); height:calc(var(--cw) * .52); flex:0 0 auto; }
.mapcard .mi svg,.mapcard .mi img{ width:100%; height:100%; display:block; object-fit:contain; }
.mapcard .mn{
  font-size:clamp(12px, calc(var(--cw) * .125), 22px);
  font-weight:900; line-height:1.15; letter-spacing:-.03em;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
/* 상태 표시 : 카드 오른쪽 위에 겹쳐 놓습니다 (카드 안 글자를 가리지 않게) */
.mapcard .mb{
  position:absolute; top:-10px; right:-6px;
  display:flex; gap:3px; flex-wrap:nowrap;
}
.mapcard .mb i{
  width:clamp(22px, calc(var(--cw) * .19), 34px);
  height:clamp(22px, calc(var(--cw) * .19), 34px);
  border-radius:999px; border:2px solid #fff;
  box-shadow:var(--shadow);
  display:grid; place-items:center; background:#fff;
}
.mapcard .mb i svg{ width:74%; height:74%; }
.mapcard .mb i.tried{ background:var(--paper-2); }
.mapcard .mb i.like{ background:var(--paper-2); }
.mapcard .mb i.challenge{ background:var(--paper-2); }
.mapcard .mb i.unsure{ background:var(--paper-2); }
.mapcard.dim{ opacity:.2; }
.map-me{
  position:absolute; transform:translate(-50%,-50%);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  padding:6px; border:2px solid var(--line); border-radius:24px;
  background:#fff; box-shadow:var(--shadow); text-align:center; overflow:hidden;
}
.map-me .face{ width:56%; aspect-ratio:1; border-radius:999px; border:2px solid var(--line); overflow:hidden; background:#fff; }
.map-me .face svg,.map-me .face img{ width:100%; height:100%; object-fit:cover; display:block; }
.map-me .nm{ font-size:clamp(13px,1.05vw,20px); font-weight:900; }
.map-me .sub{ font-size:clamp(9.5px,.72vw,13px); color:var(--ink-soft); font-weight:800; line-height:1.15; }
.map-legend{
  display:flex; gap:.4rem; flex-wrap:wrap; align-items:center;
}
/* 섬마다 아래에 붙는 이전 / 다음 */
.island-nav{
  position:absolute; z-index:3;
  display:flex; align-items:center; justify-content:center; gap:.6rem;
}
.isl-btn{
  min-height:44px; padding:.2rem 1.1rem;
  border:0; border-radius:999px;
  box-shadow:var(--shadow); font-size:1.02rem; font-weight:900;
}
.isl-btn.prev{ background:#d3ecf9; color:#155e80; }
.isl-btn.next{ background:#ff8f86; color:#fff; }
.isl-btn:hover{ filter:brightness(.97); }
.isl-btn[disabled]{ opacity:.35; cursor:default; box-shadow:none; }
/* 지금 몇 쪽인지 — 글자와 점을 함께 */
.isl-page{
  display:flex; flex-direction:column; align-items:center; gap:2px;
  background:#fff; border:2px solid var(--line); border-radius:16px;
  padding:.2rem .7rem; box-shadow:var(--shadow);
  font-size:.92rem; color:var(--ink); min-width:4.4em;
}
.isl-dots{ display:flex; gap:3px; }
.isl-dots i{ width:6px; height:6px; border-radius:999px; background:#d6d9e4; display:block; }
.isl-dots i.on{ background:#5ec8f2; }

.map-tools{ display:flex; gap:.4rem; align-items:center; flex-wrap:wrap; }
/* '찾아보기' 를 눌렀을 때만 나오는 도구 상자 */
.map-toolbox{
  flex:0 0 auto;
  border:2px solid var(--line); border-radius:var(--radius);
  background:#fff; padding:.5rem .7rem;
}
.map-summary{
  flex:0 0 auto;
  border:2px solid var(--line); border-radius:var(--radius); background:#fff;
  padding:.45rem .8rem; font-weight:800; font-size:1rem; line-height:1.45;
}

/* 화면이 낮을 때에는 지도에 자리를 더 내어 줍니다 */
@media (max-height: 820px), (max-width: 1100px){
  .map-tools .tab{ min-height:42px; font-size:.86rem; padding:.2rem .6rem; }
  .map-summary{
    font-size:.92rem; padding:.35rem .7rem;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
}

/* ============================ 포트폴리오 / 인쇄물 ============================ */

.sheet{
  background:#fff; border:2px solid var(--line); border-radius:18px;
  padding:16px 18px; break-inside:avoid;
}
.sheet .sheet-title{ font-size:1.9rem; font-weight:900; letter-spacing:-.04em; }
.sheet .sheet-meta{ font-size:.92rem; font-weight:800; color:var(--ink-soft); }
.exh-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:.7rem; }
.photo{
  border:2px solid var(--line); border-radius:14px; overflow:hidden; background:#fff;
  aspect-ratio:4/3; display:grid; place-items:center;
}
.photo img{ width:100%; height:100%; object-fit:cover; display:block; }
.photo.empty{ background:#f6efe3; color:var(--ink-soft); font-weight:800; font-size:.85rem; }
.star-badge{
  display:inline-flex; align-items:center; gap:.25rem;
  background:var(--paper-2); border:2px solid var(--line); border-radius:999px;
  padding:.1rem .55rem; font-size:.82rem; font-weight:900;
}

/* 전시 고르기 : 단추 하나로 켜고 끕니다 (켠 상태는 색·아이콘·글자 모두로 표시) */
.exhibit-btn.on{ background:var(--sel-bg); border-color:var(--sel-line); color:#1c6ea4; }
.book-page{
  background:#fff; border:2px solid var(--line); border-radius:18px;
  padding:18px 20px; break-inside:avoid; break-after:page;
}
.book-page + .book-page{ margin-top:1rem; }

/* ============================ 교사 설정 ============================ */

/* ===== 누구의 여가생활일까요? ===== */
.stu-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:.8rem; break-inside:avoid;
}
.stu-card{
  display:flex; align-items:center; gap:.9rem;
  background:#fff; border:2px solid var(--line); border-radius:20px;
  padding:1rem 1.2rem; box-shadow:var(--shadow); min-height:88px; text-align:left;
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
}
.stu-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-2); border-color:var(--sel-line); }
.stu-card-mark{ font-size:2.2rem; line-height:1; flex:0 0 auto; }
.stu-card-name{ font-size:1.5rem; font-weight:900; min-width:0; overflow:hidden; text-overflow:ellipsis; }

/* ===== 캐릭터 고르기 (왼쪽 미리보기 · 오른쪽 목록) ===== */
.cs-cols{ display:flex; gap:1rem; align-items:stretch; min-height:0; }
.cs-preview{
  flex:0 0 30%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.7rem;
  background:var(--paper-2); border:2px solid var(--line); border-radius:20px; padding:1rem; min-width:0;
}
.cs-face{
  width:min(60%, 160px); aspect-ratio:1; border-radius:999px; overflow:hidden;
  border:3px solid var(--line); background:#fff;
}
.cs-name{
  font-size:1.2rem; font-weight:900; background:#fff;
  border:2px solid var(--line); border-radius:14px; padding:.35rem 1.2rem;
}
.cs-pickside{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
.cs-grid{
  flex:1 1 auto; min-height:0;
  display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
  grid-auto-rows:1fr; gap:.5rem;
}
.cs-item{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.15rem;
  background:#fff; border:2px solid var(--line); border-radius:16px; padding:.35rem;
  box-shadow:var(--shadow); min-height:0;
}
.cs-item:hover{ background:var(--paper-2); }
.cs-item.on{ background:var(--sel-bg); border-color:var(--sel-line); box-shadow:0 0 0 3px rgba(94,200,242,.22), var(--shadow); }
.cs-art{ width:100%; flex:1 1 auto; min-height:0; display:grid; place-items:center; }
.cs-art > *{ max-width:100%; max-height:100%; }
.cs-label{ font-size:.86rem; font-weight:800; }
@media (max-width: 820px){
  .cs-cols{ flex-direction:column; }
  .cs-preview{ flex:0 0 auto; flex-direction:row; }
  .cs-face{ width:84px; }
  .cs-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); }
}

/* ===== 선생님 설정 : 한 페이지에서 아래로 내리며 설정 ===== */
.tstage{ flex:1 1 auto !important; }
.tpanel{ align-self:stretch; }
.tscroll{ overflow-y:auto; overflow-x:hidden; padding:1rem 1.2rem 1.4rem; }
.tsec{ padding:.85rem 0; border-top:1px solid var(--line); }
.tsec:first-of-type{ border-top:0; }
.tsec > label{
  display:block; font-size:1.08rem; font-weight:900; margin-bottom:.5rem;
}
.tchoice{
  min-height:48px; padding:.3rem 1rem;
  border:2px solid var(--line); border-radius:14px; background:#fff;
  font-size:1rem; font-weight:800; color:var(--ink); box-shadow:var(--shadow);
}
.tchoice:hover{ background:var(--paper-2); }
.tchoice.on{ background:#e6f7f2; border-color:#7fd6c2; color:#0f6b57; }
.tchoice.sm{ min-height:40px; padding:.2rem .7rem; font-size:.92rem; border-radius:12px; }
.tchoice.ghost{ color:var(--warn); border-color:#eec3b6; }
.tchoice.add{ background:#dff1fb; border-color:#a9dcf5; color:#125b7d; }
.tchoice[disabled]{ opacity:.4; cursor:default; box-shadow:none; }

/* 학생 한 줄 */
.stu-edit{ border:2px solid var(--line); border-radius:16px; padding:.5rem .6rem; background:#fff; }
.stu-mark{
  width:56px; height:52px; flex:0 0 auto;
  border:2px solid var(--line); border-radius:14px; background:var(--paper-2);
  font-size:1.5rem; line-height:1;
}
.stu-marks{ display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.5rem; }
.stu-mark-pick{
  font-size:1.4rem; line-height:1; background:var(--paper-2);
  border:2px solid var(--line); border-radius:12px; padding:.25rem .45rem;
}
.stu-mark-pick.on{ background:#dff1fb; border-color:#7fc9ea; }

.tabs{ display:flex; gap:.4rem; flex-wrap:wrap; }
.tab{
  min-height:46px; padding:.3rem .85rem;
  border:2px solid var(--line); border-radius:999px; background:#fff;
  font-weight:800; font-size:.95rem;
}
.tab.on{ background:var(--apricot); border-width:4px; }
.tbl{ width:100%; border-collapse:collapse; font-size:.92rem; }
.tbl th,.tbl td{ border:2px solid var(--line); padding:.35rem .5rem; text-align:left; }
.tbl th{ background:var(--paper-2); font-weight:900; }
.switch{
  display:inline-flex; align-items:center; gap:.5rem; min-height:48px;
  border:2px solid var(--line); border-radius:999px; background:#fff;
  padding:.15rem .8rem; font-weight:800;
}
.switch b{ font-size:.95rem; }
.switch .pill{
  width:56px; height:30px; border-radius:999px; border:2px solid var(--line);
  background:#e7e7ef; position:relative;
}
.switch .pill::after{
  content:""; position:absolute; top:2px; left:2px; width:22px; height:22px;
  border-radius:999px; background:#fff; border:2px solid var(--line);
  transition:left .15s ease;
}
.switch.on .pill{ background:var(--ok); }
.switch.on .pill::after{ left:28px; }
.switch .txt{ font-size:.86rem; font-weight:900; min-width:2.4em; }

.keypad{ display:grid; grid-template-columns:repeat(3,72px); gap:.5rem; justify-content:center; }
.keypad button{
  height:62px; font-size:1.4rem; font-weight:900;
  border:2px solid var(--line); border-radius:16px; background:#fff; box-shadow:var(--shadow);
}

/* 스크롤 가능한 목록 (교사 설정 등 내부 영역) */
.scrolly{ overflow:auto; max-height:100%; }

/* 인쇄용 자리 : 화면에서는 보이지 않습니다 */
#print-root{ display:none; }

/* ============================ 표지 (첫 화면) ============================ */

/* 표지 화면은 벽지 무늬를 그대로 보여 줍니다.
   (다른 화면은 글씨가 잘 보이도록 옅은 막을 한 겹 덮지만, 표지는 글이 없어서 덮지 않습니다) */
.app.cover-app{
  background-image:var(--wallpaper);
  background-repeat:repeat;
  background-size:var(--wallpaper-tile) auto;
  background-position:top left;
}

.cover{
  flex:1 1 auto; min-height:0;
  display:flex; flex-direction:column;
  padding:.6rem 1rem;
}
.cover-stage{
  flex:1 1 auto; min-height:0;
  display:flex; align-items:center; justify-content:center;
}

/* 표지 그림을 감싸는 액자 — 단추들이 이 안에 놓입니다.
   액자가 그림과 똑같은 비율을 가져서, 화면이 크든 작든 딱 맞게 채워집니다.
   시작하기를 고르면 액자 테두리가 노랗게 밝아집니다. */
.cover-frame{
  position:relative;
  max-width:100%;
  max-height:100%;
  border:5px solid var(--line);
  border-radius:30px;
  background:#fff;
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:border-color .18s ease, box-shadow .18s ease;
}
.cover-frame.is-text{ width:auto; height:auto; }
.cover-img{ display:block; width:100%; height:100%; object-fit:contain; }
.cover-fallback{ padding:3rem 2.5rem 5rem; text-align:center; }
.cover-fallback .cover-title{
  font-size:clamp(2.4rem,1rem + 5vh,4.6rem); font-weight:900; letter-spacing:-.05em;
}
.cover-fallback p{ font-size:1.2rem; font-weight:800; color:var(--ink-soft); margin-top:.4rem; }

/* 표지 안 왼쪽 위 : 지금 학생 */
.cover-who{ position:absolute; top:14px; left:16px; z-index:2; }

/* 표지 안 오른쪽 위 : 전체화면 · 선생님 설정 */
.cover-top{
  position:absolute; top:14px; right:16px; z-index:2;
  display:flex; gap:.5rem; align-items:center;
}

/* 표지 안 가운데 아래 : 시작하기 */
.cover-actions{
  position:absolute; left:0; right:0; bottom:16px; z-index:2;
  display:flex; align-items:center; justify-content:center; gap:.7rem; flex-wrap:wrap;
  padding:0 14px;
}
.start-btn{
  min-height:var(--tap);              /* 56px — 주요 단추 최소 크기 */
  padding:.4rem 1.5rem;
  display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
  border:2px solid var(--line);
  border-radius:999px;
  background:var(--sky);
  font-size:1.12rem;
  font-weight:900; letter-spacing:-.02em; color:var(--ink);
  box-shadow:var(--shadow);
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
}
.start-btn .start-ico{ width:1.25em; height:1.25em; display:block; }
.start-btn .start-ico svg{ width:100%; height:100%; display:block; }

/* 고르는 중 : 단추가 앞으로 나오고 표지 테두리가 노랗게 밝아집니다.
   마우스(:hover) · 키보드(:focus-visible) · 손가락(.lit) 모두 같게 동작합니다. */
.start-btn:hover,
.start-btn:focus-visible,
.cover-app.lit .start-btn{
  background:#4bb8e8;
  transform:translateY(-5px) scale(1.05);
  box-shadow:var(--shadow-2), 0 0 0 5px rgba(94,200,242,.35);
}
.start-btn:active{
  transform:translateY(0) scale(1.01);
  box-shadow:var(--shadow), 0 0 0 5px rgba(94,200,242,.35);
}
.cover-app.lit .cover-frame{
  border-color:var(--sel-line);
  box-shadow:0 0 0 6px rgba(94,200,242,.28), var(--shadow-2);
}

/* 움직임을 줄이는 설정에서는 크기 변화 없이 테두리만 밝아집니다 */
@media (prefers-reduced-motion: reduce){
  .start-btn:hover,
  .start-btn:focus-visible,
  .cover-app.lit .start-btn,
  .start-btn:active{ transform:none; }
}

@media (max-height: 620px){
  .start-btn{ min-height:56px; padding:.45rem 1.7rem; }
  .cover-top{ top:10px; right:12px; }
  .cover-who{ top:10px; left:12px; }
  .cover-actions{ bottom:10px; }
}

/* 반응형 : 좁은 화면 */
@media (max-width: 900px){
  .pick-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .pick-grid.cols-4,.pick-grid.cols-5{ grid-template-columns:repeat(3,minmax(0,1fr)); }
  .topbar .sub{ display:none; }
}
@media (max-width: 620px){
  .pick-grid.cols-4,.pick-grid.cols-5{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .row .k{ min-width:100%; }
}
/* 세로형 태블릿 : 코너 카드 2열 */
@media (max-aspect-ratio: 1/1){
}
/* 아주 납작한 화면 (전자칠판 16:9 등) */
@media (max-height: 560px){
  :root{ --tap:52px; }
  .corner .art{ width:clamp(46px,9vh,72px); height:clamp(46px,9vh,72px); }
}

<style media="print">
/* ===========================================================
   나의 여가 — 인쇄 / PDF 저장용 스타일
   화면의 조작 버튼은 감추고 인쇄 영역만 종이에 담습니다.
   =========================================================== */

@page{ size:A4; margin:12mm; }

html,body{
  height:auto !important;
  overflow:visible !important;
  background:#fff !important;
}

/* 화면 전용 요소 숨기기 */
.topbar,.bottombar,.pager,.mask,.toast,.no-print{ display:none !important; }

/* 앱 껍데기 해제 */
.app{ height:auto !important; display:block !important; overflow:visible !important; background:#fff !important; }
.stage{ height:auto !important; }
.stage-track,.stage-fit{
  height:auto !important;
  overflow:visible !important;
  column-width:auto !important;
  columns:auto !important;
  padding:0 !important;
}

/* 인쇄 영역만 보이기 */
.app{ display:none !important; }
#print-root{ display:block !important; }

.print-area{
  display:block !important;
  color:#2f2318;
}
.print-area .sheet,
.print-area .book-page{
  border:2px solid #6b503a !important;
  box-shadow:none !important;
  page-break-inside:avoid;
  break-inside:avoid;
}
.book-page{ break-after:page; page-break-after:always; }
.book-page:last-child{ break-after:auto; page-break-after:auto; }

.print-area img{ max-width:100%; }
.print-area .btn,.print-area .speak{ display:none !important; }

/* 잉크 절약 : 배경은 옅게 */
*{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }

    });

    var want = (student && student.partnerVariants && student.partnerVariants[p.id]) || p.variants[0].id;
    var hit = p.variants.filter(function (v) { return v.id === want; })[0];
    return hit || p.variants[0];
  };
  App.partnerImage = function (p, student) {
    if (!p) return null;
    var v = App.partnerVariant(p, student);
    var key = v ? v.imageKey : p.imageKey;
    if (!key) return null;
    return encodeURI(App.IMAGE_BASE.partner + key + App.IMAGE_BASE.ext);

<script>
/* ===========================================================
   나의 여가 — 자연스러운 한국어 문장 만들기
   조사(은/는, 이/가, 을/를, 와/과) 처리와 날짜 표현, 문장 조립을 담당합니다.
   =========================================================== */
(function () {
  var App = (window.App = window.App || {});

  /* ------------------------- 받침 판별 ------------------------- */
  /* 숫자·영문으로 끝나는 낱말의 받침 여부 */
  var TAIL_DIGIT = { '0': true, '1': true, '3': true, '6': true, '7': true, '8': true,
                     '2': false, '4': false, '5': false, '9': false };
  var TAIL_ALPHA = { l: true, m: true, n: true, r: true, g: true, b: true, k: true,
                     p: true, t: true, c: true, s: true, x: true, z: true };

  function lastChar(word) {
    var w = String(word == null ? '' : word).replace(/[\s.,!?)"'\]]+$/, '');
    return w.charAt(w.length - 1);
  }

  /* 받침이 있으면 true. 'ㄹ' 받침이면 'rieul' 을 함께 알려 줍니다. */
  function batchimInfo(word) {
    var ch = lastChar(word);
    if (!ch) return { has: false, rieul: false };
    var code = ch.charCodeAt(0);
    if (code >= 0xac00 && code <= 0xd7a3) {
      var t = (code - 0xac00) % 28;
      return { has: t !== 0, rieul: t === 8 };
    }
    if (ch >= '0' && ch <= '9') return { has: !!TAIL_DIGIT[ch], rieul: ch === '1' };
    var lower = ch.toLowerCase();
    if (lower >= 'a' && lower <= 'z') return { has: !!TAIL_ALPHA[lower], rieul: lower === 'l' };
    return { has: false, rieul: false };   // 기호 등은 받침 없음으로 처리
  }

  App.hasBatchim = function (w) { return batchimInfo(w).has; };

  /* 낱말 + 조사 : App.josa('슬라임', '을/를') → '슬라임을' */
  App.josa = function (word, pair) {
    var w = String(word == null ? '' : word);
    if (!w) return '';
    var info = batchimInfo(w);
    var parts = String(pair).split('/');
    var withB = parts[0], withoutB = parts[1] || parts[0];
    if (pair === '으로/로') return w + (info.has && !info.rieul ? '으로' : '로');
    return w + (info.has ? withB : withoutB);
  };
  App.eunNeun = function (w) { return App.josa(w, '은/는'); };
  App.iGa = function (w) { return App.josa(w, '이/가'); };
  App.eulReul = function (w) { return App.josa(w, '을/를'); };
  App.waGwa = function (w) { return App.josa(w, '과/와'); };
  App.iEyo = function (w) { return App.josa(w, '이에요/예요'); };

  /* 목록을 '가위, 풀, 색종이' 처럼 잇기 */
  App.joinList = function (arr, sep) {
    return (arr || []).filter(Boolean).join(sep || ', ');
  };
  /* 목록을 '보드게임과 요리' 처럼 잇기 */
  App.joinAnd = function (arr) {
    var a = (arr || []).filter(Boolean);
    if (a.length === 0) return '';
    if (a.length === 1) return a[0];
    var head = a.slice(0, -1), tail = a[a.length - 1];
    return head.map(function (w) { return App.waGwa(w); }).join(' ') + ' ' + tail;
  };

  /* ------------------------- 날짜 ------------------------- */
  var WEEK = ['일', '월', '화', '수', '목', '금', '토'];

  App.todayKey = function () { return App.dateKey(new Date()); };
  App.dateKey = function (d) {
    var x = (d instanceof Date) ? d : new Date(d);
    var m = x.getMonth() + 1, day = x.getDate();
    return x.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
  };
  App.parseKey = function (key) {
    var p = String(key || '').split('-');
    return new Date(+p[0], (+p[1] || 1) - 1, +p[2] || 1);
  };
  App.addDays = function (key, n) {
    var d = App.parseKey(key); d.setDate(d.getDate() + n); return App.dateKey(d);
  };
  App.addMonths = function (key, n) {
    var d = App.parseKey(key); d.setMonth(d.getMonth() + n); return App.dateKey(d);
  };
  /* '2026년 8월 15일 토요일' */
  App.fmtDateLong = function (key) {
    var d = App.parseKey(key);
    return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + WEEK[d.getDay()] + '요일';
  };
  /* '8월 15일' */
  App.fmtDateShort = function (key) {
    var d = App.parseKey(key);
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
  };
  /* 오늘/내일/어제 */
  App.dayWord = function (key) {
    var t = App.todayKey();
    if (key === t) return '오늘';
    if (key === App.addDays(t, 1)) return '내일';
    if (key === App.addDays(t, -1)) return '어제';
    return null;
  };
  /* 시간 표현 : 'am' | 'pm' | 'HH:MM' | '' */
  App.timeWord = function (time) {
    if (!time) return '';
    if (time === 'am') return '오전';
    if (time === 'pm') return '오후';
    var m = /^(\d{1,2}):(\d{2})$/.exec(time);
    if (!m) return String(time);
    var h = +m[1], mi = +m[2];
    var ampm = h < 12 ? '오전' : '오후';
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return ampm + ' ' + h12 + '시' + (mi ? ' ' + mi + '분' : '');
  };
  /* 문장 앞에 들어갈 때 표현 : '오늘', '8월 20일 오후에' */
  App.whenPhrase = function (key, time) {
    var day = App.dayWord(key) || App.fmtDateShort(key);
    var tw = App.timeWord(time);
    if (tw) return day + ' ' + tw + '에';
    return App.dayWord(key) ? day : day + '에';
  };

  /* ------------------------- 문장 조립 ------------------------- */
  var S = (App.sentences = {});

  function partnerPhrase(partnerId) {
    var p = App.partner(partnerId);
    return p ? p.phrase : '';
  }

  /* 계획 문장 : "나는 오늘 친구와 슬라임 놀이를 할 거예요." */
  S.plan = function (plan) {
    if (!plan) return '';
    var a = App.act(plan.activityId);
    var bits = ['나는'];
    var when = App.whenPhrase(plan.date, plan.time);
    if (when) bits.push(when);
    var pp = partnerPhrase(plan.partnerId);
    if (pp) bits.push(pp);
    bits.push(a ? a.planText : '여가활동을 할 거예요');
    return bits.join(' ') + '.';
  };

  /* 일기 첫 문장 : "나는 오늘 친구와 슬라임 놀이를 했어요." */
  S.diaryLead = function (d) {
    if (!d) return '';
    var a = App.act(d.activityId);
    var bits = ['나는'];
    var when = App.whenPhrase(d.date, '');
    if (when) bits.push(when);
    var pp = partnerPhrase(d.partnerId);
    if (pp) bits.push(pp);
    bits.push(a ? a.diaryText : '여가활동을 했어요');
    return bits.join(' ') + '.';
  };

  /* 기분 문장 : "기분이 신나고 뿌듯했어요." */
  S.diaryMood = function (d) {
    var ids = (d && d.moodIds) || [];
    var ms = ids.map(App.mood).filter(Boolean);
    if (!ms.length) return '';
    if (ms.length === 1) return '기분이 ' + ms[0].past + '.';
    var head = ms.slice(0, -1).map(function (m) { return m.conn; });
    return '기분이 ' + head.join(' ') + ' ' + ms[ms.length - 1].past + '.';
  };

  /* 다시 하기 문장 */
  S.diaryAgain = function (d) {
    var a = App.again(d && d.againId);
    return a ? a.sentence + '.' : '';
  };

  /* 장소 문장 : "공원에서 했어요." (장소가 따로 적혀 있을 때만) */
  S.diaryPlace = function (d) {
    if (!d || !d.place) return '';
    return d.place + '에서 했어요.';
  };

  /* 1단계 일기 전체 문장 */
  S.diaryAutoLines = function (d) {
    return [S.diaryLead(d), S.diaryMood(d), S.diaryAgain(d)].filter(Boolean);
  };
  S.diaryAuto = function (d) { return S.diaryAutoLines(d).join(' '); };

  /* 2단계 문장 틀을 채운 결과 */
  S.diaryFramesLines = function (d) {
    var v = (d && d.frames) || {};
    var a = App.act(d && d.activityId);
    var p = App.partner(d && d.partnerId);
    var out = [];
    var who = v.f1a || (p ? p.name : '');
    var what = v.f1b || (a ? a.name : '');
    if (who && what) out.push('나는 ' + App.waGwa(who) + ' 함께 ' + App.eulReul(what) + ' 했어요.');
    else if (what) out.push('나는 ' + App.eulReul(what) + ' 했어요.');
    else if (who) out.push('나는 ' + App.waGwa(who) + ' 함께 했어요.');
    if (v.f2) out.push('활동을 하니 ' + v.f2 + '했어요.');
    if (v.f3) out.push('가장 기억에 남는 것은 ' + App.iEyo(v.f3) + '.');
    if (v.f4) out.push('다음에는 ' + v.f4 + '하고 싶어요.');
    return out;
  };
  S.diaryFrames = function (d) { return S.diaryFramesLines(d).join(' '); };

  /* 고른 낱말로 저절로 만들어진 문장 — 노란 칸에는 '한 줄에 한 문장' 으로 보여 줍니다 */
  S.diaryMadeLines = function (d) {
    if (!d || d.level === 3) return [];
    return d.level === 2 ? S.diaryFramesLines(d) : S.diaryAutoLines(d);
  };
  S.diaryMade = function (d) { return S.diaryMadeLines(d).join('\n'); };

  /* 학생 수준에 맞는 일기 본문
     bodyEdit : 학생이 점선 칸에서 직접 고쳐 쓴 문장. 있으면 그것을 씁니다. */
  S.diaryShown = function (d) {
    if (!d) return '';
    return (d.bodyEdit !== null && d.bodyEdit !== undefined && d.bodyEdit !== '')
      ? d.bodyEdit : S.diaryMade(d);
  };
  S.diaryBody = function (d) {
    if (!d) return '';
    if (d.level === 3) return d.text || '';
    /* 줄바꿈은 보여 줄 때만 쓰고, 본문으로 옮길 때에는 한 칸 띄우기로 바꿉니다 */
    return (S.diaryShown(d) + (d.text ? ' ' + d.text : ''))
      .replace(/\s*\n\s*/g, ' ').replace(/\s+/g, ' ').trim();
  };

  /* 활동 이름을 문장에 쓰기 좋게 줄인 형태 : '박물관 가기' → '박물관' */
  var TRIM = ['하기', ' 가기', '가기', ' 보기', '보기', ' 키우기', '키우기', ' 모으기'];
  App.shortName = function (a) {
    if (!a) return '';
    var n = a.name;
    for (var i = 0; i < TRIM.length; i++) {
      var t = TRIM[i];
      if (n.length > t.length && n.slice(-t.length) === t) {
        var cut = n.slice(0, n.length - t.length).trim();
        if (cut.length >= 2) return cut;
      }
    }
    return n;
  };

  /* 2단계 문장 틀 "______을/를 했어요" 의 빈칸에 넣기 좋은 낱말
     '캠핑하기' → '캠핑' 처럼 '하기'만 떼어 냅니다.
     ('박물관 가기' 등은 그대로 두어야 자연스럽습니다) */
  App.frameWord = function (a) {
    if (!a) return '';
    var n = a.name;
    if (n.length > 4 && n.slice(-2) === '하기') {
      var cut = n.slice(0, -2).trim();
      if (cut.length >= 2) return cut;
    }
    return n;
  };

  /* 여가지도 요약 문장 (학생 자신의 경험만 이야기합니다) */
  S.mapSummary = function (statusMap, cards) {
    var tried = [], like = [], challenge = [], unsure = 0;
    cards.forEach(function (c) {
      var st = statusMap[c.id];
      if (!st) return;
      if (st.tried) tried.push(App.shortName(c));
      if (st.like) like.push(App.shortName(c));
      if (st.challenge) challenge.push(App.shortName(c));
      if (st.unsure) unsure++;
    });
    var out = [];
    out.push(tried.length
      ? '나는 ' + tried.length + '가지 여가활동을 해봤어요.'
      : '아직 해봤어요 표시를 한 활동이 없어요. 활동을 하고 일기를 쓰면 발자국이 생겨요.');
    if (like.length) out.push('나는 ' + App.eulReul(App.joinAnd(like.slice(0, 4))) + ' 좋아해요.');
    if (challenge.length) out.push('나는 ' + App.joinAnd(challenge.slice(0, 4)) + '에 도전하고 싶어요.');
    if (unsure) out.push('아직 잘 모르겠다고 표시한 활동이 ' + unsure + '가지 있어요.');
    return out;
  };
})();

<script>
/* ===========================================================
   나의 여가 — 사진 보관소
   -----------------------------------------------------------
   · 사진은 용량이 크므로 IndexedDB 에 저장합니다.
   · IndexedDB 를 쓸 수 없는 환경(일부 브라우저의 file:// 등)에서는
     자동으로 localStorage 로 되돌아가 동작합니다.
   · 업로드한 사진은 저장 전에 긴 변 1000px 로 줄입니다.
   · 어떤 경우에도 사진은 기기 밖으로 나가지 않습니다.
   =========================================================== */
(function () {
  var App = (window.App = window.App || {});

  var DB_NAME = 'naui-yeoga-photos';
  var STORE = 'photos';
  var LS_KEY = 'naui-yeoga.photos.fallback';
  var MAX_SIDE = 1000;
  var QUALITY = 0.78;

  var db = null;
  var useFallback = false;
  var cache = {};          // id → { id, studentId, dataUrl, createdAt }
  var readyPromise = null;

  function openDB() {
    return new Promise(function (resolve) {
      var req;
      try {
        if (!window.indexedDB) throw new Error('no indexedDB');
        req = window.indexedDB.open(DB_NAME, 1);
      } catch (e) { useFallback = true; return resolve(null); }

      var settled = false;
      var guard = setTimeout(function () {
        if (!settled) { settled = true; useFallback = true; resolve(null); }
      }, 2500);

      req.onupgradeneeded = function () {
        var d = req.result;
        if (!d.objectStoreNames.contains(STORE)) {
          var os = d.createObjectStore(STORE, { keyPath: 'id' });
          os.createIndex('studentId', 'studentId', { unique: false });
        }
      };
      req.onsuccess = function () {
        if (settled) return; settled = true; clearTimeout(guard);
        db = req.result; resolve(db);
      };
      req.onerror = req.onblocked = function () {
        if (settled) return; settled = true; clearTimeout(guard);
        useFallback = true; resolve(null);
      };
    });
  }

  function readFallback() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); }
    catch (e) { return {}; }
  }
  function writeFallback() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(cache)); return true; }
    catch (e) { return false; }
  }

  function loadAll() {
    return new Promise(function (resolve) {
      if (useFallback || !db) { cache = readFallback(); return resolve(cache); }
      try {
        var tx = db.transaction(STORE, 'readonly');
        var req = tx.objectStore(STORE).getAll();
        req.onsuccess = function () {
          cache = {};
          (req.result || []).forEach(function (r) { cache[r.id] = r; });
          resolve(cache);
        };
        req.onerror = function () { useFallback = true; cache = readFallback(); resolve(cache); };
      } catch (e) { useFallback = true; cache = readFallback(); resolve(cache); }
    });
  }

  function txPut(rec) {
    return new Promise(function (resolve) {
      if (useFallback || !db) { return resolve(writeFallback()); }
      try {
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(rec);
        tx.oncomplete = function () { resolve(true); };
        tx.onerror = function () { useFallback = true; resolve(writeFallback()); };
      } catch (e) { useFallback = true; resolve(writeFallback()); }
    });
  }
  function txDel(id) {
    return new Promise(function (resolve) {
      if (useFallback || !db) { return resolve(writeFallback()); }
      try {
        var tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE)['delete'](id);
        tx.oncomplete = function () { resolve(true); };
        tx.onerror = function () { resolve(false); };
      } catch (e) { resolve(false); }
    });
  }

  var Photos = {
    /* 앱 시작 시 한 번 호출 */
    init: function () {
      if (readyPromise) return readyPromise;
      readyPromise = openDB().then(loadAll);
      return readyPromise;
    },
    isFallback: function () { return useFallback; },

    /* 화면에 바로 쓰는 동기 조회 (init 이후) */
    url: function (id) { var r = cache[id]; return r ? r.dataUrl : null; },
    has: function (id) { return !!cache[id]; },
    listByStudent: function (studentId) {
      return Object.keys(cache).map(function (k) { return cache[k]; })
        .filter(function (r) { return r.studentId === studentId; })
        .sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
    },
    count: function () { return Object.keys(cache).length; },

    /* 파일을 줄여서 저장 → id 를 돌려줍니다 */
    addFile: function (file, studentId, kind) {
      return Photos.resize(file).then(function (dataUrl) {
        return Photos.addDataUrl(dataUrl, studentId, kind);
      });
    },
    addDataUrl: function (dataUrl, studentId, kind) {
      var rec = {
        id: 'ph_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7),
        studentId: studentId || null,
        kind: kind || 'activity',      // 'activity' 활동 사진 | 'work' 작품 사진
        dataUrl: dataUrl,
        createdAt: Date.now()
      };
      cache[rec.id] = rec;
      return txPut(rec).then(function (ok) {
        if (!ok) { delete cache[rec.id]; throw new Error('사진을 저장하지 못했어요.'); }
        return rec.id;
      });
    },
    remove: function (id) {
      delete cache[id];
      return txDel(id);
    },
    removeByStudent: function (studentId) {
      var ids = Object.keys(cache).filter(function (k) { return cache[k].studentId === studentId; });
      return Promise.all(ids.map(function (id) { return Photos.remove(id); }));
    },
    clearAll: function () {
      var ids = Object.keys(cache);
      return Promise.all(ids.map(function (id) { return Photos.remove(id); }));
    },

    /* 내보내기 / 불러오기 */
    exportRecords: function (studentId) {
      return Object.keys(cache).map(function (k) { return cache[k]; })
        .filter(function (r) { return !studentId || r.studentId === studentId; });
    },
    importRecords: function (records, idMap) {
      var jobs = (records || []).map(function (r) {
        var rec = {
          id: r.id, studentId: (idMap && idMap[r.studentId]) || r.studentId,
          kind: r.kind || 'activity', dataUrl: r.dataUrl, createdAt: r.createdAt || Date.now()
        };
        if (!rec.dataUrl) return Promise.resolve();
        cache[rec.id] = rec;
        return txPut(rec);
      });
      return Promise.all(jobs);
    },

    /* 이미지 축소 : 긴 변 1000px, JPEG 품질 0.78 */
    resize: function (file) {
      return new Promise(function (resolve, reject) {
        if (!file) return reject(new Error('사진 파일이 없어요.'));
        var reader = new FileReader();
        reader.onerror = function () { reject(new Error('사진을 읽지 못했어요.')); };
        reader.onload = function () {
          var img = new Image();
          img.onerror = function () { reject(new Error('사진 형식을 읽지 못했어요.')); };
          img.onload = function () {
            var w = img.naturalWidth || img.width;
            var h = img.naturalHeight || img.height;
            var scale = Math.min(1, MAX_SIDE / Math.max(w, h));
            var cw = Math.max(1, Math.round(w * scale));
            var ch = Math.max(1, Math.round(h * scale));
            var cv = document.createElement('canvas');
            cv.width = cw; cv.height = ch;
            var ctx = cv.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, cw, ch);
            ctx.drawImage(img, 0, 0, cw, ch);
            var out;
            try { out = cv.toDataURL('image/jpeg', QUALITY); }
            catch (e) { out = reader.result; }
            resolve(out);
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }
  };

  App.photos = Photos;
})();

</script>

<script>
/* ===========================================================
   나의 여가 — 음성 안내
   브라우저에 들어 있는 Speech Synthesis 기능만 사용합니다.
   외부 음성 API 를 쓰지 않으며, 음성이 없는 브라우저에서도
   오류 없이 글자로만 사용할 수 있습니다.
   =========================================================== */
(function () {
  var App = (window.App = window.App || {});

  var synth = (typeof window !== 'undefined' && window.speechSynthesis) ? window.speechSynthesis : null;
  var voices = [];
  var picked = null;
  var listeners = [];

  function refresh() {
    if (!synth) return;
    try { voices = synth.getVoices() || []; } catch (e) { voices = []; }
    picked = null;
    for (var i = 0; i < voices.length; i++) {
      var v = voices[i];
      var lang = (v.lang || '').toLowerCase().replace('_', '-');
      if (lang === 'ko-kr' || lang.indexOf('ko') === 0) { picked = v; break; }
    }
  }
  if (synth) {
    refresh();
    try { synth.addEventListener('voiceschanged', refresh); }
    catch (e) { synth.onvoiceschanged = refresh; }
  }

  var Speech = {
    /* 이 브라우저에서 음성 안내를 쓸 수 있는지 */
    supported: function () { return !!(synth && typeof window.SpeechSynthesisUtterance === 'function'); },
    hasKorean: function () { return !!picked; },
    speaking: false,

    speak: function (text, opts) {
      if (!Speech.supported() || !text) return false;
      var t = String(text).replace(/\s+/g, ' ').trim();
      if (!t) return false;
      try {
        synth.cancel();
        var u = new window.SpeechSynthesisUtterance(t);
        u.lang = 'ko-KR';
        if (picked) u.voice = picked;
        u.rate = (opts && opts.rate) || 0.94;    // 천천히
        u.pitch = (opts && opts.pitch) || 1.0;
        u.volume = 1;
        u.onstart = function () { Speech.speaking = true; emit(); };
        u.onend = u.onerror = function () { Speech.speaking = false; emit(); };
        synth.speak(u);
        return true;
      } catch (e) { return false; }
    },
    stop: function () {
      if (!synth) return;
      try { synth.cancel(); } catch (e) {}
      Speech.speaking = false; emit();
    },
    onChange: function (fn) {
      listeners.push(fn);
      return function () { listeners = listeners.filter(function (f) { return f !== fn; }); };
    }
  };
  function emit() { listeners.slice().forEach(function (f) { try { f(); } catch (e) {} }); }

  /* 화면을 떠날 때 읽기를 멈춥니다 */
  window.addEventListener('beforeunload', function () { Speech.stop(); });

  App.speech = Speech;
})();

</script>

<script>
/* ===========================================================
   나의 여가 — 자료 보관과 상태 관리
   -----------------------------------------------------------
   · 서버 · 로그인 · 외부 데이터베이스를 쓰지 않습니다.
   · 글자 자료(학생·계획·일기·지도·설정)는 localStorage 에,
     사진은 IndexedDB(js/lib/photos.js) 에 저장합니다.
   · 새로고침하거나 브라우저를 닫았다 열어도 기록이 남습니다.
   =========================================================== */
(function () {
  var App = (window.App = window.App || {});
  var D = App.DATA;

  var KEY = 'naui-yeoga.v1';
  var listeners = [];
  var state = null;

  /* ------------------------- 기본값 ------------------------- */
  function uid(prefix) {
    return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
  }
  function allIds(list) { return list.map(function (x) { return x.id; }); }

  function newStudent(partial) {
    var s = {
      id: uid('st'),
      name: '',
      mark: '🌸',                   // 이름 앞에 붙는 그림 (글자를 못 읽어도 자기 칸을 찾도록)
      gender: 'girl',               // 'girl' | 'boy' — 기본 캐릭터와 사람 그림을 고를 때 씁니다
      avatarId: '',                 // 비어 있으면 성별에 맞는 기본 캐릭터가 나옵니다
      avatarChosen: false,          // 학생이 직접 골랐는지
      diaryLevel: 1,
      planLevel: 'easy',
      hiddenActivityIds: [],
      partnerIds: allIds(D.partners),
      partnerVariants: {},          // 예) { friend:'f', teacher:'m' } — 학생마다 그림 고르기
      moodIds: allIds(D.moods),
      voice: true,
      photo: true,
      mapTools: false,          // 지도의 찾아보기·확대 도구를 학생 화면에 보일지
      folioTools: false,        // 포트폴리오의 기간·인쇄를 학생 화면에 보일지
      portfolio: { rangeId: 'm1', start: '', end: '' },
      review: { r1: '', r2: '', r3: '', r4: '' },
      isSample: false,
      createdAt: Date.now()
    };
    return Object.assign(s, partial || {});
  }
  App.newStudent = newStudent;

  function emptyState() {
    return {
      version: 1,
      currentStudentId: null,
      students: [],
      plans: [],
      diaries: [],
      map: {},
      seeded: false
    };
  }

  /* ------------------------- 예시 자료 ------------------------- */
  function seed(st) {
    var today = App.todayKey();
    var s = newStudent({
      id: 'st_sample1',
      name: '학생 1',
      avatarId: 'bear',
      diaryLevel: 1,
      planLevel: 'easy',
      isSample: true
    });
    st.students = [s];
    st.currentStudentId = s.id;

    st.plans = [{
      id: 'pl_sample1', studentId: s.id, level: 'easy', area: 'indoor',
      activityId: 'toy-slime', cardId: 'toy', partnerId: 'friend',
      date: today, time: 'pm', place: '교실', supplies: ['슬라임', '물티슈'],
      memo: '', createdAt: Date.now(), doneDiaryId: null, isSample: true
    }];

    function diary(o) {
      return Object.assign({
        id: uid('dy'), studentId: s.id, planId: null, level: 1,
        date: today, activityId: 'toy-slime', cardId: 'toy', partnerId: 'friend',
        place: '', moodIds: ['fun'], againId: 'again',
        title: '', text: '', frames: {}, photoIds: [],
        exhibit: false, createdAt: Date.now(), updatedAt: Date.now(), isSample: true
      }, o);
    }
    st.diaries = [
      diary({
        id: 'dy_sample1', date: App.addDays(today, -12),
        activityId: 'boardgame', cardId: 'boardgame', partnerId: 'family',
        place: '교실', moodIds: ['fun', 'proud'], againId: 'again', exhibit: true,
        title: '보드게임을 했어요'
      }),
      diary({
        id: 'dy_sample2', date: App.addDays(today, -6),
        activityId: 'cook-eggrice', cardId: 'cook', partnerId: 'teacher',
        place: '조리실', moodIds: ['proud'], againId: 'again', exhibit: true,
        title: '간장계란밥 만들기'
      }),
      diary({
        id: 'dy_sample3', date: App.addDays(today, -2),
        activityId: 'park', cardId: 'park', partnerId: 'mom',
        place: '공원', moodIds: ['calm'], againId: 'unsure', exhibit: false,
        title: '공원 산책'
      })
    ];

    st.map[s.id] = {
      boardgame: { tried: true, like: true, challenge: false, unsure: false, updatedAt: Date.now() },
      cook:      { tried: true, like: true, challenge: false, unsure: false, updatedAt: Date.now() },
      park:      { tried: true, like: false, challenge: false, unsure: true, updatedAt: Date.now() },
      camping:   { tried: false, like: false, challenge: true, unsure: false, updatedAt: Date.now() },
      museum:    { tried: false, like: false, challenge: true, unsure: false, updatedAt: Date.now() }
    };
    st.seeded = true;
    return st;
  }

  /* ------------------------- 저장 / 불러오기 ------------------------- */
  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (!raw) return seed(emptyState());
    try {
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') throw new Error('bad');
      var base = emptyState();
      var out = Object.assign(base, parsed);
      out.students = (out.students || []).map(function (s) { return Object.assign(newStudent({}), s); });
      out.plans = out.plans || [];
      out.diaries = out.diaries || [];
      out.map = out.map || {};
      if (!out.students.length) return seed(emptyState());
      if (!out.currentStudentId || !out.students.some(function (s) { return s.id === out.currentStudentId; })) {
        out.currentStudentId = out.students[0].id;
      }
      return out;
    } catch (e) {
      return seed(emptyState());
    }
  }

  var saveTimer = null;
  var lastSaveError = null;
  function save() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try { localStorage.setItem(KEY, JSON.stringify(state)); lastSaveError = null; }
      catch (e) { lastSaveError = e; }
    }, 120);
  }
  function saveNow() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); lastSaveError = null; return true; }
    catch (e) { lastSaveError = e; return false; }
  }

  function notify() { listeners.slice().forEach(function (f) { try { f(); } catch (e) {} }); }

  function set(mutator) {
    var next = Object.assign({}, state);
    mutator(next);
    state = next;
    save();
    notify();
    return state;
  }

  /* ------------------------- 공개 API ------------------------- */
  var Store = {
    init: function () { if (!state) state = load(); return state; },
    get: function () { if (!state) state = load(); return state; },
    subscribe: function (fn) {
      listeners.push(fn);
      return function () { listeners = listeners.filter(function (f) { return f !== fn; }); };
    },
    saveNow: saveNow,
    lastError: function () { return lastSaveError; },

    /* --------------- 학생 --------------- */
    student: function (id) {
      var st = Store.get();
      var sid = id || st.currentStudentId;
      for (var i = 0; i < st.students.length; i++) if (st.students[i].id === sid) return st.students[i];
      return null;
    },
    current: function () { return Store.student(null); },
    setCurrent: function (id) { set(function (s) { s.currentStudentId = id; }); },
    addStudent: function (partial) {
      var s = newStudent(partial);
      set(function (x) {
        x.students = x.students.concat([s]);
        if (!x.currentStudentId) x.currentStudentId = s.id;
      });
      return s.id;
    },
    updateStudent: function (id, patch) {
      set(function (x) {
        x.students = x.students.map(function (s) {
          return s.id === id ? Object.assign({}, s, patch) : s;
        });
      });
    },
    removeStudent: function (id) {
      set(function (x) {
        x.students = x.students.filter(function (s) { return s.id !== id; });
        x.plans = x.plans.filter(function (p) { return p.studentId !== id; });
        x.diaries = x.diaries.filter(function (d) { return d.studentId !== id; });
        var m = Object.assign({}, x.map); delete m[id]; x.map = m;
        if (x.currentStudentId === id) x.currentStudentId = x.students.length ? x.students[0].id : null;
      });
      if (App.photos) App.photos.removeByStudent(id);
    },

    /* --------------- 계획 --------------- */
    plans: function (studentId) {
      var sid = studentId || Store.get().currentStudentId;
      return Store.get().plans.filter(function (p) { return p.studentId === sid; })
        .sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    },
    plan: function (id) {
      var list = Store.get().plans;
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
      return null;
    },
    todayPlans: function (studentId) {
      var t = App.todayKey();
      return Store.plans(studentId).filter(function (p) { return p.date === t; });
    },
    upcomingPlans: function (studentId) {
      var t = App.todayKey();
      return Store.plans(studentId).filter(function (p) { return p.date > t; })
        .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    },
    addPlan: function (p) {
      var plan = Object.assign({
        id: uid('pl'), studentId: Store.get().currentStudentId, level: 'easy',
        area: 'indoor', activityId: null, cardId: null, partnerId: null,
        date: App.todayKey(), time: '', place: '', supplies: [], memo: '',
        createdAt: Date.now(), doneDiaryId: null, isSample: false
      }, p);
      if (!plan.cardId && plan.activityId) plan.cardId = App.cardIdOf(plan.activityId);
      set(function (x) { x.plans = x.plans.concat([plan]); });
      return plan.id;
    },
    updatePlan: function (id, patch) {
      set(function (x) {
        x.plans = x.plans.map(function (p) { return p.id === id ? Object.assign({}, p, patch) : p; });
      });
    },
    removePlan: function (id) {
      set(function (x) { x.plans = x.plans.filter(function (p) { return p.id !== id; }); });
    },

    /* --------------- 일기 --------------- */
    diaries: function (studentId) {
      var sid = studentId || Store.get().currentStudentId;
      return Store.get().diaries.filter(function (d) { return d.studentId === sid; })
        .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (b.createdAt || 0) - (a.createdAt || 0); });
    },
    diary: function (id) {
      var list = Store.get().diaries;
      for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
      return null;
    },
    diariesInRange: function (studentId, from, to) {
      return Store.diaries(studentId).filter(function (d) {
        return (!from || d.date >= from) && (!to || d.date <= to);
      });
    },
    addDiary: function (d) {
      var diary = Object.assign({
        id: uid('dy'), studentId: Store.get().currentStudentId, planId: null, level: 1,
        date: App.todayKey(), activityId: null, cardId: null, partnerId: null, place: '',
        moodIds: [], againId: null, title: '', text: '', frames: {}, photoIds: [],
        exhibit: false, createdAt: Date.now(), updatedAt: Date.now(), isSample: false
      }, d);
      if (!diary.cardId && diary.activityId) diary.cardId = App.cardIdOf(diary.activityId);
      set(function (x) {
        x.diaries = x.diaries.concat([diary]);
        if (diary.planId) {
          x.plans = x.plans.map(function (p) {
            return p.id === diary.planId ? Object.assign({}, p, { doneDiaryId: diary.id }) : p;
          });
        }
      });
      /* 일기를 저장하면 해당 활동에 '해봤어요' 발자국이 자동으로 생깁니다. */
      if (diary.cardId) Store.setMapState(diary.studentId, diary.cardId, { tried: true });
      return diary.id;
    },
    updateDiary: function (id, patch) {
      set(function (x) {
        x.diaries = x.diaries.map(function (d) {
          return d.id === id ? Object.assign({}, d, patch, { updatedAt: Date.now() }) : d;
        });
      });
    },
    removeDiary: function (id) {
      var d = Store.diary(id);
      set(function (x) {
        x.diaries = x.diaries.filter(function (y) { return y.id !== id; });
        x.plans = x.plans.map(function (p) {
          return p.doneDiaryId === id ? Object.assign({}, p, { doneDiaryId: null }) : p;
        });
      });
      if (d && d.photoIds && App.photos) d.photoIds.forEach(function (pid) { App.photos.remove(pid); });
    },

    /* --------------- 여가 지도 --------------- */
    mapOf: function (studentId) {
      var sid = studentId || Store.get().currentStudentId;
      return Store.get().map[sid] || {};
    },
    statusOf: function (studentId, cardId) {
      var m = Store.mapOf(studentId);
      return m[cardId] || { tried: false, like: false, challenge: false, unsure: false };
    },
    setMapState: function (studentId, cardId, patch) {
      var sid = studentId || Store.get().currentStudentId;
      set(function (x) {
        var m = Object.assign({}, x.map);
        var forStudent = Object.assign({}, m[sid] || {});
        var cur = forStudent[cardId] || { tried: false, like: false, challenge: false, unsure: false };
        forStudent[cardId] = Object.assign({}, cur, patch, { updatedAt: Date.now() });
        m[sid] = forStudent;
        x.map = m;
      });
    },
    toggleMapState: function (studentId, cardId, key) {
      var cur = Store.statusOf(studentId, cardId);
      var patch = {}; patch[key] = !cur[key];
      Store.setMapState(studentId, cardId, patch);
    },

    /* --------------- 예시 자료 / 초기화 --------------- */
    hasSamples: function () {
      var st = Store.get();
      return st.students.some(function (s) { return s.isSample; }) ||
             st.plans.some(function (p) { return p.isSample; }) ||
             st.diaries.some(function (d) { return d.isSample; });
    },
    removeSamples: function () {
      var st = Store.get();
      var sampleStudents = st.students.filter(function (s) { return s.isSample; }).map(function (s) { return s.id; });
      set(function (x) {
        x.students = x.students.filter(function (s) { return !s.isSample; });
        x.plans = x.plans.filter(function (p) { return !p.isSample && sampleStudents.indexOf(p.studentId) < 0; });
        x.diaries = x.diaries.filter(function (d) { return !d.isSample && sampleStudents.indexOf(d.studentId) < 0; });
        var m = Object.assign({}, x.map);
        sampleStudents.forEach(function (id) { delete m[id]; });
        x.map = m;
        if (!x.students.length) { x.currentStudentId = null; }
        else if (sampleStudents.indexOf(x.currentStudentId) >= 0) { x.currentStudentId = x.students[0].id; }
      });
      sampleStudents.forEach(function (id) { if (App.photos) App.photos.removeByStudent(id); });
    },
    resetAll: function () {
      state = emptyState();
      state = seed(state);
      saveNow();
      notify();
      if (App.photos) App.photos.clearAll();
    },

    /* --------------- 내보내기 / 불러오기 --------------- */
    exportData: function (studentId) {
      var st = Store.get();
      var students = studentId ? st.students.filter(function (s) { return s.id === studentId; }) : st.students;
      var ids = students.map(function (s) { return s.id; });
      var map = {};
      ids.forEach(function (id) { if (st.map[id]) map[id] = st.map[id]; });
      return {
        app: '나의 여가',
        version: 1,
        exportedAt: new Date().toISOString(),
        scope: studentId ? 'student' : 'all',
        students: students,
        plans: st.plans.filter(function (p) { return ids.indexOf(p.studentId) >= 0; }),
        diaries: st.diaries.filter(function (d) { return ids.indexOf(d.studentId) >= 0; }),
        map: map,
        photos: App.photos ? App.photos.exportRecords(studentId) : []
      };
    },
    /* mode : 'merge' (덧붙이기) | 'replace' (모두 바꾸기) */
    importData: function (data, mode) {
      if (!data || !Array.isArray(data.students)) throw new Error('불러올 수 있는 파일이 아니에요.');
      var idMap = {};
      var incoming = data.students.map(function (s) { return Object.assign(newStudent({}), s); });

      if (mode === 'replace') {
        state = emptyState();
        state.students = incoming;
        state.plans = (data.plans || []).slice();
        state.diaries = (data.diaries || []).slice();
        state.map = Object.assign({}, data.map || {});
        state.currentStudentId = incoming.length ? incoming[0].id : null;
        state.seeded = true;
        saveNow(); notify();
        if (App.photos) {
          return App.photos.clearAll().then(function () {
            return App.photos.importRecords(data.photos || [], null);
          });
        }
        return Promise.resolve();
      }

      /* 덧붙이기 : id 가 겹치면 새 id 를 부여합니다 */
      var st = Store.get();
      var existing = {};
      st.students.forEach(function (s) { existing[s.id] = true; });
      incoming.forEach(function (s) {
        if (existing[s.id]) { var nid = uid('st'); idMap[s.id] = nid; s.id = nid; }
      });
      var plans = (data.plans || []).map(function (p) {
        var q = Object.assign({}, p);
        q.studentId = idMap[q.studentId] || q.studentId;
        q.id = uid('pl');
        return q;
      });
      var diaries = (data.diaries || []).map(function (d) {
        var q = Object.assign({}, d);
        q.studentId = idMap[q.studentId] || q.studentId;
        q.id = uid('dy');
        q.planId = null;
        return q;
      });
      set(function (x) {
        x.students = x.students.concat(incoming);
        x.plans = x.plans.concat(plans);
        x.diaries = x.diaries.concat(diaries);
        var m = Object.assign({}, x.map);
        Object.keys(data.map || {}).forEach(function (k) {
          m[idMap[k] || k] = Object.assign({}, m[idMap[k] || k] || {}, data.map[k]);
        });
        x.map = m;
        if (!x.currentStudentId && x.students.length) x.currentStudentId = x.students[0].id;
      });
      if (App.photos) return App.photos.importRecords(data.photos || [], idMap);
      return Promise.resolve();
    }
  };

  App.store = Store;
})();

</script>
