<script>
/* ===========================================================
   나의 여가 — 기록하GO! (나의 여가 일기)
   1단계 그림으로 골라 쓰기 · 2단계 문장 틀 완성하기 · 3단계 자유롭게 쓰기
   =========================================================== */
(function () {
  var App = window.App, React = window.React, html = App.html, C = App.C;
  var useState = React.useState;
  var PAGE_SIZE = 6;

  /* ------------------------- 활동 고르기 (일기용) ------------------------- */
  C.ActivityChooser = function (p) {
    var student = p.student;
    var areaS = useState(p.area || null);
    var pageS = useState(0);
    var subS = useState(null);

    if (!areaS[0]) {
      return html`<${React.Fragment}>
        <${C.Question} hint="한 가지를 골라요" speakText="어디에서 했나요?">어디에서 했나요?<//>
        <${C.PickGrid} cols=${2}>
          <${C.Pick} label="실내에서 했어요" speakText="실내에서 했어요"
            onClick=${function () { areaS[1]('indoor'); }} art=${html`<${C.Art} iconKey="door" />`} />
          <${C.Pick} label="실외에서 했어요" speakText="실외에서 했어요"
            onClick=${function () { areaS[1]('outdoor'); }} art=${html`<${C.Art} iconKey="tree" />`} />
        <//>
      <//>`;
    }
    if (subS[0]) {
      var kids = App.visibleChildren(student, subS[0]);
      return html`<${React.Fragment}>
        <${C.Question} speakText=${'무엇을 했나요? ' + subS[0].name}>무엇을 했나요? — ${subS[0].name}<//>
        <${C.PickGrid} cols=${kids.length > 4 ? 3 : 2}>
          ${kids.map(function (ch) {
            return html`<${C.ActivityPick} key=${ch.id} activity=${ch} selected=${p.value === ch.id}
              onClick=${function () { p.onPick(ch.id); subS[1](null); App.speakFor(student, ch.speechName); }} />`;
          })}
        <//>
        <div class="wrap" style=${{ marginTop: '.7rem' }}>
          <${C.Btn} icon="back" onClick=${function () { subS[1](null); }}>다른 활동 고르기<//>
        </div>
      <//>`;
    }
    var cards = App.visibleCards(student, areaS[0]);
    var pages = Math.max(1, Math.ceil(cards.length / PAGE_SIZE));
    var page = Math.min(pageS[0], pages - 1);
    return html`<${React.Fragment}>
      <${C.Question} hint=${'모두 ' + cards.length + '가지'} speakText="무엇을 했나요?">무엇을 했나요?<//>
      <${C.PickGrid} cols=${3}>
        ${cards.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE).map(function (c) {
          var kids = App.visibleChildren(student, c);
          return html`<${C.ActivityPick} key=${c.id} activity=${c} childCount=${kids.length}
            selected=${App.cardIdOf(p.value) === c.id}
            onClick=${function () {
              if (kids.length) { subS[1](c); return; }
              p.onPick(c.id); App.speakFor(student, c.speechName);
            }} />`;
        })}
      <//>
      <div class="wrap" style=${{ marginTop: '.7rem', justifyContent: 'center' }}>
        <${C.Btn} size="small" icon="back" onClick=${function () { areaS[1](null); pageS[1](0); }}>실내·실외 다시 고르기<//>
        ${pages > 1 && html`<${React.Fragment}>
          <${C.Btn} size="small" disabled=${page === 0} onClick=${function () { pageS[1](page - 1); }}>앞 활동<//>
          <span class="chip">${page + 1} / ${pages}</span>
          <${C.Btn} size="small" disabled=${page >= pages - 1} onClick=${function () { pageS[1](page + 1); }}>다음 활동<//>
        <//>`}
      </div>
    <//>`;
  };

  /* ------------------------- 일기 화면 ------------------------- */
  C.DiaryScreen = function (p) {
    App.useStore();
    var student = App.store.current();
    var params = p.params || {};
    var fromPlan = params.planId ? App.store.plan(params.planId) : null;
    var editing = params.diaryId ? App.store.diary(params.diaryId) : null;

    function initial() {
      if (editing) return Object.assign({}, editing);
      var d = {
        planId: fromPlan ? fromPlan.id : null,
        level: (student && student.diaryLevel) || 1,
        date: fromPlan ? fromPlan.date : App.todayKey(),
        activityId: fromPlan ? fromPlan.activityId : null,
        cardId: fromPlan ? fromPlan.cardId : null,
        partnerId: fromPlan ? fromPlan.partnerId : null,
        place: fromPlan ? fromPlan.place : '',
        moodIds: [], againId: null, title: '', text: '', frames: {}, photoIds: [], exhibit: false,
        bodyEdit: null      // 점선 칸에서 직접 고쳐 쓴 문장 (안 고쳤으면 null)
      };
      return d;
    }
    var dr = useState(initial);
    var draft = dr[0], setDraft = dr[1];
    function patch(o) { setDraft(Object.assign({}, draft, o)); }

    var stepS = useState(0);
    var afterS = useState(null);       // 저장 후 물어보는 순서
    var savedIdS = useState(null);
    var helpS = useState(false);
    var editMetaS = useState(false);

    var level = draft.level;
    var moods = App.moodsFor(student);
    var partners = App.partnersFor(student);
    var act = App.act(draft.activityId);

    /* --------------------- 저장 --------------------- */
    function save() {
      if (!draft.activityId) { App.ui.toast('무엇을 했는지 먼저 골라 주세요.'); return; }
      var payload = {
        studentId: student.id, planId: draft.planId, level: draft.level, date: draft.date,
        activityId: draft.activityId, cardId: App.cardIdOf(draft.activityId),
        partnerId: draft.partnerId, place: draft.place, moodIds: draft.moodIds,
        againId: draft.againId, title: draft.title, text: draft.text,
        bodyEdit: draft.bodyEdit || null,
        frames: draft.frames, photoIds: draft.photoIds, exhibit: draft.exhibit
      };
      var id;
      if (editing) {
        App.store.updateDiary(editing.id, payload);
        App.store.setMapState(student.id, payload.cardId, { tried: true });
        id = editing.id;
      } else {
        id = App.store.addDiary(payload);
      }
      savedIdS[1](id);
      afterS[1](0);
      App.speakFor(student, '일기를 잘 기록했어요.');
    }

    /* --------------------- 1단계 --------------------- */
    var L1 = ['언제', '누구와', '무엇을', '어디에서', '기분', '또 하고 싶나', '확인'];
    function level1Body(step) {
      var t = App.todayKey();
      if (step === 0) {
        return html`<${React.Fragment}>
          <${C.Question} speakText="언제 했나요?">언제 했나요?<//>
          <${C.PickGrid} cols=${3}>
            <${C.Pick} selected=${draft.date === t} label="오늘" speakText="오늘"
              onClick=${function () { patch({ date: t }); }} art=${html`<${C.Art} iconKey="sun" />`} />
            <${C.Pick} selected=${draft.date === App.addDays(t, -1)} label="어제" speakText="어제"
              onClick=${function () { patch({ date: App.addDays(t, -1) }); }} art=${html`<${C.Art} iconKey="calendar" />`} />
            <div class="pick" style=${{ cursor: 'default' }}>
              <span class="thumb"><${C.Art} iconKey="pencil" /></span>
              <span class="label">날짜 직접 고르기</span>
              <input class="field" type="date" value=${draft.date}
                onChange=${function (e) { patch({ date: e.target.value || t }); }} />
            </div>
          <//>
        <//>`;
      }
      if (step === 1) {
        return html`<${React.Fragment}>
          <${C.Question} speakText="누구와 했나요?">누구와 했나요?<//>
          <${C.PickGrid} cols=${4}>
            ${partners.map(function (pt) {
              return html`<${C.Pick} key=${pt.id} selected=${draft.partnerId === pt.id}
                label=${pt.name} speakText=${pt.name} portrait=${true}
                onClick=${function () { patch({ partnerId: pt.id }); App.speakFor(student, pt.name); }}
                art=${html`<${C.PartnerArt} partner=${pt} student=${student} />`} />`;
            })}
          <//>
        <//>`;
      }
      if (step === 2) {
        return html`<${C.ActivityChooser} student=${student} value=${draft.activityId}
          area=${act ? act.area : null}
          onPick=${function (id) { var a = App.act(id); patch({ activityId: id, cardId: App.cardIdOf(id),
            place: draft.place || (a ? a.defaultPlace : '') }); }} />`;
      }
      if (step === 3) {
        var sug = [];
        if (act && act.defaultPlace) sug.push(act.defaultPlace);
        ['교실', '집', '학교', '공원', '운동장'].forEach(function (s) { if (sug.indexOf(s) < 0) sug.push(s); });
        return html`<${React.Fragment}>
          <${C.Question} speakText="어디에서 했나요?">어디에서 했나요?<//>
          <${C.PickGrid} cols=${3}>
            ${sug.slice(0, 5).map(function (s) {
              return html`<${C.Pick} key=${s} selected=${draft.place === s} label=${s} speakText=${s}
                onClick=${function () { patch({ place: s }); }} art=${html`<${C.Art} iconKey="map" />`} />`;
            })}
            <div class="pick" style=${{ cursor: 'default' }}>
              <span class="thumb"><${C.Art} iconKey="pencil" /></span>
              <span class="label">직접 쓰기</span>
              <input class="field" value=${draft.place || ''}
                onChange=${function (e) { patch({ place: e.target.value }); }} />
            </div>
          <//>
        <//>`;
      }
      if (step === 4) {
        return html`<${React.Fragment}>
          <${C.Question} hint="여러 개 골라도 좋아요" speakText="기분이 어땠나요?">기분이 어땠나요?<//>
          <${C.PickGrid} cols=${4}>
            ${moods.map(function (m) {
              var on = draft.moodIds.indexOf(m.id) >= 0;
              return html`<${C.Pick} key=${m.id} selected=${on} label=${m.name} speakText=${m.name}
                onClick=${function () {
                  patch({ moodIds: on ? draft.moodIds.filter(function (x) { return x !== m.id; })
                                      : draft.moodIds.concat([m.id]) });
                  if (!on) App.speakFor(student, m.name);
                }}
                art=${html`<${C.Art} iconKey=${m.icon} />`} />`;
            })}
          <//>
        <//>`;
      }
      if (step === 5) {
        return html`<${React.Fragment}>
          <${C.Question} speakText="또 하고 싶나요?">또 하고 싶나요?<//>
          <${C.PickGrid} cols=${3}>
            ${App.DATA.agains.map(function (g) {
              return html`<${C.Pick} key=${g.id} selected=${draft.againId === g.id}
                label=${g.name} speakText=${g.name}
                onClick=${function () { patch({ againId: g.id }); App.speakFor(student, g.name); }}
                art=${html`<${C.Art} iconKey=${g.icon} />`} />`;
            })}
          <//>
        <//>`;
      }
      /* 확인 */
      return html`<${React.Fragment}>
        <${C.Question} hint="맞으면 저장해요" speakText="완성된 일기를 확인해요">완성된 일기를 확인해요<//>
        <${C.SentenceEdit}
          made=${App.sentences.diaryMade(draft)}
          value=${draft.bodyEdit === undefined ? null : draft.bodyEdit}
          placeholder="아직 고른 내용이 없어요. 여기에 직접 써도 돼요."
          onChange=${function (v) { patch({ bodyEdit: v }); }}
          onReset=${function () { patch({ bodyEdit: null }); }} />
        ${photoSection()}
      <//>`;
    }

    /* --------------------- 사진 --------------------- */
    function photoSection() {
      if (student && student.photo === false) return null;
      return html`<${C.Sec} title="활동 사진 · 작품 사진">
        <${C.PhotoPicker} studentId=${student.id} photoIds=${draft.photoIds}
          onAdd=${function (ids) { patch({ photoIds: draft.photoIds.concat(ids) }); }}
          onRemove=${function (id) { patch({ photoIds: draft.photoIds.filter(function (x) { return x !== id; }) }); }} />
      <//>`;
    }

    /* --------------------- 공통 기록 머리 --------------------- */
    function metaBar() {
      var pt = App.partner(draft.partnerId);
      return html`<div class="banner info" style=${{ marginBottom: '.7rem' }}>
        <div class="row">
          <span class="chip"><span aria-hidden="true"
            dangerouslySetInnerHTML=${{ __html: App.icon('calendar') }} />${App.fmtDateShort(draft.date)}</span>
          <span class="chip">${act ? act.name : '활동을 골라 주세요'}</span>
          <span class="chip">${pt ? pt.name : '함께한 사람'}</span>
          <span class="chip">${draft.place || '장소'}</span>
          <div class="grow"></div>
          ${fromPlan && html`<span class="star-badge">계획에서 가져왔어요</span>`}
          <${C.Btn} size="small" icon="pencil" onClick=${function () { editMetaS[1](true); }}>바꾸기<//>
        </div>
      </div>`;
    }

    /* --------------------- 2단계 --------------------- */
    function level2Body() {
      var f = draft.frames || {};
      function setF(k, v) { var n = Object.assign({}, f); n[k] = v; patch({ frames: n }); }
      var pt = App.partner(draft.partnerId);
      if (!f.f1a && pt) f = Object.assign({}, f, { f1a: pt.name });
      if (!f.f1b && act) f = Object.assign({}, f, { f1b: App.frameWord(act) });

      /* 낱말 카드를 먼저 크게 보여 주고, 직접 쓰기는 그 아래 보조로 둡니다.
         (키보드로 치는 것이 어려운 학생이 많아서요) */
      function words(list, k, cur) {
        return html`<div class="wrap" style=${{ marginTop: '.4rem' }}>
          ${list.map(function (w) {
            var on = cur === w;
            return html`<button key=${w} type="button"
              class=${'btn small' + (on ? ' ok' : '')}
              aria-pressed=${on ? 'true' : 'false'}
              onClick=${function () { setF(k, w); App.speakFor(student, w); }}>${on ? '✓ ' : ''}${w}</button>`;
          })}
        </div>`;
      }
      return html`<${React.Fragment}>
        ${metaBar()}
        <${C.Question} hint="빈칸을 채워요" speakText="문장을 완성해요">문장을 완성해요<//>

        <${C.Sec}>
          <div class="row"><b style=${{ fontSize: '1.15rem' }}>나는</b>
            <span class="blank">${f.f1a || '　　　'}</span>
            <b style=${{ fontSize: '1.15rem' }}>와 함께</b>
            <span class="blank">${f.f1b || '　　　'}</span>
            <b style=${{ fontSize: '1.15rem' }}>을 했어요.</b>
          </div>
          ${words(partners.map(function (x) { return x.name; }), 'f1a', f.f1a)}
          ${words(App.visibleCards(student).slice(0, 8).map(function (x) { return App.frameWord(x); }), 'f1b', f.f1b)}
        <//>

        <${C.Sec}>
          <div class="row"><b style=${{ fontSize: '1.15rem' }}>활동을 하니</b>
            <span class="blank">${f.f2 || '　　　'}</span>
            <b style=${{ fontSize: '1.15rem' }}>했어요.</b>
          </div>
          ${words(moods.map(function (m) { return m.stem; }), 'f2', f.f2)}
        <//>

        <${C.Sec}>
          <div class="row"><b style=${{ fontSize: '1.15rem' }}>가장 기억에 남는 것은</b>
            <span class="blank">${f.f3 || '　　　'}</span>
            <b style=${{ fontSize: '1.15rem' }}>이에요.</b>
          </div>
          ${words(['친구와 함께한 것', '만든 작품', '맛있게 먹은 것', '새로 해본 것'], 'f3', f.f3)}
        <//>

        <${C.Sec}>
          <div class="row"><b style=${{ fontSize: '1.15rem' }}>다음에는</b>
            <span class="blank">${f.f4 || '　　　'}</span>
            <b style=${{ fontSize: '1.15rem' }}>하고 싶어요.</b>
          </div>
          ${words(['또', '더 오래', '다른 활동을', '친구와 같이'], 'f4', f.f4)}
        <//>

        <${C.SentenceEdit}
          made=${App.sentences.diaryFramesLines(Object.assign({}, draft, { frames: f })).join('\n')}
          value=${draft.bodyEdit === undefined ? null : draft.bodyEdit}
          onChange=${function (v) { patch({ bodyEdit: v }); }}
          onReset=${function () { patch({ bodyEdit: null }); }} />

        ${moodAndAgain()}
        ${photoSection()}
      <//>`;
    }

    /* 기분 · 또 하고 싶은지 (2·3단계 공통) */
    function moodAndAgain() {
      return html`<${React.Fragment}>
        <${C.Sec} title="오늘의 기분" speakText="오늘의 기분">
          <${C.PickGrid} cols=${4}>
            ${moods.map(function (m) {
              var on = draft.moodIds.indexOf(m.id) >= 0;
              return html`<${C.Pick} key=${m.id} selected=${on} label=${m.name} speakText=${m.name}
                onClick=${function () {
                  patch({ moodIds: on ? draft.moodIds.filter(function (x) { return x !== m.id; })
                                      : draft.moodIds.concat([m.id]) });
                }} art=${html`<${C.Art} iconKey=${m.icon} />`} />`;
            })}
          <//>
        <//>
        <${C.Sec} title="또 하고 싶은 활동인가요?" speakText="또 하고 싶은 활동인가요?">
          <${C.PickGrid} cols=${3}>
            ${App.DATA.agains.map(function (g) {
              return html`<${C.Pick} key=${g.id} selected=${draft.againId === g.id} label=${g.name}
                speakText=${g.name} onClick=${function () { patch({ againId: g.id }); }}
                art=${html`<${C.Art} iconKey=${g.icon} />`} />`;
            })}
          <//>
        <//>
      <//>`;
    }

    /* --------------------- 3단계 --------------------- */
    function level3Body() {
      return html`<${React.Fragment}>
        ${metaBar()}
        <${C.Question} hint="자유롭게 써요" speakText="오늘의 여가 일기를 써요">오늘의 여가 일기를 써요<//>
        <div class="row" style=${{ marginBottom: '.6rem' }}>
          <div class="grow"><${C.Field} label="일기 제목" value=${draft.title}
            placeholder="예) 친구와 슬라임 놀이" onChange=${function (v) { patch({ title: v }); }} /></div>
          <div style=${{ width: '13rem' }}><${C.Field} label="날짜" type="date" value=${draft.date}
            onChange=${function (v) { patch({ date: v || App.todayKey() }); }} /></div>
        </div>
        ${photoSection()}
        <${C.Sec}>
          <div class="row" style=${{ marginBottom: '.3rem' }}>
            <span class="lab grow">오늘 있었던 일을 써 보아요</span>
            <${C.Btn} size="small" icon="book" onClick=${function () { helpS[1](true); }}>문장 도움 보기<//>
          </div>
          <${C.Area} rows=${8} value=${draft.text}
            placeholder="예) 오늘 나는 친구와 슬라임 놀이를 했어요. 말랑말랑해서 재미있었어요."
            onChange=${function (v) { patch({ text: v }); }} />
          <div class="wrap" style=${{ marginTop: '.45rem' }}>
            <${C.Speak} text=${draft.text} label="내가 쓴 글 들어보기" />
          </div>
        <//>
        ${moodAndAgain()}
      <//>`;
    }

    /* --------------------- 화면 조립 --------------------- */
    var step = stepS[0];
    var lastStep = L1.length - 1;
    var body, action = null, backBtn = null;

    if (level === 1) {
      body = html`<${React.Fragment}>
        ${fromPlan && step === 0 && html`<${C.Banner} tone="ok" icon="cornerPlan"
          speakText="계획한 내용을 미리 넣어 두었어요.">
          <b>계획한 내용을 미리 넣어 두었어요.</b>
          <div class="small">${App.sentences.plan(fromPlan)}</div>
          <div class="wrap" style=${{ marginTop: '.4rem' }}>
            <${C.Btn} size="small" kind="ok" icon="next" onClick=${function () { stepS[1](4); }}>계획 내용 그대로 쓰기<//>
          </div>
        <//>`}
        ${step !== 6 && step > 0 ? null : null}
        ${level1Body(step)}
      <//>`;
      /* 홈은 왼쪽 위 하나뿐. 되돌아가기도 위쪽 줄에 둡니다. */
      backBtn = step > 0
        ? html`<${C.Btn} size="small" icon="back" onClick=${function () { stepS[1](step - 1); }}>이전<//>` : null;
      action = step === lastStep
        ? html`<${C.Btn} kind="ok" icon="save" onClick=${save}>일기 저장하기<//>`
        : html`<${C.Btn} kind="primary" icon="next" disabled=${step === 2 && !draft.activityId}
            onClick=${function () { stepS[1](step + 1); }}>다음<//>`;
    } else {
      body = html`<${React.Fragment}>
        ${!draft.activityId
          ? html`<${C.ActivityChooser} student=${student} value=${draft.activityId}
              onPick=${function (id) { var a = App.act(id); patch({ activityId: id, cardId: App.cardIdOf(id),
                place: draft.place || (a ? a.defaultPlace : '') }); }} />`
          : (level === 2 ? level2Body() : level3Body())}
      <//>`;
      action = draft.activityId
        ? html`<${C.Btn} kind="ok" icon="save" onClick=${save}>일기 저장하기<//>` : null;
    }

    return html`<div class="app" data-corner="diary">
      <${C.TopBar} title="기록하GO!" sub="나의 여가 일기"
        left=${html`<${React.Fragment}>
          <${C.IconBtn} uiKey="home" icon="home" label="홈으로 가기"
            onClick=${function () { p.nav('home'); }} />
          ${backBtn}
        <//>`}>
        ${level === 1 && html`<${C.Steps} steps=${L1} current=${step} />`}
        <div class="wrap" style=${{ gap: '.25rem' }}>
          <span class="small" style=${{ fontWeight: 900 }}>일기 단계</span>
          ${App.DATA.diaryLevels.map(function (lv) {
            return html`<button key=${lv.id} type="button" class=${'tab' + (level === lv.id ? ' on' : '')}
              style=${{ minHeight: '40px', padding: '.1rem .55rem', fontSize: '.85rem' }}
              aria-pressed=${level === lv.id ? 'true' : 'false'}
              title=${lv.desc}
              onClick=${function () { patch({ level: lv.id }); stepS[1](0); }}>${lv.id}<//>`;
          })}
        </div>
        <${C.WhoChip} student=${student} />
      <//>

      <${C.Stage} action=${action}>${body}<//>

      ${helpS[0] && html`<${C.Modal} title="문장 도움 보기" onClose=${function () { helpS[1](false); }}
        actions=${html`<${C.Btn} onClick=${function () { helpS[1](false); }}>닫기<//>`}>
        <p class="small muted">아래 문장을 참고해서 내 이야기로 바꾸어 써 보아요. 누르면 글에 넣어져요.</p>
        <div class="stack" style=${{ marginTop: '.5rem' }}>
          ${App.DATA.writingHelp.map(function (s, i) {
            return html`<button key=${i} type="button" class="btn wide" style=${{ justifyContent: 'flex-start' }}
              onClick=${function () { patch({ text: (draft.text ? draft.text + '\n' : '') + s }); }}>${s}<//>`;
          })}
        </div>
      <//>`}

      ${editMetaS[0] && html`<${C.Modal} title="기록 내용 바꾸기" onClose=${function () { editMetaS[1](false); }}
        actions=${html`<${C.Btn} kind="ok" onClick=${function () { editMetaS[1](false); }}>다 바꿨어요<//>`}>
        <div class="stack">
          <${C.Field} label="날짜" type="date" value=${draft.date}
            onChange=${function (v) { patch({ date: v || App.todayKey() }); }} />
          <div>
            <span class="lab">함께한 사람</span>
            <${C.PickGrid} cols=${4}>
              ${partners.map(function (pt) {
                return html`<${C.Pick} key=${pt.id} selected=${draft.partnerId === pt.id} label=${pt.name}
                  speak=${false} portrait=${true} onClick=${function () { patch({ partnerId: pt.id }); }}
                  art=${html`<${C.PartnerArt} partner=${pt} student=${student} />`} />`;
              })}
            <//>
          </div>
          <${C.Field} label="장소" value=${draft.place}
            onChange=${function (v) { patch({ place: v }); }} />
          <div>
            <span class="lab">활동 다시 고르기</span>
            <${C.ActivityChooser} student=${student} value=${draft.activityId}
              onPick=${function (id) { patch({ activityId: id, cardId: App.cardIdOf(id) }); }} />
          </div>
        </div>
      <//>`}

      ${afterS[0] !== null && html`<${C.DiaryAfter} student=${student} diaryId=${savedIdS[0]}
        step=${afterS[0]} onStep=${function (n) { afterS[1](n); }} nav=${p.nav} />`}
    </div>`;
  };

  /* ------------------------- 저장 후 물어보기 ------------------------- */
  C.DiaryAfter = function (p) {
    var d = App.store.diary(p.diaryId);
    if (!d) return null;
    var card = App.cardOf(d.activityId);
    var name = card ? card.name : '이 활동';
    var st = App.store.statusOf(p.student.id, d.cardId);

    function setLike(v) {
      if (v === 'yes') App.store.setMapState(p.student.id, d.cardId, { like: true, unsure: false });
      else if (v === 'no') App.store.setMapState(p.student.id, d.cardId, { like: false });
      else App.store.setMapState(p.student.id, d.cardId, { unsure: true });
      p.onStep(2);
    }
    function setChallenge(v) {
      if (v === 'yes') App.store.setMapState(p.student.id, d.cardId, { challenge: true, unsure: false });
      else if (v === 'no') App.store.setMapState(p.student.id, d.cardId, { challenge: false });
      else App.store.setMapState(p.student.id, d.cardId, { unsure: true });
      p.onStep(3);
    }
    function setExhibit(v) {
      App.store.updateDiary(d.id, { exhibit: v });
      p.onStep(4);
    }

    if (p.step === 0) {
      var msg = '일기를 잘 기록했어요.';
      return html`<${C.Modal} title=${msg} speakText=${msg + ' ' + name + '에 해봤어요 발자국이 생겼어요.'}
        actions=${html`<${C.Btn} kind="ok" size="big" icon="next" onClick=${function () { p.onStep(1); }}>다음<//>`}>
        <${C.Banner} tone="ok" icon="check">
          <b style=${{ fontSize: '1.15rem' }}>${msg}</b>
          <div style=${{ marginTop: '.35rem' }}>
            <span class="chip tried"><span aria-hidden="true"
              dangerouslySetInnerHTML=${{ __html: App.icon('foot') }} />해봤어요</span>
            <b>${' 발자국이 ' + name + '에 생겼어요.'}</b>
          </div>
        <//>
        <div class="sentence" style=${{ marginTop: '.7rem' }}>${App.sentences.diaryBody(d)}</div>
      <//>`;
    }
    if (p.step === 1) {
      var q1 = '이 활동을 좋아하나요?';
      return html`<${C.Modal} title=${q1} speakText=${name + '. ' + q1}
        actions=${null}>
        <p class="small muted">${name} 에 대해 스스로 골라 보아요.</p>
        <${C.PickGrid} cols=${3} label=${q1}>
          <${C.Pick} label="좋아해요" speakText="좋아해요" selected=${!!st.like}
            onClick=${function () { setLike('yes'); }} art=${html`<${C.Art} iconKey="heart" />`} />
          <${C.Pick} label="아직 잘 모르겠어요" speakText="아직 잘 모르겠어요" selected=${!!st.unsure}
            onClick=${function () { setLike('unsure'); }} art=${html`<${C.Art} iconKey="question" />`} />
          <${C.Pick} label="좋아하지 않아요" speakText="좋아하지 않아요"
            onClick=${function () { setLike('no'); }} art=${html`<${C.Art} iconKey="dash" />`} />
        <//>
      <//>`;
    }
    if (p.step === 2) {
      var q2 = '다음에 또 하거나 도전하고 싶나요?';
      return html`<${C.Modal} title=${q2} speakText=${name + '. ' + q2}>
        <${C.PickGrid} cols=${3} label=${q2}>
          <${C.Pick} label="또 하고 싶어요" speakText="또 하고 싶어요" selected=${!!st.challenge}
            onClick=${function () { setChallenge('yes'); }} art=${html`<${C.Art} iconKey="star" />`} />
          <${C.Pick} label="잘 모르겠어요" speakText="잘 모르겠어요"
            onClick=${function () { setChallenge('unsure'); }} art=${html`<${C.Art} iconKey="question" />`} />
          <${C.Pick} label="아니요" speakText="아니요"
            onClick=${function () { setChallenge('no'); }} art=${html`<${C.Art} iconKey="dash" />`} />
        <//>
      <//>`;
    }
    if (p.step === 3) {
      var q3 = '이 일기를 전시하고 싶어요?';
      return html`<${C.Modal} title=${q3} speakText=${'내가 전시하고 싶은 활동을 골라 보세요. ' + q3}>
        <p class="small muted">전시하기로 고른 기록에는 큰 별이 붙고, 포트폴리오에 실려요.</p>
        <${C.PickGrid} cols=${2} label=${q3}>
          <${C.Pick} label="전시할래요" speakText="전시할래요" selected=${!!d.exhibit}
            onClick=${function () { setExhibit(true); }} art=${html`<${C.Art} iconKey="star" />`} />
          <${C.Pick} label="전시하지 않을래요" speakText="전시하지 않을래요"
            onClick=${function () { setExhibit(false); }} art=${html`<${C.Art} iconKey="dash" />`} />
        <//>
      <//>`;
    }
    /* 마무리 */
    var stNow = App.store.statusOf(p.student.id, d.cardId);
    return html`<${C.Modal} title="모두 마쳤어요" speakText="일기와 지도, 포트폴리오에 모두 기록했어요."
      actions=${html`<${React.Fragment}>
        <${C.Btn} kind="primary" icon="cornerMap" onClick=${function () { p.nav('map'); }}>여가 지도 보기<//>
        <${C.Btn} icon="cornerFolio" onClick=${function () { p.nav('portfolio'); }}>포트폴리오 보기<//>
        <${C.Btn} icon="home" onClick=${function () { p.nav('home'); }}>홈으로<//>
      <//>`}>
      <${C.Banner} tone="ok" icon="check">
        <b>${name + '의'}</b><span>${' 지금 표시예요.'}</span>

          일기와 사진은 포트폴리오에 자동으로 모였어요.${d.exhibit ? ' 전시할 기록으로 골랐어요.' : ''}

<script>
/* ===========================================================
   나의 여가 — 모아보GO! (나의 여가 포트폴리오 · 나의 여가 전시관)
   계획 · 일기 · 사진 · 작품 · 여가지도를 기간별로 모아 보여 주고
   전시판형 / 책자형으로 인쇄하거나 PDF 로 저장할 수 있습니다.

(function () {
  var App = window.App, React = window.React, html = App.html, C = App.C;
  var useState = React.useState, useMemo = React.useMemo;

  /* ------------------------- 작은 여가 탐험 지도 ------------------------- */
  var MW = 660, MH = 360, MCX = 330, MCY = 180;
  function miniRing(a, b, n, start) {
    var out = [];
    for (var i = 0; i < n; i++) {
      var t = start + (i / n) * Math.PI * 2;
      out.push({ x: MCX + a * Math.cos(t), y: MCY + b * Math.sin(t) });
    }
    return out;
  }

  C.MiniMap = function (p) {
    var student = p.student;
    var statusMap = App.store.mapOf(student.id);
    var cards = App.visibleCards(student).filter(function (c) {
      var s = statusMap[c.id];
      return s && (s.tried || s.like || s.challenge || s.unsure);
    });
    var inner = cards.filter(function (c) { return c.area === 'indoor'; });
    var outer = cards.filter(function (c) { return c.area === 'outdoor'; });
    var pi = miniRing(118, 74, inner.length, -Math.PI / 2);
    var po = miniRing(255, 140, outer.length, -Math.PI / 2 + 0.2);

    function chip(c, pt, key) {
      var s = statusMap[c.id] || {};
      var on = App.DATA.mapStates.filter(function (m) { return s[m.id]; });
      return html`<div key=${key} style=${{ position: 'absolute', left: pt.x + 'px', top: pt.y + 'px',
          transform: 'translate(-50%,-50%)', width: '86px', textAlign: 'center',
          background: '#fffdf6', border: '2px solid #8a6a4e', borderRadius: '12px', padding: '3px 2px' }}>
        <div style=${{ width: 26, height: 26, margin: '0 auto' }}><${C.ActivityArt} activity=${c} /></div>
        <div style=${{ fontSize: '9.5px', fontWeight: 900, lineHeight: 1.1 }}>${App.shortName(c)}</div>
        <div style=${{ display: 'flex', gap: '1px', justifyContent: 'center' }}>
          ${on.map(function (m) {
            return html`<span key=${m.id} style=${{ width: 13, height: 13, display: 'block' }} aria-hidden="true"
              dangerouslySetInnerHTML=${{ __html: App.icon(m.icon) }} />`;
          })}
        </div>
      </div>`;
    }

    var scale = p.scale || 1;
    return html`<div style=${{ width: (MW * scale) + 'px', height: (MH * scale) + 'px', position: 'relative', overflow: 'hidden' }}>
      <div style=${{ width: MW + 'px', height: MH + 'px', position: 'absolute', top: 0, left: 0,
          transformOrigin: '0 0', transform: 'scale(' + scale + ')' }}>
        <svg width=${MW} height=${MH} style=${{ position: 'absolute', inset: 0 }} aria-hidden="true">
          <ellipse cx=${MCX} cy=${MCY} rx="118" ry="74" fill="none" stroke="#c3ab8e" stroke-width="2.5" stroke-dasharray="7 6" />
          <ellipse cx=${MCX} cy=${MCY} rx="255" ry="140" fill="none" stroke="#a6cba0" stroke-width="2.5" stroke-dasharray="7 6" />
        </svg>
        <div style=${{ position: 'absolute', left: MCX + 'px', top: MCY + 'px', transform: 'translate(-50%,-50%)',
            width: '92px', textAlign: 'center', background: '#fffdf3', border: '3px solid #8a6a4e',
            borderRadius: '16px', padding: '5px' }}>
          <div style=${{ width: 40, height: 40, margin: '0 auto', borderRadius: '999px', overflow: 'hidden',
              border: '2px solid #8a6a4e' }}>
            <${C.AvatarArt} student=${student} /></div>
          <div style=${{ fontSize: '11px', fontWeight: 900 }}>${student.name}</div>
        </div>
        ${inner.map(function (c, i) { return chip(c, pi[i], 'i' + c.id); })}
        ${outer.map(function (c, i) { return chip(c, po[i], 'o' + c.id); })}
      </div>
      ${!cards.length && html`<div class="muted small"
        style=${{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center' }}>
        아직 지도에 표시한 활동이 없어요.</div>`}
    </div>`;
  };

  /* ------------------------- 기간 계산 ------------------------- */
  function rangeOf(student) {
    var pf = student.portfolio || { rangeId: 'm1' };
    var today = App.todayKey();
    if (pf.rangeId === 'term' || pf.rangeId === 'custom') {
      return { from: pf.start || App.addMonths(today, -4), to: pf.end || today };
    }
    var r = App.DATA.ranges.filter(function (x) { return x.id === pf.rangeId; })[0] || App.DATA.ranges[0];
    return { from: App.addMonths(today, -(r.months || 1)), to: today };
  }
  App.portfolioRange = rangeOf;

  /* ------------------------- 전시판형 ------------------------- */
  C.BoardSheet = function (p) {

            </div>
          </div>
          <div>
            <h3 style=${{ fontSize: '1rem', fontWeight: 900, marginBottom: '.3rem' }}>나의 일기 · 한마디</h3>
            ${d.exhibited.slice(0, 2).map(function (dy) {
              return html`<div key=${dy.id} class="banner" style=${{ marginBottom: '.4rem' }}>
                <b>${App.fmtDateShort(dy.date)} · ${(App.act(dy.activityId) || {}).name || ''}</b>

            ${!d.exhibited.length && html`<div class="banner small">전시할 기록을 골라 주세요.</div>`}

              }) : html`<span class="chip none">아직 없어요</span>`}
            </div>

          <div>
            <h3 style=${{ fontSize: '1rem', fontWeight: 900, marginBottom: '.3rem' }}>나의 여가 탐험 지도</h3>
            <${C.MiniMap} student=${s} scale=${0.52} />
          </div>
        </div>
      </div>
    </div>`;
  };

  /* ------------------------- 책자형 ------------------------- */
  C.BookSheets = function (p) {

    return html`<${React.Fragment}>

          <tbody>

              return html`<tr key=${dy.id}>

              gridTemplateColumns: 'repeat(' + Math.min(3, dy.photoIds.length) + ',1fr)' }}>

  /* ------------------------- 포트폴리오 화면 ------------------------- */
  C.PortfolioScreen = function (p) {
    App.useStore();
    var student = App.store.current();
    var tab = useState('pick');     // pick | board | book
    var range = rangeOf(student);

    var data = useMemo(function () {
      var diaries = App.store.diariesInRange(student.id, range.from, range.to);
      var plans = App.store.plans(student.id).filter(function (x) {
        return x.date >= range.from && x.date <= range.to;
      });
      var statusMap = App.store.mapOf(student.id);
      var cards = App.visibleCards(student);
      var likes = cards.filter(function (c) { return (statusMap[c.id] || {}).like; });
      var challenges = cards.filter(function (c) { return (statusMap[c.id] || {}).challenge; });
      var tried = cards.filter(function (c) { return (statusMap[c.id] || {}).tried; });
      /* 이 기간에 처음 해본 활동 = 기간 안 일기에 나오고, 기간 이전 일기에는 없던 활동 */
      var before = {};
      App.store.diaries(student.id).forEach(function (d) {
        if (d.date < range.from) before[d.cardId] = true;
      });
      var newIds = {};
      diaries.forEach(function (d) { if (!before[d.cardId]) newIds[d.cardId] = true; });
      var newTried = cards.filter(function (c) { return newIds[c.id]; });
      var exhibited = diaries.filter(function (d) { return d.exhibit; });
      var photoIds = [];
      exhibited.concat(diaries).forEach(function (d) {
        (d.photoIds || []).forEach(function (id) { if (photoIds.indexOf(id) < 0) photoIds.push(id); });
      });
      return { from: range.from, to: range.to, diaries: diaries, plans: plans, likes: likes,
               challenges: challenges, tried: tried, newTried: newTried,
               exhibited: exhibited, photoIds: photoIds };
    }, [student, range.from, range.to, App.store.get()]);

    function setRange(id) {
      var pf = Object.assign({}, student.portfolio || {}, { rangeId: id });
      if ((id === 'term' || id === 'custom') && !pf.start) {
        pf.start = App.addMonths(App.todayKey(), -4);
        pf.end = App.todayKey();
      }
      App.store.updateStudent(student.id, { portfolio: pf });
    }
    function setDate(k, v) {
      var pf = Object.assign({}, student.portfolio || {});
      pf[k] = v;
      App.store.updateStudent(student.id, { portfolio: pf });
    }

    /* 기간·인쇄·전시판형은 선생님 일이라 학생 화면에서는 감춥니다.
       (선생님 설정 → 포트폴리오 에서 켜면 여기에도 나옵니다) */
    var folioTools = !!(student && student.folioTools);
    var view = folioTools ? tab[0] : 'pick';

    var printable = view === 'book'
      ? html`<${C.BookSheets} student=${student} data=${data} />`
      : html`<${C.BoardSheet} student=${student} data=${data} />`;

    function doPrint() { App.printNode(printable); }

    /* --------------- 기간 표시 ---------------
       기간을 바꾸는 단추는 '선생님 설정 → 포트폴리오' 한 곳에만 두었습니다.
       학생 화면에는 지금 어느 기간을 보고 있는지만 글로 알려 줍니다. */
    var rangeBar = html`<div class="banner ok sec">
      <b>지금 보는 기간</b> : ${App.fmtDateShort(data.from)} ~ ${App.fmtDateShort(data.to)}
      <span class="chip" style=${{ marginLeft: '.4rem' }}>일기 ${data.diaries.length}개</span>
      <span class="chip">전시 ${data.exhibited.length}개</span>
    </div>`;

    return html`<div class="app" data-corner="portfolio">
      <${C.TopBar} title="모아보GO!"
        left=${html`<${C.IconBtn} uiKey="home" icon="home" label="홈으로 가기"
          onClick=${function () { p.nav('home'); }} />`}>
        <${C.Speak} text=${'나의 여가 포트폴리오. 내가 전시하고 싶은 활동을 골라 보세요. ' +
          App.fmtDateShort(data.from) + '부터 ' + App.fmtDateShort(data.to) + '까지, 일기 ' +
          data.diaries.length + '개 가운데 ' + data.exhibited.length + '개를 골랐어요.'} />
        ${folioTools && html`<div class="tabs">
          <button type="button" class=${'tab' + (tab[0] === 'pick' ? ' on' : '')}
            aria-pressed=${tab[0] === 'pick'} onClick=${function () { tab[1]('pick'); }}>기록 고르기</button>
          <button type="button" class=${'tab' + (tab[0] === 'board' ? ' on' : '')}
            aria-pressed=${tab[0] === 'board'} onClick=${function () { tab[1]('board'); }}>전시판형</button>
          <button type="button" class=${'tab' + (tab[0] === 'book' ? ' on' : '')}
            aria-pressed=${tab[0] === 'book'} onClick=${function () { tab[1]('book'); }}>책자형</button>
        </div>`}
        <${C.WhoChip} student=${student} />
      <//>

      <${C.Stage} action=${folioTools ? html`<${C.Btn} kind="primary" icon="print" onClick=${doPrint}>
          ${view === 'book' ? '책자형 인쇄하기' : '전시판형 인쇄하기'}<//>` : null}>
        ${view === 'pick' ? html`<${React.Fragment}>
          ${folioTools ? rangeBar : null}

          <${C.Sec} title="내가 전시하고 싶은 활동을 골라 보세요">
            ${data.diaries.length ? html`<div class="stack">
              ${data.diaries.map(function (d) {
                var a = App.act(d.activityId), pt = App.partner(d.partnerId);
                return html`<div key=${d.id} class="card" style=${{ padding: '.6rem .8rem' }}>
                  <div class="row" style=${{ alignItems: 'flex-start' }}>
                    <span style=${{ width: 54, height: 54, flex: '0 0 auto' }}><${C.ActivityArt} activity=${a} /></span>
                    <div class="grow" style=${{ minWidth: 0 }}>
                      <div class="row" style=${{ gap: '.35rem' }}>
                        <b>${d.title || (a ? a.name : '여가 일기')}</b>
                        ${d.exhibit && html`<span class="star-badge">★ 전시할 기록</span>`}
                      </div>
                      <div class="small muted">${App.fmtDateLong(d.date)} · ${pt ? pt.name : ''} ${d.place ? '· ' + d.place : ''}</div>
                      <div class="small" style=${{ marginTop: '.25rem' }}>${App.sentences.diaryBody(d)}</div>
                      ${d.photoIds && d.photoIds.length ? html`<div class="wrap" style=${{ marginTop: '.35rem' }}>
                        ${d.photoIds.slice(0, 3).map(function (id) {
                          var u = App.photos.url(id);
                          return u ? html`<img key=${id} src=${u} alt="활동 사진"
                            style=${{ width: 66, height: 50, objectFit: 'cover', borderRadius: 8, border: '2px solid #8a6a4e' }} /> ` : null;
                        })}
                      </div>` : null}
                    </div>
                  </div>
                  <div class="wrap" style=${{ marginTop: '.5rem' }}>
                    <button type="button" class=${'btn small exhibit-btn' + (d.exhibit ? ' on' : '')}
                      aria-pressed=${d.exhibit ? 'true' : 'false'}
                      onClick=${function () {
                        var next = !d.exhibit;
                        App.store.updateDiary(d.id, { exhibit: next });
                        App.ui.toast(next ? '전시할 기록으로 골랐어요.' : '전시하지 않기로 했어요.');
                      }}>
                      <span class="ico" aria-hidden="true"
                        dangerouslySetInnerHTML=${{ __html: App.icon(d.exhibit ? 'star' : 'dash') }} />
                      <span>${d.exhibit ? '전시할래요' : '전시하지 않을래요'}</span>
                    </button>
                    <${C.Btn} size="small" icon="pencil"
                      onClick=${function () { p.nav('diary', { diaryId: d.id }); }}>일기 고치기<//>
                  </div>
                </div>`;
              })}
            </div>` : html`<${C.Banner} icon="cornerDiary">
              이 기간에 쓴 일기가 없어요. 기간을 늘리거나 일기를 먼저 써 보아요.
              <div class="wrap" style=${{ marginTop: '.4rem' }}>
                <${C.Btn} size="small" onClick=${function () { p.nav('diary'); }}>일기 쓰러 가기<//>
              </div>
            <//>`}
          <//>

          ${folioTools ? html`<${React.Fragment}>
            <${C.Sec} title="학생의 한마디">
              <${C.Field} label="여가생활을 하며 하고 싶은 말을 적어요"
                value=${student.word || ''} placeholder="예) 친구와 함께하는 여가가 제일 즐거워요."
                onChange=${function (v) { App.store.updateStudent(student.id, { word: v }); }} />
            <//>
            <${C.Sec} title="마지막 돌아보기">
              <div class="stack">
                ${App.DATA.reviewFrames.map(function (f) {
                  return html`<div key=${f.id} class="row">
                    <b>${f.before}</b>
                    <input class="field" style=${{ width: '16rem' }} value=${(student.review || {})[f.id] || ''}
                      onChange=${function (e) {
                        var rv = Object.assign({}, student.review || {}); rv[f.id] = e.target.value;
                        App.store.updateStudent(student.id, { review: rv });
                      }} />
                    <b>${f.after}</b>
                  </div>`;
                })}
              </div>
            <//>
          <//>` : null}
        <//>` : html`<${React.Fragment}>
          ${rangeBar}
          <${C.Sec} title=${view === 'board' ? '전시판형 미리보기' : '책자형 미리보기'}>
            <div class="banner info" style=${{ marginBottom: '.6rem' }}>
              <b>인쇄하기</b> 를 누르면 인쇄 미리보기가 열려요. 인쇄 창에서 <b>대상을 “PDF로 저장”</b> 으로 바꾸면 PDF 파일로 저장돼요.
            </div>
            ${printable}
          <//>
        <//>`}
      <//>
    </div>`;
  };
})();

</script>
  <!-- js/screens/teacher.js?v=20260816 -->
<script>
/* ===========================================================
   나의 여가 — 선생님 설정
   한 페이지에 번호 순서대로 모아 두고, 아래로 내리며 설정합니다.
   (문구마켓과 같은 방식 — 탭이나 잠금 문제 없이 바로 들어옵니다)
   =========================================================== */
(function () {
  var App = window.App, React = window.React, html = App.html, C = App.C;
  var useState = React.useState, useRef = React.useRef;

  /* ------------------------- 전체 기록 인쇄용 ------------------------- */
  C.AllRecordsSheet = function () {
    var st = App.store.get();
    return html`<${React.Fragment}>
      ${st.students.map(function (s) {
        var diaries = App.store.diaries(s.id);
        var plans = App.store.plans(s.id);
        var map = App.store.mapOf(s.id);
        var cards = App.visibleCards(s);
        return html`<div key=${s.id} class="book-page">
          <div class="sheet-title" style=${{ fontSize: '1.4rem' }}>나의 여가 · 전체 기록 — ${s.name}</div>
          <div class="sheet-meta">일기 ${diaries.length}개 · 계획 ${plans.length}개 · 인쇄일 ${App.fmtDateLong(App.todayKey())}</div>
          <h3 style=${{ marginTop: '.6rem', fontWeight: 900 }}>여가 일기</h3>
          <table class="tbl">
            <thead><tr><th>날짜</th><th>활동</th><th>함께한 사람</th><th>기분</th><th>일기</th></tr></thead>
            <tbody>
              ${diaries.map(function (d) {
                return html`<tr key=${d.id}>
                  <td>${App.fmtDateShort(d.date)}</td>
                  <td>${(App.act(d.activityId) || {}).name || ''}</td>
                  <td>${(App.partner(d.partnerId) || {}).name || ''}</td>
                  <td>${d.moodIds.map(function (m) { return (App.mood(m) || {}).name; }).join(', ')}</td>
                  <td>${App.sentences.diaryBody(d)}</td>
                </tr>`;
              })}
              ${!diaries.length && html`<tr><td colspan="5">기록이 없어요.</td></tr>`}
            </tbody>
          </table>
          <h3 style=${{ marginTop: '.7rem', fontWeight: 900 }}>여가 계획</h3>
          <ul>${plans.map(function (pl) {
            return html`<li key=${pl.id} style=${{ padding: '2px 0' }}>· ${App.sentences.plan(pl)}</li>`;
          })}${!plans.length && html`<li>기록이 없어요.</li>`}</ul>
          <h3 style=${{ marginTop: '.7rem', fontWeight: 900 }}>여가 지도 표시</h3>
          <div class="wrap">
            ${cards.filter(function (c) { return map[c.id]; }).map(function (c) {
              var s2 = map[c.id];
              var words = App.DATA.mapStates.filter(function (m) { return s2[m.id]; })
                .map(function (m) { return m.name; }).join(' · ');
              return words ? html`<span key=${c.id} class="chip">${c.name} : ${words}</span>` : null;
            })}
          </div>
        </div>`;
      })}
    <//>`;
  };

  /* ------------------------- 한 줄짜리 고르기 ------------------------- */
  function Choices(p) {
    return html`<div class="wrap">
      ${p.items.map(function (it) {
        var on = p.value === it.id;
        return html`<button key=${it.id} type="button" class=${'tchoice' + (on ? ' on' : '')}
          aria-pressed=${on ? 'true' : 'false'}
          onClick=${function () { p.onPick(it.id); }}>${on ? '✓ ' : ''}${it.name}</button>`;
      })}
    </div>`;
  }
  C.Choices = Choices;

  /* ------------------------- 설정 화면 ------------------------- */
  C.TeacherScreen = function (p) {
    var store = App.useStore();
    var fileRef = useRef(null);
    var markOpen = useState(null);
    var current = App.store.current();
    var students = store.students;

    function upd(id, patch) { App.store.updateStudent(id, patch); }

    /* --------------- 백업 / 불러오기 --------------- */
    function download(obj, filename) {
      try {
        var blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
        App.ui.toast('백업 파일을 저장했어요.');
      } catch (e) { App.ui.toast('파일을 저장하지 못했어요.'); }
    }
    function importFile(e) {
      var f = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        var data;
        try { data = JSON.parse(r.result); }
        catch (err) { App.ui.toast('읽을 수 없는 파일이에요.'); return; }
        App.ui.confirm({
          title: '자료를 불러올까요?',
          body: '지금 기록에 덧붙입니다.', okText: '덧붙여 불러오기', cancelText: '그만두기'
        }).then(function (ok) {
          if (!ok) return;
          try {
            Promise.resolve(App.store.importData(data, 'merge')).then(function () {
              App.ui.toast('자료를 불러왔어요.');
            });
          } catch (err2) { App.ui.toast(err2.message || '불러오지 못했어요.'); }
        });
      };
      r.readAsText(f);
    }

    /* --------------- 1. 우리 반 학생 --------------- */
    function studentRow(s) {
      return html`<div key=${s.id} class="stu-edit">
        <div class="row" style=${{ gap: '.5rem', flexWrap: 'nowrap' }}>
          <button type="button" class="stu-mark" title="이름 앞 그림 바꾸기"
            aria-label=${s.name + ' 이름 앞 그림 바꾸기'}
            onClick=${function () { markOpen[1](markOpen[0] === s.id ? null : s.id); }}>${s.mark || '🌸'}</button>

          <input class="field" style=${{ flex: '1 1 auto', minWidth: 0 }} value=${s.name}
            placeholder="이름 또는 별명"
            onChange=${function (e) { upd(s.id, { name: e.target.value }); }} />

          <div class="wrap" style=${{ flex: '0 0 auto', gap: '.3rem' }}>
            <button type="button" class=${'tchoice sm' + ((s.gender || 'girl') === 'girl' ? ' on' : '')}
              aria-pressed=${(s.gender || 'girl') === 'girl'}
              onClick=${function () { upd(s.id, { gender: 'girl' }); }}>여자</button>
            <button type="button" class=${'tchoice sm' + (s.gender === 'boy' ? ' on' : '')}
              aria-pressed=${s.gender === 'boy'}
              onClick=${function () { upd(s.id, { gender: 'boy' }); }}>남자</button>
          </div>

          <button type="button" class="tchoice sm ghost" onClick=${function () {
            App.ui.confirmTwice(
              { title: '‘' + (s.name || '이 학생') + '’ 을(를) 지울까요?',
                body: '이 학생의 계획 · 일기 · 사진 · 지도 표시가 모두 지워져요.',
                okText: '지울래요', cancelText: '그만두기', tone: 'danger' },
              { title: '정말 지울까요?', body: '되돌릴 수 없어요. 먼저 백업을 받아 두세요.',
                okText: '네, 지울래요', cancelText: '그만두기', tone: 'danger' }
            ).then(function (ok) { if (ok) { App.store.removeStudent(s.id); markOpen[1](null); } });
          }}>지우기</button>
        </div>

        ${markOpen[0] === s.id && html`<div class="stu-marks">
          ${App.DATA.marks.map(function (m) {
            return html`<button key=${m} type="button"
              class=${'stu-mark-pick' + (s.mark === m ? ' on' : '')}
              onClick=${function () { upd(s.id, { mark: m }); markOpen[1](null); }}>${m}</button>`;
          })}
        </div>`}
      </div>`;
    }

    /* --------------- 지금 학생의 세부 설정 --------------- */
    function studentSettings() {
      if (!current) {
        return html`<p class="muted small">학생을 먼저 추가해 주세요.</p>`;
      }
      var hidden = current.hiddenActivityIds || [];
      function toggleAct(id) {
        upd(current.id, { hiddenActivityIds: hidden.indexOf(id) >= 0
          ? hidden.filter(function (x) { return x !== id; }) : hidden.concat([id]) });
      }
      function toggleIn(key, all, id) {
        var cur = current[key] || all.map(function (x) { return x.id; });
        var next = cur.indexOf(id) >= 0 ? cur.filter(function (x) { return x !== id; }) : cur.concat([id]);
        if (!next.length) { App.ui.toast('적어도 하나는 남겨 두세요.'); return; }
        var patch = {}; patch[key] = next; upd(current.id, patch);
      }
      var pf = current.portfolio || { rangeId: 'm1' };
      var r = App.portfolioRange(current);

      return html`<${React.Fragment}>
        <div class="tsec">
          <label>2. 어느 학생의 설정인가요?</label>
          <${Choices} value=${current.id}
            items=${students.map(function (s) { return { id: s.id, name: (s.mark || '') + ' ' + (s.name || '이름 없음') }; })}
            onPick=${function (id) { App.store.setCurrent(id); }} />
          <p class="muted small">아래 3번부터는 <b>${current.name}</b> 학생에게만 적용됩니다.</p>
        </div>

        <div class="tsec">
          <label>3. 일기 쓰기 수준</label>
          <${Choices} value=${current.diaryLevel}
            items=${App.DATA.diaryLevels.map(function (l) { return { id: l.id, name: l.name + ' · ' + l.desc }; })}
            onPick=${function (v) { upd(current.id, { diaryLevel: v }); }} />
          <p class="muted small">${(App.DATA.diaryLevels.filter(function (l) { return l.id === current.diaryLevel; })[0] || {}).guide || ''}</p>
        </div>

        <div class="tsec">
          <label>4. 계획 방식</label>
          <${Choices} value=${current.planLevel}
            items=${App.DATA.planLevels.map(function (l) { return { id: l.id, name: l.name + ' · ' + l.desc }; })}
            onPick=${function (v) { upd(current.id, { planLevel: v }); }} />
        </div>

        <div class="tsec">
          <label>5. 음성 안내 · 사진 첨부</label>
          <div class="wrap">
            <${C.Switch} label="음성 안내" on=${current.voice !== false}
              onChange=${function (v) { upd(current.id, { voice: v }); }} />
            <${C.Switch} label="사진 첨부" on=${current.photo !== false}
              onChange=${function (v) { upd(current.id, { photo: v }); }} />
          </div>
        </div>

        <div class="tsec">
          <label>6. 학생 화면에 도구 보이기
            <span class="muted" style=${{ fontWeight: 400, fontSize: '.85em' }}>기본은 숨김이에요</span></label>
          <div class="wrap">
            <${C.Switch} label="지도 찾아보기·확대" on=${!!current.mapTools}
              onChange=${function (v) { upd(current.id, { mapTools: v }); }} />
            <${C.Switch} label="포트폴리오 기간·인쇄" on=${!!current.folioTools}
              onChange=${function (v) { upd(current.id, { folioTools: v }); }} />
          </div>
        </div>

        <div class="tsec">
          <label>7. 함께하는 사람 선택지</label>
          <div class="wrap">
            ${App.DATA.partners.map(function (x) {
              var on = (current.partnerIds || []).indexOf(x.id) >= 0;
              return html`<button key=${x.id} type="button" class=${'tchoice' + (on ? ' on' : '')}
                aria-pressed=${on} onClick=${function () { toggleIn('partnerIds', App.DATA.partners, x.id); }}>
                ${on ? '✓ ' : ''}${x.name}</button>`;
            })}
          </div>
          ${App.DATA.partners.filter(function (x) { return x.variants; }).length ? html`
            <p class="muted small" style=${{ marginTop: '.4rem' }}>그림 고르기 (남 / 여)</p>
            <div class="wrap">
              ${App.DATA.partners.filter(function (x) { return x.variants; }).map(function (x) {
                var cur = App.partnerVariant(x, current);
                return html`<span key=${x.id} class="wrap" style=${{ gap: '.2rem', alignItems: 'center' }}>
                  <b class="small">${x.name}</b>
                  ${x.variants.map(function (v) {
                    return html`<button key=${v.id} type="button"
                      class=${'tchoice sm' + (cur.id === v.id ? ' on' : '')}
                      onClick=${function () {
                        var m = Object.assign({}, current.partnerVariants || {}); m[x.id] = v.id;
                        upd(current.id, { partnerVariants: m });
                      }}>${v.name}</button>`;
                  })}
                </span>`;
              })}
            </div>` : null}
        </div>

        <div class="tsec">
          <label>8. 기분 선택지</label>
          <div class="wrap">
            ${App.DATA.moods.map(function (x) {
              var on = (current.moodIds || []).indexOf(x.id) >= 0;
              return html`<button key=${x.id} type="button" class=${'tchoice' + (on ? ' on' : '')}
                aria-pressed=${on} onClick=${function () { toggleIn('moodIds', App.DATA.moods, x.id); }}>
                ${on ? '✓ ' : ''}${x.name}</button>`;
            })}
          </div>
        </div>

        <div class="tsec">
          <label>9. 학생에게 보여줄 활동</label>
          ${['indoor', 'outdoor'].map(function (area) {
            return html`<div key=${area} style=${{ marginTop: '.4rem' }}>
              <p class="muted small">${area === 'indoor' ? '실내' : '실외'}</p>
              <div class="wrap">
                ${App.topCards(area).map(function (c) {
                  var off = hidden.indexOf(c.id) >= 0;
                  return html`<button key=${c.id} type="button" class=${'tchoice' + (off ? '' : ' on')}
                    aria-pressed=${!off} onClick=${function () { toggleAct(c.id); }}>
                    ${off ? '' : '✓ '}${c.name}</button>`;
                })}
              </div>
            </div>`;
          })}
          <p class="muted small" style=${{ marginTop: '.3rem' }}>체크된 활동만 학생 화면에 나옵니다.</p>
        </div>

        <div class="tsec">
          <label>10. 포트폴리오 기간</label>
          <${Choices} value=${pf.rangeId}
            items=${App.DATA.ranges.map(function (x) { return { id: x.id, name: x.name }; })}
            onPick=${function (v) {
              var next = Object.assign({}, pf, { rangeId: v });
              if ((v === 'term' || v === 'custom') && !next.start) {
                next.start = App.addMonths(App.todayKey(), -4); next.end = App.todayKey();
              }
              upd(current.id, { portfolio: next });
            }} />
          ${(pf.rangeId === 'term' || pf.rangeId === 'custom') && html`<div class="row" style=${{ marginTop: '.5rem' }}>
            <div style=${{ width: '13rem' }}><${C.Field} label="시작일" type="date" value=${pf.start || ''}
              onChange=${function (v) { upd(current.id, { portfolio: Object.assign({}, pf, { start: v }) }); }} /></div>
            <div style=${{ width: '13rem' }}><${C.Field} label="종료일" type="date" value=${pf.end || ''}
              onChange=${function (v) { upd(current.id, { portfolio: Object.assign({}, pf, { end: v }) }); }} /></div>
          </div>`}
          <p class="muted small">지금 기간 : ${App.fmtDateLong(r.from)} ~ ${App.fmtDateLong(r.to)}</p>
        </div>

        <div class="tsec">
          <label>11. ${current.name} 학생의 기록</label>
          <div class="stack" style=${{ gap: '.35rem' }}>
            ${App.store.diaries(current.id).map(function (d) {
              return html`<div key=${d.id} class="row" style=${{ gap: '.4rem' }}>
                <span class="chip">${App.fmtDateShort(d.date)}</span>
                <b class="grow small">${(App.act(d.activityId) || {}).name || ''}</b>
                <button type="button" class="tchoice sm"
                  onClick=${function () { p.nav('diary', { diaryId: d.id }); }}>고치기</button>
                <button type="button" class="tchoice sm ghost" onClick=${function () {
                  App.ui.confirmTwice(
                    { title: '이 일기를 지울까요?', body: App.fmtDateLong(d.date), okText: '지울래요', cancelText: '그만두기', tone: 'danger' },
                    { title: '정말 지울까요?', okText: '네, 지울래요', cancelText: '그만두기', tone: 'danger' }
                  ).then(function (ok) { if (ok) App.store.removeDiary(d.id); });
                }}>지우기</button>
              </div>`;
            })}
            ${!App.store.diaries(current.id).length && html`<p class="muted small">아직 일기가 없어요.</p>`}
          </div>
        </div>
      <//>`;
    }

    /* --------------- 화면 --------------- */
    return html`<div class="app" data-corner="portfolio">
      <div class="stage tstage">
        <div class="panel tpanel">
          <div class="tscroll">

            <div class="row" style=${{ marginBottom: '.6rem' }}>
              <h1 class="grow" style=${{ fontSize: '1.6rem', fontWeight: 900 }}>선생님 설정</h1>
              <${C.Btn} size="small" icon="print"
                onClick=${function () { App.printNode(html`<${C.AllRecordsSheet} />`); }}>기록 인쇄<//>
              <${C.Btn} size="small" kind="primary" icon="check"
                onClick=${function () { p.nav(students.length ? 'profiles' : 'cover'); }}>설정 완료<//>
            </div>

            <div class="tsec">
              <label>1. 우리 반 학생
                <span class="muted" style=${{ fontWeight: 400, fontSize: '.85em' }}>
                  학생마다 계획·일기·지도가 따로 모여요</span></label>
              ${!students.length && html`<p class="muted small">
                아직 학생이 없어요. <b>+ 학생 추가</b> 를 눌러 우리 반 학생을 모두 등록해 주세요.</p>`}
              <div class="stack" style=${{ gap: '.45rem' }}>
                ${students.map(studentRow)}
              </div>
              <div class="wrap" style=${{ marginTop: '.55rem' }}>
                <button type="button" class="tchoice add" onClick=${function () {
                  var used = students.map(function (x) { return x.mark; });
                  var mark = App.DATA.marks.filter(function (m) { return used.indexOf(m) < 0; })[0] || App.DATA.marks[0];
                  var id = App.store.addStudent({ name: '', mark: mark });
                  App.store.setCurrent(id);
                }}>＋ 학생 추가</button>
                ${current && html`<button type="button" class="tchoice"
                  onClick=${function () { p.nav('avatar', { studentId: current.id, from: 'teacher' }); }}>
                  ${current.name || '지금 학생'} 캐릭터 고르기</button>`}
              </div>
            </div>

            ${studentSettings()}

            <div class="tsec">
              <label>12. 백업 · 불러오기</label>
              <div class="wrap">
                <button type="button" class="tchoice" onClick=${function () {
                  download(App.store.exportData(null), '나의여가_전체백업_' + App.todayKey() + '.json'); }}>
                  전체 백업 내보내기</button>
                ${current && html`<button type="button" class="tchoice" onClick=${function () {
                  download(App.store.exportData(current.id), '나의여가_' + current.name + '_' + App.todayKey() + '.json'); }}>
                  ${current.name} 학생만 백업</button>`}
                <button type="button" class="tchoice"
                  onClick=${function () { if (fileRef.current) fileRef.current.click(); }}>백업 불러오기</button>
                <input ref=${fileRef} type="file" accept="application/json,.json"
                  style=${{ display: 'none' }} onChange=${importFile} />
              </div>
              <p class="muted small">백업 파일에는 기록과 사진이 함께 담기고, 밖으로 전송되지 않습니다.</p>
            </div>

            <div class="tsec">
              <label>13. 예시 자료 · 초기화</label>
              <div class="wrap">
                <button type="button" class="tchoice ghost" disabled=${!App.store.hasSamples()}
                  onClick=${function () {
                    App.ui.confirmTwice(
                      { title: '예시 자료를 모두 지울까요?', body: '예시 학생과 예시 기록이 함께 지워져요.',
                        okText: '지울래요', cancelText: '그만두기', tone: 'danger' },
                      { title: '정말 지울까요?', okText: '네, 지울래요', cancelText: '그만두기', tone: 'danger' }
                    ).then(function (ok) { if (ok) { App.store.removeSamples(); App.ui.toast('예시 자료를 지웠어요.'); } });
                  }}>${App.store.hasSamples() ? '예시 자료 모두 지우기' : '예시 자료가 없어요'}</button>
                <button type="button" class="tchoice ghost" onClick=${function () {
                  App.ui.confirmTwice(
                    { title: '모든 기록을 지우고 처음으로 되돌릴까요?',
                      body: '학생 · 계획 · 일기 · 사진 · 지도 표시가 모두 지워져요.',
                      okText: '초기화할래요', cancelText: '그만두기', tone: 'danger' },
                    { title: '정말 초기화할까요?', body: '이 동작은 되돌릴 수 없어요.',
                      okText: '네, 초기화할래요', cancelText: '그만두기', tone: 'danger' }
                  ).then(function (ok) { if (ok) { App.store.resetAll(); App.ui.toast('처음 상태로 되돌렸어요.'); } });
                }}>전체 초기화</button>
              </div>
              <p class="muted small">
                앱 판 : ${App.VERSION || '-'} · 사진 ${App.photos.count()}장
                ${App.photos.isFallback() ? ' · 간단 저장소 사용 중' : ''}
              </p>
            </div>

          </div>
        </div>
      </div>
    </div>`;
  };
})();

</script>
  <!-- js/app.js?v=20260816 -->
<script>
/* ===========================================================
   나의 여가 — 앱 시작점 (화면 이동 · 인쇄 · 첫 실행)
   =========================================================== */
(function () {
  var App = window.App, React = window.React, html = App.html, C = App.C;
  var useState = React.useState, useEffect = React.useEffect;

  /* 지금 열려 있는 것이 최신판인지 확인할 때 씁니다.
     선생님 설정 → 데이터 → 저장 상태 에서 볼 수 있습니다. */
  App.VERSION = '2026-08-16 · 흰 바탕판';

  /* 인쇄 내용을 담아 두는 자리 (실제 그리기는 Root 가 맡습니다) */
  var setPrintContent = null;
  App.printNode = function (node) {
    if (!setPrintContent) return;
    setPrintContent(node);
    document.body.classList.add('printing');
    setTimeout(function () {
      try { window.print(); } catch (e) {}
      setTimeout(function () {
        document.body.classList.remove('printing');
        if (setPrintContent) setPrintContent(null);
      }, 600);
    }, 180);
  };
  App.printPlan = function (plan) {
    if (!plan) return;
    var student = App.store.student(plan.studentId) || App.store.current();
    App.printNode(html`<div style=${{ padding: '4px' }}>
      <${C.PlanSheet} plan=${plan} student=${student} />
    </div>`);
  };

  function Root() {
    var store = App.useStore();
    var routeS = useState(function () { return { name: 'cover', params: {} }; });
    var route = routeS[0];
    var printS = useState(null);

    useEffect(function () { setPrintContent = printS[1]; return function () { setPrintContent = null; }; }, []);

    function nav(name, params) {
      App.speech.stop();
      routeS[1]({ name: name, params: params || {} });
      /* 새 화면은 언제나 처음부터 보이도록 */
      var el = document.querySelector('.stage-track');
      if (el) el.scrollLeft = 0;
    }
    App.nav = nav;

    /* 학생이 하나도 없으면 학생 화면으로 (표지는 그대로 둡니다) */
    useEffect(function () {
      if (!store.students.length &&
          route.name !== 'profiles' && route.name !== 'teacher' && route.name !== 'cover') {
        routeS[1]({ name: 'profiles', params: {} });
      }
    }, [store.students.length, route.name]);

    var p = { nav: nav, params: route.params };
    var screen;
    switch (route.name) {
      case 'cover':     screen = html`<${C.CoverScreen} ...${p} />`; break;
      case 'profiles':  screen = html`<${C.ProfilesScreen} ...${p} />`; break;
      case 'avatar':    screen = html`<${C.AvatarScreen} ...${p} />`; break;
      case 'plan':      screen = html`<${C.PlanScreen} ...${p} />`; break;
      case 'map':       screen = html`<${C.MapScreen} ...${p} />`; break;
      case 'diary':     screen = html`<${C.DiaryScreen} ...${p} />`; break;
      case 'portfolio': screen = html`<${C.PortfolioScreen} ...${p} />`; break;
      case 'teacher':   screen = html`<${C.TeacherScreen} ...${p} />`; break;
      default:          screen = html`<${C.HomeScreen} ...${p} />`;
    }

    /* 화면이 바뀌면 React 가 통째로 새로 그리도록 key 를 줍니다 */
    return html`<${React.Fragment}>
      ${React.cloneElement(screen, { key: route.name + JSON.stringify(route.params) })}
      <div id="print-root" class="print-area">${printS[0]}</div>
      <${C.UiHost} />
    <//>`;
  }

  /* ------------------------- 시작 ------------------------- */
  function boot() {
    App.store.init();

    /* 배경 벽지를 CSS 에 알려 줍니다.
       (경로는 js/data/activities.js 의 App.IMAGE_BASE 한 곳에서 관리)
       그림 파일이 없으면 조용히 바탕색만 쓰도록 미리 확인합니다. */
    if (App.IMAGE_BASE.wallpaper) {
      var probe = new Image();
      probe.onload = function () {
        document.documentElement.style.setProperty(
          '--wallpaper', 'url("' + encodeURI(App.IMAGE_BASE.wallpaper) + '")');
      };
      probe.src = encodeURI(App.IMAGE_BASE.wallpaper);
    }

    var root = document.getElementById('root');
    var render = function () {
      if (window.ReactDOM.createRoot) {
        window.ReactDOM.createRoot(root).render(html`<${Root} />`);
      } else {
        window.ReactDOM.render(html`<${Root} />`, root);
      }
    };
    /* 사진 저장소를 먼저 준비한 뒤 화면을 그립니다 */
    App.photos.init().then(render)['catch'](render);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
