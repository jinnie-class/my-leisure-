<script>
/* ===========================================================
   나의 여가 — 다시 쓰는 화면 조각들
   (버튼 · 읽어주기 · 활동카드 · 단계표시 · 무대(좌우 페이지) ·
    확인창 · 성공 알림 · 학생 표시 · 상태 배지)
   =========================================================== */
(function () {
  var App = (window.App = window.App || {});
  var React = window.React;
  var html = window.htm.bind(React.createElement);
  var useState = React.useState, useEffect = React.useEffect,
      useRef = React.useRef, useCallback = React.useCallback,
      useLayoutEffect = React.useLayoutEffect, useMemo = React.useMemo;

  App.html = html;
  var C = (App.C = {});

  /* ======================= 전역 상태 구독 ======================= */
  App.useStore = function () {
    var sub = useCallback(function (cb) { return App.store.subscribe(cb); }, []);
    var get = useCallback(function () { return App.store.get(); }, []);
    if (React.useSyncExternalStore) return React.useSyncExternalStore(sub, get);
    var s = useState(App.store.get());
    useEffect(function () { return App.store.subscribe(function () { s[1](App.store.get()); }); }, []);
    return s[0];
  };

  /* ======================= 안내 · 확인창 ======================= */
  var uiSubs = [];
  var uiQueue = { confirm: null, toast: null };
  function uiEmit() { uiSubs.slice().forEach(function (f) { try { f(); } catch (e) {} }); }

  App.ui = {
    subscribe: function (fn) { uiSubs.push(fn); return function () { uiSubs = uiSubs.filter(function (f) { return f !== fn; }); }; },
    peek: function () { return uiQueue; },
    /* 확인창 : Promise<boolean> */
    confirm: function (opts) {
      return new Promise(function (resolve) {
        uiQueue.confirm = Object.assign({
          title: '계속할까요?', body: '', okText: '네', cancelText: '아니요',
          tone: 'normal', icon: 'question'
        }, opts || {}, {
          _done: function (v) { uiQueue.confirm = null; uiEmit(); resolve(v); }
        });
        uiEmit();
      });
    },
    /* 두 번 확인 (삭제 · 초기화) */
    confirmTwice: function (a, b) {
      return App.ui.confirm(a).then(function (ok) {
        if (!ok) return false;
        return App.ui.confirm(b);
      });
    },
    toast: function (msg) {
      uiQueue.toast = { msg: msg, at: Date.now() };
      uiEmit();
      setTimeout(function () {
        if (uiQueue.toast && Date.now() - uiQueue.toast.at >= 2400) { uiQueue.toast = null; uiEmit(); }
      }, 2500);
    }
  };

  C.UiHost = function () {
    var sub = useCallback(function (cb) { return App.ui.subscribe(cb); }, []);
    var tick = useState(0);
    useEffect(function () { return sub(function () { tick[1](function (n) { return n + 1; }); }); }, []);
    var q = App.ui.peek();
    return html`<${React.Fragment}>
      ${q.confirm && html`<${C.ConfirmModal} ...${q.confirm} />`}
      ${q.toast && html`<div class="toast" role="status" aria-live="polite">${q.toast.msg}</div>`}
    <//>`;
  };

  C.ConfirmModal = function (p) {
    var okRef = useRef(null);
    useEffect(function () { if (okRef.current) okRef.current.focus(); }, []);
    function key(e) {
      if (e.key === 'Escape') { e.stopPropagation(); p._done(false); }
    }
    return html`<div class="mask" onKeyDown=${key} onMouseDown=${function (e) { if (e.target === e.currentTarget) p._done(false); }}>
      <div class="modal" role="dialog" aria-modal="true" aria-label=${p.title}>
        <div style=${{ display: 'flex', gap: '.6rem', alignItems: 'flex-start' }}>
          <${C.Art} iconKey=${p.icon} size=${44} />
          <div class="grow">
            <h2>${p.title}</h2>
            ${p.body && html`<p style=${{ fontSize: '1.02rem', lineHeight: 1.55, fontWeight: 700 }}>${p.body}</p>`}
          </div>
        </div>
        <div class="acts">
          <button ref=${okRef} class=${'btn ' + (p.tone === 'danger' ? 'danger' : 'ok')} onClick=${function () { p._done(true); }}>${p.okText}</button>
          <button class="btn" onClick=${function () { p._done(false); }}>${p.cancelText}</button>
        </div>
      </div>
    </div>`;
  };

  /* 화면 안에서 직접 쓰는 큰 팝업 */
  C.Modal = function (p) {
    var ref = useRef(null);
    useEffect(function () {
      var el = ref.current; if (!el) return;
      var f = el.querySelector('button,[href],input,select,textarea,[tabindex]');
      if (f) f.focus();
    }, []);
    return html`<div class="mask"
        onMouseDown=${function (e) { if (e.target === e.currentTarget && p.onClose) p.onClose(); }}
        onKeyDown=${function (e) { if (e.key === 'Escape' && p.onClose) p.onClose(); }}>
      <div class="modal" ref=${ref} role="dialog" aria-modal="true" aria-label=${p.title || ''} style=${p.style}>
        ${p.title && html`<div class="q" style=${{ marginBottom: '.4rem' }}>
          <h2 class="grow">${p.title}</h2>
          ${p.speak !== false && html`<${C.Speak} text=${p.speakText || p.title} />`}
        </div>`}
        ${p.children}
        ${p.actions && html`<div class="acts">${p.actions}</div>`}
      </div>
    </div>`;
  };

  /* ======================= 그림 ======================= */
  /* PNG 파일이 있으면 PNG 를, 없으면 기본 SVG 를 보여 줍니다. */
  C.Art = function (p) {
    var fail = useState(false);
    useEffect(function () { fail[1](false); }, [p.src]);
    var style = { width: p.size ? p.size + 'px' : '100%', height: p.size ? p.size + 'px' : '100%', display: 'block', objectFit: 'contain' };
    if (p.src && !fail[0]) {
      return html`<img src=${p.src} alt="" style=${style} onError=${function () { fail[1](true); }} />`;
    }
    return html`<span aria-hidden="true" style=${style}
      dangerouslySetInnerHTML=${{ __html: App.icon(p.iconKey || 'question') }} />`;
  };

  C.ActivityArt = function (p) {
    var a = p.activity;
    if (!a) return html`<${C.Art} iconKey="question" size=${p.size} />`;
    return html`<${C.Art} src=${App.activityImage(a)} iconKey=${a.icon} size=${p.size} />`;
  };

  /* 학생이 캐릭터를 아직 고르지 않았으면 성별에 맞는 기본 캐릭터를 씁니다 */
  App.avatarFor = function (student) {
    var id = student && student.avatarId;
    if (id) { var a = App.avatar(id); if (a) return a; }
    var want = (student && student.gender === 'boy') ? 'boy' : 'girl';
    return App.avatar(want) || App.DATA.avatars[0];
  };

  C.AvatarArt = function (p) {
    var av = p.student ? App.avatarFor(p.student)
                       : (App.avatar(p.avatarId) || App.DATA.avatars[0]);
    return html`<${C.Art} src=${App.avatarImage(av)} iconKey=${av.icon} size=${p.size} />`;
  };

  /* 함께하는 사람 그림 (그림이 없으면 기본 SVG 로 대체) */
  C.PartnerArt = function (p) {
    var pt = p.partner || App.partner(p.partnerId);
    if (!pt) return null;
    var student = p.student !== undefined ? p.student : App.store.current();
    return html`<${C.Art} src=${App.partnerImage(pt, student)} iconKey=${pt.icon} size=${p.size} />`;
  };

  /* 캐릭터 고르기 (갈래별로 나누어 보여 줍니다) */
  C.AvatarPicker = function (p) {
    var groups = App.DATA.avatarGroups;
    var cur = App.avatar(p.value);
    var gs = useState((cur && cur.group) || groups[0].id);
    var list = App.DATA.avatars.filter(function (a) { return a.group === gs[0]; });
    return html`<div>
      <div class="wrap" style=${{ marginBottom: '.45rem' }}>
        ${groups.map(function (g) {
          return html`<button key=${g.id} type="button" class=${'tab' + (gs[0] === g.id ? ' on' : '')}
            aria-pressed=${gs[0] === g.id ? 'true' : 'false'}
            onClick=${function () { gs[1](g.id); }}>${gs[0] === g.id ? '✓ ' : ''}${g.name}</button>`;
        })}
      </div>
      <${C.PickGrid} cols=${6} label="캐릭터">
        ${list.map(function (a) {
          return html`<${C.Pick} key=${a.id} selected=${p.value === a.id} label=${a.name} speak=${false}
            onClick=${function () { p.onChange(a.id); }}
            art=${html`<${C.AvatarArt} avatarId=${a.id} />`} />`;
        })}
      <//>
    </div>`;
  };

  /* ======================= 읽어주기 ======================= */
  App.speakFor = function (student, text) {
    if (student && student.voice === false) return false;
    if (!App.speech.supported()) { App.ui.toast('이 브라우저에서는 음성 안내를 사용할 수 없어요. 글자로 읽어 주세요.'); return false; }
    var ok = App.speech.speak(text);
    if (!ok) App.ui.toast('지금은 소리로 읽어 줄 수 없어요.');
    return ok;
  };

  C.Speak = function (p) {
    var st = App.store.current();
    if (st && st.voice === false) return null;
    /* 읽어주기는 어디서나 소리 그림 하나로만 보여 줍니다 (글자는 넣지 않아요).
       화면 낭독기에는 aria-label 로 뜻이 전해집니다. */
    var label = p.label || '읽어주기';
    var src = App.uiImage('speaker');
    var fail = useState(false);
    var useImg = src && !fail[0];
    return html`<button type="button" class=${'iconbtn' + (useImg ? ' has-img' : '')} title=${label}
      aria-label=${label + ': ' + (p.text || '')}
      onClick=${function (e) { e.stopPropagation(); App.speakFor(st, p.text); }}>
      ${useImg
        ? html`<img src=${src} alt="" onError=${function () { fail[1](true); }} />`
        : html`<span aria-hidden="true" dangerouslySetInnerHTML=${{ __html: App.uiIcon('speaker') }} />`}
    </button>`;
  };

  /* 그림만 있는 둥근 단추.
     uiKey 를 주면 images 폴더의 단추 그림(동그라미까지 그려진 PNG)을 씁니다.
     그림이 없으면 코드로 그린 선 아이콘이 대신 나옵니다. */
  C.IconBtn = function (p) {
    var src = p.uiKey ? App.uiImage(p.uiKey) : null;
    var fail = useState(false);
    useEffect(function () { fail[1](false); }, [src]);
    var useImg = src && !fail[0];
    var inset = p.uiKey && (App.IMAGE_BASE.uiInset || {})[p.uiKey];
    var cls = 'iconbtn' + (useImg ? ' has-img' : '') + (useImg && inset ? ' inset' : '') +
              (p.off ? ' off' : '') + (p.className ? ' ' + p.className : '');
    return html`<button type="button" class=${cls}
        onClick=${p.onClick} aria-label=${p.label} title=${p.label}>
      ${useImg
        ? html`<img src=${src} alt="" onError=${function () { fail[1](true); }} />`
        : html`<span aria-hidden="true" dangerouslySetInnerHTML=${{ __html: App.uiIcon(p.icon) }} />`}
    </button>`;
  };

  /* ======================= 버튼 ======================= */
  C.Btn = function (p) {
    var cls = ['btn'];
    if (p.kind) cls.push(p.kind);
    if (p.size) cls.push(p.size);
    if (p.wide) cls.push('wide');
    if (p.className) cls.push(p.className);
    return html`<button type="button" class=${cls.join(' ')} disabled=${!!p.disabled}
      onClick=${p.onClick} aria-label=${p.ariaLabel} title=${p.title}>
      ${p.icon && html`<span class="ico" aria-hidden="true"
        dangerouslySetInnerHTML=${{ __html: App.icon(p.icon) }} />`}
      <span>${p.children}</span>
    </button>`;
  };

  /* ======================= 위 / 아래 막대 ======================= */
  C.TopBar = function (p) {
    return html`<header class="topbar pagepad">
      ${p.left}
      ${p.title && html`<div style=${{ minWidth: 0 }}>
        <div class="title">${p.title}</div>
        ${p.sub && html`<div class="sub">${p.sub}</div>`}
      </div>`}
      <div class="spacer"></div>
      ${p.children}
    </header>`;
  };

  C.BottomBar = function (p) {
    return html`<footer class="bottombar pagepad">
      ${p.onBack && html`<${C.Btn} icon="back" onClick=${p.onBack}>${p.backLabel || '이전'}<//>`}
      ${p.extraLeft}
      <div class="spacer"></div>
      ${p.center}
      <div class="spacer"></div>
      ${p.extraRight}
      ${p.onHome && html`<${C.Btn} icon="home" onClick=${p.onHome}>홈<//>`}
      ${p.onNext && html`<${C.Btn} kind="primary" icon="next" disabled=${p.nextDisabled} onClick=${p.onNext}>${p.nextLabel || '다음'}<//>`}
    </footer>`;
  };

  /* 큰 점으로 보여 주는 진행 표시 — 글씨를 못 읽어도 어디쯤인지 알 수 있어요 */
  C.Dots = function (p) {
    var total = p.total, cur = p.current;
    return html`<div class="dots-bar" role="status"
        aria-label=${'모두 ' + total + '단계 가운데 ' + (cur + 1) + '단계'}>
      ${Array.apply(null, { length: total }).map(function (_, i) {
        return html`<span key=${i} class=${'dot-big' + (i < cur ? ' done' : (i === cur ? ' on' : ''))}></span>`;
      })}
      <span class="dots-num">${cur + 1} / ${total}</span>
    </div>`;
  };

  /* ======================= 단계 표시 ======================= */
  C.Steps = function (p) {
    return html`<nav class="steps" aria-label="진행 단계">
      ${p.steps.map(function (s, i) {
        var cls = 'dot' + (i === p.current ? ' on' : (i < p.current ? ' done' : ''));
        return html`<span key=${i} class=${cls}
          aria-current=${i === p.current ? 'step' : null}>${i < p.current ? '✓ ' : ''}${s}</span>`;
      })}
    </nav>`;
  };

  /* ======================= 무대 : 좌우로 넘기는 페이지 ======================= */
  /* 세로 스크롤을 만들지 않고, 넘치는 내용은 오른쪽 페이지로 이어집니다.
     ← → 방향키, 화면의 ‹ › 단추, 손가락 밀기로 페이지를 넘길 수 있습니다. */
  C.Stage = function (p) {
    var trackRef = useRef(null);
    var st = useState({ pages: 1, page: 0 });
    var s = st[0], setS = st[1];
    var touch = useRef({ x: 0, y: 0 });

    /* 한 페이지의 폭(=단 폭)과 페이지 수를 잽니다.
       테두리 안쪽 여백을 뺀 '내용 폭'을 단 폭으로 써야 페이지가 정확히 맞습니다. */
    function metrics(el) {
      var cs = window.getComputedStyle(el);
      var padL = parseFloat(cs.paddingLeft) || 0;
      var padR = parseFloat(cs.paddingRight) || 0;
      var gap = parseFloat(cs.columnGap) || 0;
      var contentW = el.clientWidth - padL - padR;
      return { padL: padL, padR: padR, gap: gap, contentW: contentW, stride: contentW + gap };
    }

    /* 같은 순간에 재는 일이 반복되지 않도록 막아 둡니다. */
    var pass = useRef({ n: 0, t: 0 });

    var measure = useCallback(function () {
      var el = trackRef.current; if (!el) return;
      if (!el.clientWidth) return;
      var now = Date.now();
      if (now - pass.current.t > 150) pass.current = { n: 0, t: now };
      if (pass.current.n > 5) return;
      pass.current.n++;

      var m = metrics(el);
      if (m.contentW <= 0) return;

      /* 내용이 흰 칸 높이를 넘을 때에만 좌우 페이지로 나눕니다.
         짧은 내용이면 단 나누기를 꺼서 흰 칸이 내용만큼만 차지하게 합니다.

         ※ 단 나누기(column-fill:auto)는 높이가 '확정'되어야 동작합니다.
            flex 로 정해진 높이는 확정으로 보지 않으므로, 넘칠 때에는
            지금 높이를 픽셀로 직접 지정해 줍니다. */
      el.style.columnWidth = 'auto';
      el.style.height = '';
      var avail = el.clientHeight;
      var natural = el.scrollHeight;
      var n = 1;
      if (natural > avail + 2 && avail > 0) {
        el.style.height = avail + 'px';
        el.style.columnWidth = Math.floor(m.contentW) + 'px';
        var span = el.scrollWidth - m.padL - m.padR;       // 단들이 차지한 전체 폭
        n = Math.max(1, Math.round((span + m.gap) / m.stride));
        if (n > 40) n = 40;
      }
      setS(function (prev) {
        var page = Math.min(prev.page, n - 1);
        return (prev.pages === n && prev.page === page) ? prev : { pages: n, page: page };
      });
    }, []);

    useLayoutEffect(function () {
      measure();
      var raf = window.requestAnimationFrame(function () { pass.current = { n: 0, t: 0 }; measure(); });
      var t = setTimeout(function () { pass.current = { n: 0, t: 0 }; measure(); }, 280);
      return function () { window.cancelAnimationFrame(raf); clearTimeout(t); };
    });

    useEffect(function () {
      var el = trackRef.current; if (!el) return;
      var ro = window.ResizeObserver ? new window.ResizeObserver(measure) : null;
      if (ro) ro.observe(el);
      window.addEventListener('resize', measure);
      return function () { if (ro) ro.disconnect(); window.removeEventListener('resize', measure); };
    }, [measure]);

    /* 페이지 위치 적용 */
    useEffect(function () {
      var el = trackRef.current; if (!el) return;
      el.style.scrollBehavior = 'auto';
      el.scrollLeft = s.page * metrics(el).stride;
    }, [s.page, s.pages]);

    var go = useCallback(function (dir) {
      setS(function (prev) {
        var next = Math.max(0, Math.min(prev.pages - 1, prev.page + dir));
        return next === prev.page ? prev : { pages: prev.pages, page: next };
      });
    }, []);

    /* 좌우 방향키 */
    useEffect(function () {
      function onKey(e) {
        if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
        if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
        var t = e.target;
        if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
        if (document.querySelector('.mask')) return;      // 팝업이 열려 있으면 넘기지 않음
        e.preventDefault();
        go(e.key === 'ArrowRight' ? 1 : -1);
      }
      window.addEventListener('keydown', onKey);
      return function () { window.removeEventListener('keydown', onKey); };
    }, [go]);

    function onTouchStart(e) {
      var t = e.touches && e.touches[0]; if (!t) return;
      touch.current = { x: t.clientX, y: t.clientY };
    }
    function onTouchEnd(e) {
      var t = e.changedTouches && e.changedTouches[0]; if (!t) return;
      var dx = t.clientX - touch.current.x, dy = t.clientY - touch.current.y;
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) go(dx < 0 ? 1 : -1);
    }

    return html`<div class="stage">
      <div class="panel">
      <div class="stage-track" ref=${trackRef} onTouchStart=${onTouchStart} onTouchEnd=${onTouchEnd}>
        ${p.children}
      </div>
      ${s.pages > 1 && html`<div class="pager">
        <button type="button" class="pager-btn" aria-label="앞 페이지" disabled=${s.page === 0}
          onClick=${function () { go(-1); }}>‹</button>
        <span class="dots" role="status" aria-live="polite">${s.page + 1} / ${s.pages}</span>
        <button type="button" class="pager-btn" aria-label="다음 페이지" disabled=${s.page >= s.pages - 1}
          onClick=${function () { go(1); }}>›</button>
      </div>`}
      ${p.action && html`<div class="panel-action">${p.action}</div>`}
      </div>
    </div>`;
  };

  /* 지도처럼 스스로 크기를 맞추는 화면용 (페이지 나눔 없음) */
  C.StageFit = function (p) {
    return html`<div class="stage"><div class="panel"><div class="stage-fit">${p.children}</div></div></div>`;
  };

  /* ======================= 질문 머리말 ======================= */
  C.Question = function (p) {
    return html`<div class="q">
      <h2 class="grow">${p.children}</h2>
      ${p.hint && html`<span class="hint">${p.hint}</span>`}
      ${p.speak !== false && html`<${C.Speak} text=${p.speakText || (typeof p.children === 'string' ? p.children : '')} />`}
    </div>`;
  };

  /* ======================= 고쳐 쓸 수 있는 문장 칸 =======================
     낱말을 골라 만든 문장이 문맥에 안 맞을 때가 있어서,
     점선 칸을 눌러 학생이 바로 고쳐 쓸 수 있게 했습니다.
       p.made    : 고른 낱말로 저절로 만들어진 문장
       p.value   : 고쳐 쓴 문장 (아직 안 고쳤으면 null)
       p.onChange(v) / p.onReset()                                   */
  C.SentenceEdit = function (p) {
    var edited = p.value !== null && p.value !== undefined;
    var text = edited ? p.value : (p.made || '');
    var rows = Math.max(3, Math.min(5, text.split('\n').length));
    return html`<div class="sentence-box">
      <textarea class="sentence-edit" rows=${rows} value=${text}
        placeholder=${p.placeholder || '빈칸을 채우면 문장이 저절로 만들어져요. 여기를 눌러 고쳐 쓸 수도 있어요.'}
        aria-label="일기 문장. 눌러서 직접 고쳐 쓸 수 있어요."
        onChange=${function (e) { p.onChange(e.target.value); }} />
      <div class="sentence-tools">
        <${C.Speak} text=${text.replace(/\n/g, ' ')} />
        <span class="small muted grow">✎ 노란 칸을 눌러 직접 고쳐 쓸 수 있어요</span>
        ${edited && html`<${C.Btn} size="small" icon="back" onClick=${p.onReset}>고른 낱말로 되돌리기<//>`}
      </div>
    </div>`;
  };

  /* ======================= 선택 카드 ======================= */
  C.Pick = function (p) {
    var cls = 'pick' + (p.selected ? ' sel' : '') + (p.compact ? ' compact' : '');
    return html`<button type="button" class=${cls} onClick=${p.onClick}
        aria-pressed=${p.selected ? 'true' : 'false'} aria-label=${p.ariaLabel || p.label}>
      <span class="check" aria-hidden="true">✓</span>
      <span class=${'thumb' + (p.portrait ? ' portrait' : '')}>${p.art}</span>
      <span class="label">${p.label}</span>
      ${p.note && html`<span class="note">${p.note}</span>`}
      ${p.more && html`<span class="more">${p.more}</span>`}
      ${p.speak !== false && p.speakText && html`<${C.Speak} short=${true} text=${p.speakText} />`}
    </button>`;
  };

  C.PickGrid = function (p) {
    var cls = 'pick-grid' + (p.cols ? ' cols-' + p.cols : '');
    return html`<div class=${cls} role="group" aria-label=${p.label || ''}>${p.children}</div>`;
  };

  /* 활동 선택 카드 */
  C.ActivityPick = function (p) {
    var a = p.activity;
    var kids = p.childCount || 0;
    return html`<${C.Pick}
      selected=${p.selected}
      onClick=${p.onClick}
      label=${a.name}
      more=${kids ? kids + '가지 더 있어요' : null}
      speakText=${a.speechName}
      ariaLabel=${a.name + (kids ? ', 하위 활동 ' + kids + '가지' : '') + (p.selected ? ', 선택됨' : '')}
      art=${html`<${C.ActivityArt} activity=${a} />`} />`;
  };

  /* ======================= 상태 배지 ======================= */
  C.StateChip = function (p) {
    var s = p.state;
    return html`<span class=${'chip ' + (p.tone || s.id)}>
      <span aria-hidden="true" dangerouslySetInnerHTML=${{ __html: App.icon(s.icon) }} />
      <span>${s.name}</span>
    </span>`;
  };

  /* 활동 상태를 아이콘 + 글자로 늘어놓기 */
  C.StateChips = function (p) {
    var st = p.status || {};
    var on = App.DATA.mapStates.filter(function (m) { return st[m.id]; });
    if (!on.length) return html`<span class="chip none">
      <span aria-hidden="true" dangerouslySetInnerHTML=${{ __html: App.icon('dash') }} />
      <span>${App.DATA.notTried.name}</span></span>`;
    return html`<${React.Fragment}>${on.map(function (m) {
      return html`<${C.StateChip} key=${m.id} state=${m} />`;
    })}<//>`;
  };

  /* ======================= 학생 표시 ======================= */
  C.WhoChip = function (p) {
    var s = p.student;
    if (!s) return null;
    var inner = html`<${React.Fragment}>
      <span class="face"><${C.AvatarArt} student=${s} /></span>
      <span class="nm">${s.name}</span>
      ${p.extra}
    <//>`;
    if (p.onClick) {
      return html`<button type="button" class="who" onClick=${p.onClick}
        aria-label=${'학생 바꾸기. 지금은 ' + s.name}>${inner}</button>`;
    }
    return html`<div class="who">${inner}</div>`;
  };

  /* ======================= 입력 조각 ======================= */
  C.Field = function (p) {
    return html`<label style=${{ display: 'block', width: p.width || '100%' }}>
      ${p.label && html`<span class="lab">${p.label}</span>`}
      <input class="field" type=${p.type || 'text'} value=${p.value == null ? '' : p.value}
        placeholder=${p.placeholder || ''} min=${p.min} max=${p.max}
        onChange=${function (e) { p.onChange(e.target.value); }} />
    </label>`;
  };

  C.Area = function (p) {
    return html`<label style=${{ display: 'block' }}>
      ${p.label && html`<span class="lab">${p.label}</span>`}
      <textarea class="field" rows=${p.rows || 6} value=${p.value || ''} placeholder=${p.placeholder || ''}
        onChange=${function (e) { p.onChange(e.target.value); }}></textarea>
    </label>`;
  };

  C.Switch = function (p) {
    return html`<button type="button" class=${'switch' + (p.on ? ' on' : '')}
        role="switch" aria-checked=${p.on ? 'true' : 'false'}
        onClick=${function () { p.onChange(!p.on); }}>
      <b>${p.label}</b>
      <span class="pill" aria-hidden="true"></span>
      <span class="txt">${p.on ? (p.onText || '켬') : (p.offText || '끔')}</span>
    </button>`;
  };

  /* ======================= 사진 ======================= */
  C.PhotoBox = function (p) {
    var url = p.photoId ? App.photos.url(p.photoId) : null;
    if (!url) return html`<div class="photo empty">${p.empty || '사진 없음'}</div>`;
    return html`<div class="photo"><img src=${url} alt=${p.alt || '활동 사진'} /></div>`;
  };

  C.PhotoPicker = function (p) {
    var fileRef = useRef(null);
    var busy = useState(false);
    function pick(e) {
      var files = Array.prototype.slice.call(e.target.files || []);
      if (!files.length) return;
      busy[1](true);
      var jobs = files.slice(0, 4).map(function (f) {
        return App.photos.addFile(f, p.studentId, p.kind || 'activity');
      });
      Promise.all(jobs).then(function (ids) {
        busy[1](false);
        p.onAdd(ids);
        App.ui.toast('사진을 저장했어요.');
      })['catch'](function (err) {
        busy[1](false);
        App.ui.toast(err && err.message ? err.message : '사진을 저장하지 못했어요.');
      });
      e.target.value = '';
    }
    return html`<div class="stack">
      <div class="wrap">
        <${C.Btn} icon="camera" onClick=${function () { if (fileRef.current) fileRef.current.click(); }}
          disabled=${busy[0]}>${busy[0] ? '저장하는 중…' : (p.label || '사진 넣기')}<//>
        <input ref=${fileRef} type="file" accept="image/*" multiple style=${{ display: 'none' }} onChange=${pick} />
      </div>
      ${p.photoIds && p.photoIds.length ? html`<div class="exh-grid">
        ${p.photoIds.map(function (id) {
          return html`<div key=${id} class="stack">
            <${C.PhotoBox} photoId=${id} />
            <${C.Btn} size="small" kind="danger" icon="trash" onClick=${function () {
              App.ui.confirm({ title: '이 사진을 지울까요?', okText: '지울래요', cancelText: '그만두기', tone: 'danger' })
                .then(function (ok) { if (ok) { App.photos.remove(id); p.onRemove(id); } });
            }}>사진 지우기<//>
          </div>`;
        })}
      </div>` : null}
    </div>`;
  };

  /* ======================= 그 밖 ======================= */
  C.Banner = function (p) {
    return html`<div class=${'banner ' + (p.tone || '')}>
      <div class="row">
        ${p.icon && html`<span style=${{ width: 32, height: 32, flex: '0 0 auto' }} aria-hidden="true"
          dangerouslySetInnerHTML=${{ __html: App.icon(p.icon) }} />`}
        <div class="grow">${p.children}</div>
        ${p.speakText && html`<${C.Speak} text=${p.speakText} />`}
      </div>
    </div>`;
  };

  C.Sec = function (p) {
    return html`<section class="sec">
      ${p.title && html`<h3>${p.title}${p.speakText && html`<${C.Speak} short=${true} text=${p.speakText} />`}</h3>`}
      ${p.children}
    </section>`;
  };

  App.useMemo2 = useMemo;
})();

</script>

<script>
/* ===========================================================
   나의 여가 — 표지 (첫 화면)
   · 가운데 아래 : 시작하기
   · 오른쪽 위   : 전체화면 · 선생님 설정
   · 시작하기를 고르면 표지 테두리가 노랗게 밝아지고 단추가 앞으로 나옵니다.
   =========================================================== */
(function () {
  var App = window.App, React = window.React, html = App.html, C = App.C;
  var useState = React.useState, useEffect = React.useEffect,
      useRef = React.useRef, useLayoutEffect = React.useLayoutEffect;

  /* 전체화면 켜기 / 끄기 (지원하지 않는 브라우저에서도 오류가 나지 않습니다) */
  App.fullscreen = {
    supported: function () {
      var el = document.documentElement;
      return !!(el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen);
    },
    isOn: function () {
      return !!(document.fullscreenElement || document.webkitFullscreenElement);
    },
    toggle: function () {
      try {
        if (App.fullscreen.isOn()) {
          var exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
          if (exit) exit.call(document);
        } else {
          var el = document.documentElement;
          var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
          if (req) { var r = req.call(el); if (r && r['catch']) r['catch'](function () {}); }
          else { App.ui.toast('이 브라우저는 전체화면을 지원하지 않아요. 키보드 F11 을 눌러 보세요.'); }
        }
      } catch (e) {
        App.ui.toast('전체화면으로 바꾸지 못했어요. 키보드 F11 을 눌러 보세요.');
      }
    }
  };

  /* 전체화면 상태를 지켜보는 도우미 */
  C.useFullscreen = function () {
    var s = useState(App.fullscreen.isOn());
    useEffect(function () {
      function sync() { s[1](App.fullscreen.isOn()); }
      document.addEventListener('fullscreenchange', sync);
      document.addEventListener('webkitfullscreenchange', sync);
      return function () {
        document.removeEventListener('fullscreenchange', sync);
        document.removeEventListener('webkitfullscreenchange', sync);
      };
    }, []);
    return s[0];
  };

  /* 음소거 단추 — 누르면 그 학생의 음성 안내가 꺼지고 켜집니다 */
  C.MuteBtn = function () {
    App.useStore();
    var st = App.store.current();
    var on = !st || st.voice !== false;      // on = 소리 켜짐
    return html`<${C.IconBtn} uiKey="speaker" icon=${on ? 'speaker' : 'speakerOff'}
      off=${!on}
      label=${on ? '소리 끄기' : '소리 켜기'}
      onClick=${function () {
        if (!st) return;
        App.speech.stop();
        App.store.updateStudent(st.id, { voice: !on });
      }} />`;
  };

                  onLoad=${function (e) {

<script>
/* ===========================================================
   나의 여가 — 계획하GO! (나의 여가 계획하기)
   한 화면에 한 가지 질문만 보여 주고, 활동은 6개씩 나누어 보여 줍니다.
   =========================================================== */
(function () {
  var App = window.App, React = window.React, html = App.html, C = App.C;
  var useState = React.useState;

  var PAGE_SIZE = 6;

  /* ------------------------- 그림 중심 계획표 ------------------------- */
  C.PlanSheet = function (p) {
    var plan = p.plan;
    var a = App.act(plan.activityId);
    var partner = App.partner(plan.partnerId);
    var student = p.student;
    return html`<div class="sheet">
      <div class="row" style=${{ alignItems: 'flex-start' }}>
        <div class="grow">
          <div class="sheet-title">오늘의 여가 계획표</div>
          <div class="sheet-meta">${student ? student.name : ''} · ${App.fmtDateLong(plan.date)}${
            App.timeWord(plan.time) ? ' · ' + App.timeWord(plan.time) : ''}</div>
        </div>
        <div style=${{ width: 'clamp(70px,10vh,120px)', height: 'clamp(70px,10vh,120px)', flex: '0 0 auto' }}>
          <${C.ActivityArt} activity=${a} />
        </div>
      </div>
      <div class="sentence" style=${{ marginTop: '.6rem' }}>${App.sentences.plan(plan)}</div>
      <div class="rows" style=${{ marginTop: '.7rem' }}>
        <div class="row"><span class="k">무엇을</span><b>${a ? a.name : '-'}</b></div>
        <div class="row"><span class="k">누구와</span><b>${partner ? partner.name : '-'}</b></div>
        <div class="row"><span class="k">언제</span><b>${App.fmtDateLong(plan.date)}${
          App.timeWord(plan.time) ? ' ' + App.timeWord(plan.time) : ''}</b></div>
        ${plan.place ? html`<div class="row"><span class="k">어디에서</span><b>${plan.place}</b></div>` : null}
        ${(plan.supplies && plan.supplies.length)
          ? html`<div class="row"><span class="k">준비물</span>
              <span class="wrap">${plan.supplies.map(function (s, i) {
                return html`<span key=${i} class="chip">${s}</span>`; })}</span></div>`
          : html`<div class="row"><span class="k">준비물</span><b>준비물이 없어요</b></div>`}
        ${plan.memo ? html`<div class="row"><span class="k">메모</span><b>${plan.memo}</b></div>` : null}
      </div>
    </div>`;
  };

  /* ------------------------- 계획 만들기 ------------------------- */
  C.PlanScreen = function (p) {
    App.useStore();
    var student = App.store.current();
    var editingId = p.params && p.params.planId;
    var existing = editingId ? App.store.plan(editingId) : null;

    var init = existing || {
      level: (student && student.planLevel) || 'easy',
      area: null, cardId: null, activityId: null, partnerId: null,
      date: App.todayKey(), time: '', place: '', supplies: [], memo: ''
    };
    var dr = useState(Object.assign({}, init));
    var draft = dr[0], setDraft = dr[1];
    var stepS = useState(0);
    var step = stepS[0], setStep = stepS[1];
    var pageS = useState(0);
    var savedS = useState(null);

    function patch(o) { setDraft(Object.assign({}, draft, o)); }

    var detail = draft.level === 'detail';
    var KEYS = detail
      ? ['area', 'what', 'who', 'when', 'time', 'place', 'supplies', 'confirm']
      : ['area', 'what', 'who', 'when', 'confirm'];
    var key = KEYS[step];

    /* 고르면 잠시 뒤 다음 질문으로 넘어갑니다.
       (시간이 지나 저절로 넘어가는 것이 아니라, 학생이 고른 결과로 넘어갑니다.
        고른 표시와 읽어주기를 확인할 만큼만 기다립니다.) */
    var goTimer = React.useRef(null);
    React.useEffect(function () {
      return function () { if (goTimer.current) clearTimeout(goTimer.current); };
    }, []);
    function pickAndGo(fn) {
      fn();
      if (goTimer.current) clearTimeout(goTimer.current);
      goTimer.current = setTimeout(function () {
        stepS[1](function (s) { return Math.min(s + 1, KEYS.length - 1); });
      }, 450);
    }

    /* 하위 활동 선택 화면 */
    var subS = useState(null);
    var subCard = subS[0];

    var cards = App.visibleCards(student, draft.area);
    var pageCount = Math.max(1, Math.ceil(cards.length / PAGE_SIZE));
    var page = Math.min(pageS[0], pageCount - 1);
    var pageCards = cards.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);

    function chooseCard(card) {
      var kids = App.visibleChildren(student, card);
      if (kids.length) { subS[1](card); App.speakFor(student, card.speechName); return; }
      pickAndGo(function () {
        patch({ cardId: card.id, activityId: card.id, place: draft.place || card.defaultPlace,
                supplies: draft.supplies.length ? draft.supplies : card.defaultSupplies.slice() });
        App.speakFor(student, card.speechName);
      });
    }
    function chooseChild(card, child) {
      pickAndGo(function () {
        patch({ cardId: card.id, activityId: child.id, place: draft.place || child.defaultPlace,
                supplies: draft.supplies.length ? draft.supplies : child.defaultSupplies.slice() });
        App.speakFor(student, child.speechName);
        subS[1](null);
      });
    }

    function canNext() {
      if (key === 'area') return !!draft.area;
      if (key === 'what') return !!draft.activityId;
      if (key === 'who') return !!draft.partnerId;
      if (key === 'when') return !!draft.date;
      return true;
    }
    function next() { if (step < KEYS.length - 1) setStep(step + 1); }
    function back() {
      if (subCard) { subS[1](null); return; }
      if (step > 0) setStep(step - 1); else p.nav('home');
    }

    function save() {
      var payload = {
        studentId: student.id, level: draft.level, area: draft.area,
        activityId: draft.activityId, cardId: draft.cardId,
        partnerId: draft.partnerId, date: draft.date, time: draft.time,
        place: draft.place, supplies: draft.supplies, memo: draft.memo
      };
      var id;
      if (existing) { App.store.updatePlan(existing.id, payload); id = existing.id; }
      else { id = App.store.addPlan(payload); }
      savedS[1](id);
      App.ui.toast('계획을 저장했어요.');
      App.speakFor(student, '계획을 저장했어요. ' + App.sentences.plan(payload));
    }

    var previewPlan = Object.assign({}, draft, { studentId: student && student.id });

    /* --------------------- 각 단계 화면 --------------------- */
    function body() {
      if (savedS[0]) {
        var saved = App.store.plan(savedS[0]) || previewPlan;
        return html`<${React.Fragment}>
          <${C.Banner} tone="ok" icon="check" speakText="계획을 잘 저장했어요.">
            <b style=${{ fontSize: '1.2rem' }}>계획을 잘 저장했어요.</b>
            <div class="small">홈 화면에 <b>오늘의 여가 계획</b>으로 나타나요.</div>
          <//>
          <div style=${{ height: '.7rem' }}></div>
          <${C.PlanSheet} plan=${saved} student=${student} />
        <//>`;
      }

      if (subCard) {
        var kids = App.visibleChildren(student, subCard);
        /* 앞 질문과 똑같은 말이면 되돌아간 것처럼 느껴집니다 — 이어지는 질문으로 씁니다. */
        var subQ = '어떤 ' + App.shortName(subCard) + '을 할까요?';
        if (subCard.id === 'cook') subQ = '어떤 요리를 할까요?';
        else if (subCard.id === 'make') subQ = '무엇을 만들까요?';
        else if (subCard.id === 'collect') subQ = '무엇을 모을까요?';
        else if (subCard.id === 'toy') subQ = '어떤 놀잇감으로 놀까요?';
        return html`<${React.Fragment}>
          <${C.Question} hint="한 가지를 골라요" speakText=${subQ}>${subQ}<//>
          <${C.PickGrid} cols=${kids.length > 4 ? 3 : 2} label="세부 활동">
            ${kids.map(function (ch) {
              return html`<${C.ActivityPick} key=${ch.id} activity=${ch}
                selected=${draft.activityId === ch.id}
                onClick=${function () { chooseChild(subCard, ch); }} />`;
            })}
          <//>
          <div class="wrap" style=${{ marginTop: '.7rem' }}>
            <${C.Btn} icon="back" onClick=${function () { subS[1](null); }}>다른 활동 고르기<//>
          </div>
        <//>`;
      }

      if (key === 'area') {
        return html`<${React.Fragment}>
          <${C.Question} hint="한 가지를 골라요" speakText="어디에서 할까요?">어디에서 할까요?<//>
          <${C.PickGrid} cols=${2} label="장소 종류">
            <${C.Pick} selected=${draft.area === 'indoor'} label="실내에서 해요" speakText="실내에서 해요"
              onClick=${function () { pickAndGo(function () {
                patch({ area: 'indoor' }); pageS[1](0); App.speakFor(student, '실내에서 해요'); }); }}
              art=${html`<${C.Art} iconKey="door" />`} />
            <${C.Pick} selected=${draft.area === 'outdoor'} label="실외에서 해요" speakText="실외에서 해요"
              onClick=${function () { pickAndGo(function () {
                patch({ area: 'outdoor' }); pageS[1](0); App.speakFor(student, '실외에서 해요'); }); }}
              art=${html`<${C.Art} iconKey="tree" />`} />
          <//>
        <//>`;
      }

      if (key === 'what') {
        return html`<${React.Fragment}>
          <${C.Question} hint=${'모두 ' + cards.length + '가지'} speakText="무엇을 할까요?">무엇을 할까요?<//>
          <${C.PickGrid} cols=${3} label="활동 목록">
            ${pageCards.map(function (c) {
              var kids = App.visibleChildren(student, c);
              return html`<${C.ActivityPick} key=${c.id} activity=${c} childCount=${kids.length}
                selected=${draft.cardId === c.id}
                onClick=${function () { chooseCard(c); }} />`;
            })}
          <//>
          ${pageCount > 1 && html`<div class="wrap" style=${{ marginTop: '.7rem', justifyContent: 'center' }}>
            <${C.Btn} icon="back" disabled=${page === 0} onClick=${function () { pageS[1](page - 1); }}>앞 활동 보기<//>
            <span class="chip">${page + 1} / ${pageCount}</span>
            <${C.Btn} icon="next" disabled=${page >= pageCount - 1} onClick=${function () { pageS[1](page + 1); }}>다음 활동 보기<//>
          </div>`}
          ${draft.activityId && html`<div class="sentence" style=${{ marginTop: '.7rem' }}>
            고른 활동 : ${App.act(draft.activityId).name}
            <${C.Btn} size="small" onClick=${function () { patch({ cardId: null, activityId: null }); }}>다시 선택하기<//>
          </div>`}
        <//>`;
      }

      if (key === 'who') {
        var partners = App.partnersFor(student);
        return html`<${React.Fragment}>
          <${C.Question} hint="한 사람을 골라요" speakText="누구와 할까요?">누구와 할까요?<//>
          <${C.PickGrid} cols=${4} label="함께하는 사람">
            ${partners.map(function (pt) {
              return html`<${C.Pick} key=${pt.id} selected=${draft.partnerId === pt.id}
                label=${pt.name} speakText=${pt.name} portrait=${true}
                onClick=${function () { pickAndGo(function () {
                  patch({ partnerId: pt.id }); App.speakFor(student, pt.name); }); }}
                art=${html`<${C.PartnerArt} partner=${pt} student=${student} />`} />`;
            })}
          <//>
        <//>`;
      }

      if (key === 'when') {
        var t = App.todayKey();
        return html`<${React.Fragment}>
          <${C.Question} hint="한 가지를 골라요" speakText="언제 할까요?">언제 할까요?<//>
          <${C.PickGrid} cols=${3} label="날짜">
            <${C.Pick} selected=${draft.date === t} label="오늘" speakText="오늘"
              onClick=${function () { pickAndGo(function () { patch({ date: t }); App.speakFor(student, '오늘'); }); }}
              art=${html`<${C.Art} iconKey="sun" />`} />
            <${C.Pick} selected=${draft.date === App.addDays(t, 1)} label="내일" speakText="내일"
              onClick=${function () { pickAndGo(function () { patch({ date: App.addDays(t, 1) }); App.speakFor(student, '내일'); }); }}
              art=${html`<${C.Art} iconKey="calendar" />`} />
            <div class="pick" style=${{ cursor: 'default' }}>
              <span class="thumb"><${C.Art} iconKey="pencil" /></span>
              <span class="label">날짜 고르기</span>
              <input class="field" type="date" value=${draft.date}
                onChange=${function (e) { patch({ date: e.target.value || t }); }} />
              <${C.Btn} size="small" onClick=${next}>이 날짜로<//>
            </div>
          <//>
        <//>`;
      }

      if (key === 'time') {
        return html`<${React.Fragment}>
          <${C.Question} hint="한 가지를 골라요" speakText="몇 시에 할까요?">몇 시에 할까요?<//>
          <${C.PickGrid} cols=${3} label="시간">
            <${C.Pick} selected=${draft.time === 'am'} label="오전" speakText="오전"
              onClick=${function () { pickAndGo(function () { patch({ time: 'am' }); App.speakFor(student, '오전'); }); }}
              art=${html`<${C.Art} iconKey="sun" />`} />
            <${C.Pick} selected=${draft.time === 'pm'} label="오후" speakText="오후"
              onClick=${function () { pickAndGo(function () { patch({ time: 'pm' }); App.speakFor(student, '오후'); }); }}
              art=${html`<${C.Art} iconKey="clock" />`} />
            <${C.Pick} selected=${draft.time === ''} label="정하지 않아요" speakText="시간을 정하지 않아요"
              onClick=${function () { pickAndGo(function () { patch({ time: '' }); }); }}
              art=${html`<${C.Art} iconKey="dash" />`} />
          <//>
        <//>`;
      }

      if (key === 'place') {
        var act = App.act(draft.activityId);
        var suggests = [];
        if (act && act.defaultPlace) suggests.push(act.defaultPlace);
        ['교실', '집', '학교', '공원', '운동장'].forEach(function (s) { if (suggests.indexOf(s) < 0) suggests.push(s); });
        return html`<${React.Fragment}>
          <${C.Question} hint="한 곳을 골라요" speakText="어느 곳에서 할까요?">어느 곳에서 할까요?<//>
          <${C.PickGrid} cols=${3} label="장소">
            ${suggests.slice(0, 5).map(function (s) {
              return html`<${C.Pick} key=${s} selected=${draft.place === s} label=${s} speakText=${s}
                onClick=${function () { patch({ place: s }); }} art=${html`<${C.Art} iconKey="map" />`} />`;
            })}
            <div class="pick" style=${{ cursor: 'default' }}>
              <span class="thumb"><${C.Art} iconKey="pencil" /></span>
              <span class="label">직접 쓰기</span>
              <input class="field" value=${draft.place || ''} placeholder="예) 우리 집 거실"
                onChange=${function (e) { patch({ place: e.target.value }); }} />
            </div>
          <//>
        <//>`;
      }

      if (key === 'supplies') {
        var chosen = draft.supplies || [];
        function toggle(name) {
          var has = chosen.indexOf(name) >= 0;
          patch({ supplies: has ? chosen.filter(function (x) { return x !== name; }) : chosen.concat([name]) });
        }
        var actS = App.act(draft.activityId);
        var base = App.DATA.supplies.slice();
        (actS ? actS.defaultSupplies : []).forEach(function (n) {
          if (!base.some(function (b) { return b.name === n; })) base.unshift({ id: 'x-' + n, name: n, icon: 'bag' });
        });
        return html`<${React.Fragment}>
          <${C.Question} hint="여러 개 고를 수 있어요" speakText="필요한 준비물이 있나요?">필요한 준비물이 있나요?<//>
          <${C.PickGrid} cols=${4} label="준비물">
            ${base.slice(0, 8).map(function (s) {
              return html`<${C.Pick} key=${s.id} selected=${chosen.indexOf(s.name) >= 0}
                label=${s.name} speakText=${s.name} onClick=${function () { toggle(s.name); }}
                art=${html`<${C.Art} iconKey=${s.icon} />`} />`;
            })}
          <//>
          <div class="wrap" style=${{ marginTop: '.7rem' }}>
            <${C.Btn} kind=${chosen.length === 0 ? 'ok' : ''} icon="check"
              onClick=${function () { patch({ supplies: [] }); }}>준비물이 없어요<//>
          </div>
          <div style=${{ marginTop: '.7rem' }}>
            <${C.Field} label="준비물 직접 쓰기 (넣고 싶은 것을 적고 넣기를 눌러요)"
              value=${draft._extra || ''} placeholder="예) 색연필"
              onChange=${function (v) { patch({ _extra: v }); }} />
            <div class="wrap" style=${{ marginTop: '.4rem' }}>
              <${C.Btn} size="small" icon="plus" onClick=${function () {
                var v = (draft._extra || '').trim();
                if (!v) return;
                if (chosen.indexOf(v) < 0) patch({ supplies: chosen.concat([v]), _extra: '' });
                else patch({ _extra: '' });
              }}>준비물 넣기<//>
            </div>
          </div>
          ${chosen.length ? html`<div class="sentence" style=${{ marginTop: '.7rem' }}>
            준비물 : ${chosen.map(function (c, i) {
              return html`<button key=${i} type="button" class="chip" onClick=${function () { toggle(c); }}
                title="누르면 빼요">${c} ✕</button>`;
            })}
          </div>` : null}
          <div style=${{ marginTop: '.7rem' }}>
            <${C.Area} label="활동 순서 또는 간단한 메모" rows=${3} value=${draft.memo}
              placeholder="예) 1. 재료 꺼내기  2. 만들기  3. 정리하기"
              onChange=${function (v) { patch({ memo: v }); }} />
          </div>
        <//>`;
      }

      /* 확인 */
      return html`<${React.Fragment}>
        <${C.Question} hint="맞으면 저장해요" speakText=${'계획을 확인해요. ' + App.sentences.plan(previewPlan)}>
          계획을 확인해요
        <//>
        <${C.PlanSheet} plan=${previewPlan} student=${student} />
      <//>`;
    }

    /* --------------------- 화면 --------------------- */
    var saved = savedS[0];

    /* 흰 칸 맨 아래에 '지금 할 일' 하나만 큼직하게 놓습니다. */
    var action = null;
    if (saved) {
      action = html`<${C.Btn} icon="cornerDiary"
        onClick=${function () { p.nav('diary', { planId: saved }); }}>일기 쓰러 가기<//>`;
    } else if (key === 'confirm') {
      action = html`<${C.Btn} icon="save" onClick=${save}>계획 저장하기<//>`;
    } else if (key === 'supplies') {
      action = html`<${C.Btn} icon="next" onClick=${next}>다 골랐어요<//>`;
    } else if (key === 'place') {
      action = html`<${C.Btn} icon="next" disabled=${!canNext()} onClick=${next}>다음<//>`;
    }

    return html`<div class="app" data-corner="plan">
      <!-- '다시 고르기' 는 아래가 아니라 위쪽 줄, 홈 옆에 둡니다 (아래에 있으면 잘 안 보임) -->
      <${C.TopBar} title="계획하GO!"
        left=${html`<${React.Fragment}>
          <${C.IconBtn} uiKey="home" icon="home" label="홈으로 가기"
            onClick=${function () { p.nav('home'); }} />
          ${!saved && html`<${C.Btn} size="small" icon="back" onClick=${back}>
            ${step === 0 && !subCard ? '그만두기' : '다시 고르기'}<//>`}
        <//>`}>
        ${!saved && html`<${C.Dots} total=${KEYS.length} current=${step} />`}
        <${C.WhoChip} student=${student} />
      <//>

      <${C.Stage} action=${action}>${body()}<//>
    </div>`;
  };
})();

</script>

<script>
/* ===========================================================
   나의 여가 — 알아보GO! (나의 여가 탐험 지도)
   가운데에 나의 캐릭터, 둘레에 실내·실외 활동이 섬처럼 펼쳐집니다.
   상태는 아이콘과 글자를 함께 보여 주며, 색만으로 구분하지 않습니다.
   =========================================================== */
(function () {
  var App = window.App, React = window.React, html = App.html, C = App.C;
  var useState = React.useState, useRef = React.useRef, useEffect = React.useEffect,
      useMemo = React.useMemo, useLayoutEffect = React.useLayoutEffect;

  /* -----------------------------------------------------------------
     여가 탐험 지도의 자리 잡기
     · 가운데에 학생 캐릭터
     · 양옆(또는 위아래)으로 '실내 여가 섬' 과 '실외 여가 섬'
     · 화면 크기에 맞추어 카드 크기를 스스로 정하므로 글씨가 작아지지 않습니다
     ----------------------------------------------------------------- */
  var PAD = 10, GAP = 10, LABEL_H = 24, NAV_H = 52;
  var COLS = 2, ROWS = 2;              // 한 섬에 2줄 × 2칸 = 4장씩
  var PER = COLS * ROWS;

  /* 섬 한 칸 안에 카드 4장을 가장 크게 놓기 (아래 화살표 자리는 빼고) */
  function gridFor(region, list) {
    var innerW = region.w - PAD * 2;
    var innerH = region.h - LABEL_H - NAV_H;
    var cellW = (innerW - GAP * (COLS - 1)) / COLS;
    var cellH = (innerH - GAP * (ROWS - 1)) / ROWS;
    var cw = Math.max(60, Math.min(cellW, cellH));   // 정사각형
    var totalW = COLS * cw + (COLS - 1) * GAP;
    var totalH = ROWS * cw + (ROWS - 1) * GAP;
    var x0 = region.x + (region.w - totalW) / 2;
    var y0 = region.y + LABEL_H + Math.max(0, (innerH - totalH) / 2);
    return list.map(function (card, i) {
      var r = Math.floor(i / COLS), c = i % COLS;
      return { card: card, x: x0 + c * (cw + GAP), y: y0 + r * (cw + GAP), w: cw, h: cw };
    });
  }

  /* 전체 자리 잡기 — 섬마다 제 쪽(page)의 카드만 놓습니다 */
  function layoutOf(box, indoor, outdoor, pageIn, pageOut) {
    var w = Math.max(320, box.w), h = Math.max(240, box.h);
    /* '나' 는 맨 위 가운데, 그 아래 왼쪽에 실내 섬 · 오른쪽에 실외 섬 */
    var cs = Math.max(110, Math.min(170, Math.min(w * 0.17, h * 0.26)));
    var top = PAD + cs + 26;                        // 발자국 길 자리까지 포함
    var islandW = (w - PAD * 3) / 2;
    var islandH = h - top - PAD;
    var center = { x: (w - cs) / 2, y: PAD, w: cs, h: cs };
    var regionIn = { x: PAD, y: top, w: islandW, h: islandH };
    var regionOut = { x: PAD * 2 + islandW, y: top, w: islandW, h: islandH };
    var side = true;

    var pagesIn = Math.max(1, Math.ceil(indoor.length / PER));
    var pagesOut = Math.max(1, Math.ceil(outdoor.length / PER));
    var pi = Math.min(pageIn, pagesIn - 1), po = Math.min(pageOut, pagesOut - 1);
    var placed = gridFor(regionIn, indoor.slice(pi * PER, pi * PER + PER))
        .map(function (q) { return Object.assign(q, { island: 'in' }); })
      .concat(gridFor(regionOut, outdoor.slice(po * PER, po * PER + PER))
        .map(function (q) { return Object.assign(q, { island: 'out' }); }));

    /* '나' 에서 두 섬으로 이어지는 발자국 길 */
    var trail = [];
    [regionIn, regionOut].forEach(function (r, k) {
      var x0 = center.x + center.w / 2, y0 = center.y + center.h - 4;
      var x1 = r.x + r.w / 2, y1 = r.y + 4;
      for (var i = 1; i <= 3; i++) {
        var t = i / 4;
        trail.push({
          x: x0 + (x1 - x0) * t,
          y: y0 + (y1 - y0) * t,
          rot: Math.atan2(y1 - y0, x1 - x0) * 180 / Math.PI + 90,
          key: (k ? 'o' : 'i') + i
        });
      }
    });

    return {
      W: w, H: h, side: side, placed: placed, center: center, trail: trail,
      pagesIn: pagesIn, pagesOut: pagesOut, pageIn: pi, pageOut: po,
      islands: [
        { key: 'in', label: '실내 여가 섬', region: regionIn, tone: '#c9a87f',
          page: pi, pages: pagesIn },
        { key: 'out', label: '실외 여가 섬', region: regionOut, tone: '#8fbb85',
          page: po, pages: pagesOut }
      ]
    };
  }

  C.MapScreen = function (p) {
    App.useStore();
    var student = App.store.current();
    var wrapRef = useRef(null);
    var box = useState({ w: 900, h: 500 });
    var view = useState({ zoom: 1, px: 0, py: 0 });
    var filter = useState('all');
    var openCard = useState(null);
    var helpS = useState(false);
    var toolsS = useState(false);      // 찾아보기 도구를 펼쳤는지

    var cards = useMemo(function () { return App.visibleCards(student); }, [student]);
    var indoor = cards.filter(function (c) { return c.area === 'indoor'; });
    var outdoor = cards.filter(function (c) { return c.area === 'outdoor'; });

    var pIn = useState(0), pOut = useState(0);   // 섬마다 따로 넘깁니다
    var L = useMemo(function () {
      return layoutOf(box[0], indoor, outdoor, pIn[0], pOut[0]);
    }, [cards.map(function (c) { return c.id; }).join(','),
        Math.round(box[0].w), Math.round(box[0].h), pIn[0], pOut[0]]);
    function turn(key, d) {
      var s = key === 'in' ? pIn : pOut;
      var max = (key === 'in' ? L.pagesIn : L.pagesOut) - 1;
      s[1](function (n) { return Math.max(0, Math.min(max, n + d)); });
    }
    var W = L.W, H = L.H;
    var placed = L.placed;
    var CX = L.center.x + L.center.w / 2, CY = L.center.y + L.center.h / 2;

    /* 화면 크기 재기 */
    useLayoutEffect(function () {
      function measure() {
        var el = wrapRef.current; if (!el) return;
        var r = el.getBoundingClientRect();
        box[1](function (prev) {
          return (Math.abs(prev.w - r.width) < 1 && Math.abs(prev.h - r.height) < 1)
            ? prev : { w: r.width, h: r.height };
        });
      }
      measure();
      var ro = window.ResizeObserver ? new window.ResizeObserver(measure) : null;
      if (ro && wrapRef.current) ro.observe(wrapRef.current);
      window.addEventListener('resize', measure);
      return function () { if (ro) ro.disconnect(); window.removeEventListener('resize', measure); };
    }, []);

    /* 자리 잡기가 이미 화면 크기에 맞추어 계산되므로 기본 배율은 1입니다.
       ＋ 크게 를 누르면 커지고, 넘치는 만큼은 방향키로 움직입니다. */
    var scale = view[0].zoom;
    var offX = (box[0].w - W * scale) / 2 + view[0].px;
    var offY = (box[0].h - H * scale) / 2 + view[0].py;
    var overflowX = W * scale - box[0].w;
    var overflowY = H * scale - box[0].h;

    /* 좌우 방향키로 지도 쪽을 넘깁니다 */
    useEffect(function () {
      function onKey(e) {
        if (e.altKey || e.ctrlKey || e.metaKey) return;
        if (document.querySelector('.mask')) return;
        var t = e.target;
        if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
        if (e.key === 'ArrowRight') { e.preventDefault(); turn('in', 1); turn('out', 1); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); turn('in', -1); turn('out', -1); }
      }
      window.addEventListener('keydown', onKey);
      return function () { window.removeEventListener('keydown', onKey); };
    }, [L.pagesIn, L.pagesOut]);

    var statusMap = App.store.mapOf(student && student.id);
    function statusOf(id) { return statusMap[id] || { tried: false, like: false, challenge: false, unsure: false }; }

    function matches(cardId) {
      var st = statusOf(cardId);
      switch (filter[0]) {
        case 'tried': return !!st.tried;
        case 'like': return !!st.like;
        case 'challenge': return !!st.challenge;
        case 'none': return !st.tried;
        default: return true;
      }
    }

    var FILTERS = [
      { id: 'all', name: '모두 보기', icon: 'eye' },
      { id: 'tried', name: '해봤어요', icon: 'foot' },
      { id: 'like', name: '좋아해요', icon: 'heart' },
      { id: 'challenge', name: '도전하고 싶어요', icon: 'star' },
      { id: 'none', name: '아직 안 해봤어요', icon: 'dash' }
    ];

    var summary = App.sentences.mapSummary(statusMap, cards);
    var shownCount = placed.filter(function (q) { return matches(q.card.id); }).length;

    function toggle(cardId, key) {
      App.store.toggleMapState(student.id, cardId, key);
      var st = App.store.statusOf(student.id, cardId);
      var s = App.DATA.mapStates.filter(function (m) { return m.id === key; })[0];
      App.speakFor(student, s.name + (st[key] ? ' 선택했어요' : ' 선택을 지웠어요'));
    }

    return html`<div class="app" data-corner="map">
      <${C.TopBar} title="알아보GO!" sub="나의 여가 탐험 지도"
        left=${html`<${C.IconBtn} uiKey="home" icon="home" label="홈으로 가기"
          onClick=${function () { p.nav('home'); }} />`}>
        <${C.Btn} size="small" icon="cornerDiary" onClick=${function () { p.nav('diary'); }}>일기 쓰기<//>
        <${C.Speak} text=${'나의 여가 탐험 지도. ' + summary.join(' ')} />
        <${C.WhoChip} student=${student} />
      <//>

      <div class="stage">
        <!-- 폭은 다른 화면과 같게(가운데 기둥), 높이만 남는 만큼 씁니다.
             ※ flex:1 1 auto 를 주면 '가로로도' 늘어나 다른 화면보다 넓어집니다. -->
        <div class="panel" style=${{ alignSelf: 'stretch' }}>
        <div class="stage-fit" style=${{ display: 'flex', flexDirection: 'column', gap: '.45rem' }}>

          <!-- 학생 화면에는 지도와 활동카드만 둡니다.
               필터·확대·도움말은 선생님이 켤 때에만 나옵니다. -->
          ${student && student.mapTools ? html`<div class="row" style=${{ gap: '.4rem' }}>
            <${C.Btn} size="small" icon="eye" onClick=${function () { toolsS[1](!toolsS[0]); }}>
              찾아보기 ${toolsS[0] ? '▲' : '▼'}<//>
            ${filter[0] !== 'all' && html`<span class="chip">
              ${FILTERS.filter(function (f) { return f.id === filter[0]; })[0].name} 만 보여요
            </span>`}
            <div class="grow"></div>
            <${C.Btn} size="small" icon="question" onClick=${function () { helpS[1](true); }}>지도 도움말<//>
          </div>` : null}

          ${student && student.mapTools && toolsS[0] && html`<div class="map-toolbox">
            <div class="map-tools">
              ${FILTERS.map(function (f) {
                return html`<button key=${f.id} type="button"
                  class=${'tab' + (filter[0] === f.id ? ' on' : '')}
                  aria-pressed=${filter[0] === f.id ? 'true' : 'false'}
                  onClick=${function () { filter[1](f.id); }}>
                  <span style=${{ width: 18, height: 18, display: 'inline-block', verticalAlign: '-3px', marginRight: 4 }}
                    aria-hidden="true" dangerouslySetInnerHTML=${{ __html: App.icon(f.icon) }} />
                  ${f.name}${filter[0] === f.id ? ' ✓' : ''}</button>`;
              })}
            </div>
            <div class="map-tools" style=${{ marginTop: '.4rem' }}>
              <${C.Btn} size="small" onClick=${function () { view[1]({ zoom: Math.max(0.6, view[0].zoom - 0.2), px: 0, py: 0 }); }} ariaLabel="지도 작게">－ 작게<//>
              <span class="chip">${Math.round(view[0].zoom * 100)}%</span>
              <${C.Btn} size="small" onClick=${function () { view[1]({ zoom: Math.min(2.2, view[0].zoom + 0.2), px: 0, py: 0 }); }} ariaLabel="지도 크게">＋ 크게<//>
              <${C.Btn} size="small" onClick=${function () { view[1]({ zoom: 1, px: 0, py: 0 }); }}>처음 크기<//>
            </div>
          </div>`}

          <div class="map-wrap grow" ref=${wrapRef}>
            <div class="map-canvas" style=${{ width: W + 'px', height: H + 'px',
                transform: 'translate(' + offX + 'px,' + offY + 'px) scale(' + scale + ')' }}>

              <!-- 섬 이름만 글자로 둡니다 (바탕색·점선은 눈에 거슬려 없앴습니다) -->
              ${L.islands.map(function (is) {
                var r = is.region;
                return html`<div key=${'t' + is.key} class="island-label"
                  style=${{ left: r.x + 'px', top: r.y + 'px', width: r.w + 'px' }}>${is.label}</div>`;
              })}

              <!-- '나' 에서 두 섬으로 이어지는 발자국 길 -->
              ${L.trail.map(function (f) {
                return html`<i key=${'f' + f.key} class="map-foot" aria-hidden="true"
                  style=${{ left: f.x + 'px', top: f.y + 'px',
                            transform: 'translate(-50%,-50%) rotate(' + f.rot + 'deg)' }}
                  dangerouslySetInnerHTML=${{ __html: App.icon('foot') }} />`;
              })}

              <div class="map-me" style=${{ left: CX + 'px', top: CY + 'px',
                  width: L.center.w + 'px', height: L.center.h + 'px' }}>
                <span class="face"><${C.AvatarArt} student=${student} /></span>
                <span class="nm">${student ? student.name : ''}</span>
              </div>

              ${placed.map(function (q) {
                var st = statusOf(q.card.id);
                var on = App.DATA.mapStates.filter(function (m) { return st[m.id]; });
                var words = on.map(function (m) { return m.name; }).join(' · ');
                var show = matches(q.card.id);
                return html`<button key=${q.card.id} type="button"
                    class=${'mapcard ' + (q.card.area === 'indoor' ? 'indoor' : 'outdoor') +
                            (st.tried ? ' tried' : '') + (show ? '' : ' dim')}
                    style=${{ left: q.x + 'px', top: q.y + 'px', width: q.w + 'px', height: q.h + 'px',
                              '--cw': q.w + 'px' }}
                    tabIndex=${show ? 0 : -1}
                    aria-hidden=${show ? null : 'true'}
                    onClick=${function () { if (show) { openCard[1](q.card); App.speakFor(student, q.card.speechName); } }}
                    aria-label=${q.card.name + '. ' + (words || App.DATA.notTried.name)}>
                  <span class="mi"><${C.ActivityArt} activity=${q.card} /></span>
                  <span class="mn">${q.card.name}</span>
                  ${on.length ? html`<span class="mb">${on.map(function (m) {
                    return html`<i key=${m.id} class=${m.id} title=${m.name} aria-hidden="true"
                      dangerouslySetInnerHTML=${{ __html: App.icon(m.icon) }} />`;
                  })}</span>` : null}
                </button>`;
              })}
            </div>

            <!-- 섬마다 아래에 이전 / 다음 -->
            ${L.islands.map(function (is) {
              if (is.pages <= 1) return null;
              var r = is.region;
              return html`<div key=${'nav' + is.key} class="island-nav"
                  style=${{ left: r.x + 'px', top: (r.y + r.h - 46) + 'px', width: r.w + 'px' }}>
                <button type="button" class="isl-btn prev" aria-label=${is.label + ' 앞 활동 보기'}
                  disabled=${is.page === 0} onClick=${function () { turn(is.key, -1); }}>◀ 이전</button>
                <span class="isl-page">
                  <b>${is.page + 1} / ${is.pages} 쪽</b>
                  <span class="isl-dots">
                    ${Array.apply(null, { length: is.pages }).map(function (_, i) {
                      return html`<i key=${i} class=${i === is.page ? 'on' : ''}></i>`;
                    })}
                  </span>
                </span>
                <button type="button" class="isl-btn next" aria-label=${is.label + ' 다음 활동 보기'}
                  disabled=${is.page >= is.pages - 1} onClick=${function () { turn(is.key, 1); }}>다음 ▶</button>
              </div>`;
            })}
          </div>

          <!-- 요약은 첫 문장만 -->
          <div class="map-summary">
            <div class="row" style=${{ flexWrap: 'nowrap' }}>
              <span class="grow" style=${{ minWidth: 0 }}>${summary[0]}</span>
              ${student && student.mapTools && summary.length > 1 && html`<${C.Btn} size="small"
                onClick=${function () { helpS[1](true); }}>자세히<//>`}
            </div>
          </div>
        </div>
        </div>
      </div>


      ${helpS[0] && html`<${C.Modal} title="지도 표시 뜻과 요약" onClose=${function () { helpS[1](false); }}
        speakText=${summary.join(' ')}
        actions=${html`<${C.Btn} kind="ok" onClick=${function () { helpS[1](false); }}>닫기<//>`}>
        <div class="stack">
          <div class="wrap">
            ${App.DATA.mapStates.map(function (m) {
              return html`<${C.StateChip} key=${m.id} state=${m} />`;
            })}
            <span class="chip none">
              <span aria-hidden="true" dangerouslySetInnerHTML=${{ __html: App.icon('dash') }} />
              <span>표시가 없으면 아직 안 해봤어요</span></span>
          </div>
          <div class="sentence">
            ${summary.map(function (s, i) { return html`<div key=${i}>${s}</div>`; })}
          </div>
          ${filter[0] !== 'all' && html`<p class="small muted">
            지금 보이는 활동 : ${shownCount}가지 (${FILTERS.filter(function (f) { return f.id === filter[0]; })[0].name})</p>`}
          <p class="small muted">활동카드를 누르면 표시를 고를 수 있어요.</p>
        </div>
      <//>`}

      ${openCard[0] && html`<${C.MapCardPanel} card=${openCard[0]} student=${student}
        status=${statusOf(openCard[0].id)}
        onToggle=${function (k) { toggle(openCard[0].id, k); }}
        onClose=${function () { openCard[1](null); }}
        onPlan=${function () { openCard[1](null); p.nav('plan'); }} />`}
    </div>`;
  };

  /* ------------------------- 활동 상태 고르기 팝업 ------------------------- */
  C.MapCardPanel = function (p) {
    var st = p.status;
    var q = '이 활동은 나에게 어떤 여가인가요?';
    return html`<${C.Modal} title=${q} onClose=${p.onClose}
      speakText=${p.card.name + '. ' + q}
      actions=${html`<${C.Btn} kind="ok" icon="check" onClick=${p.onClose}>다 골랐어요<//>`}>
      <div class="row" style=${{ marginBottom: '.5rem' }}>
        <span style=${{ width: 56, height: 56, flex: '0 0 auto' }}><${C.ActivityArt} activity=${p.card} /></span>
        <b style=${{ fontSize: '1.25rem' }}>${p.card.name}</b>
      </div>
      <${C.PickGrid} cols=${4} label="활동 상태">
        ${App.DATA.mapStates.map(function (m) {
          return html`<${C.Pick} key=${m.id} selected=${!!st[m.id]}
            label=${m.name} speakText=${m.name}
            onClick=${function () { p.onToggle(m.id); }}
            art=${html`<${C.Art} iconKey=${m.icon} />`} />`;
        })}
      <//>
    <//>`;
  };
})();

</script>
